<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Columbus &middot; Microsoft Relationship Map</title>
<style>
/* ============================================================
   Columbus - Microsoft Relationship Map
   The app's one page: it renders everything, and every piece of data comes
   from the server (app/server.js, Postgres). The design reference it was
   copied from is the mockup, index.html at the repo root.
   ============================================================ */

:root{
  /* Columbus-inspired palette */
  --navy-900:#07203a;
  --navy-800:#0a2b4c;
  --navy-700:#0f3a63;
  --navy-600:#15507f;
  --navy-100:#e7eef6;
  --accent:#f2a33c;
  --accent-dark:#d4861d;

  --bg:#f4f6f9;
  --surface:#ffffff;
  --border:#dde3ec;
  --border-strong:#c3cddb;
  --text:#16232f;
  --text-muted:#61728a;
  --text-faint:#8b99ac;

  --danger:#c0392b;
  --danger-bg:#fdeceb;
  --ok:#1e7a44;
  --ok-bg:#e8f5ed;
  --warn-bg:#fff5e5;

  /* relation score ramp  -3 .. +3 */
  --s-m3:#a01427;
  --s-m2:#cf4436;
  --s-m1:#e08055;
  --s-0:#94a3b4;
  --s-p1:#71ab6b;
  --s-p2:#3d9457;
  --s-p3:#1c7040;

  /* chart furniture. --c-mark is the magnitude hue: the first step of the navy
     ramp that clears the OKLCH lightness band (0.43-0.77), the chroma floor
     (>=0.10) and 3:1 on white - checked with the palette validator, not by eye. */
  --c-mark:#1a5f96;
  --c-mark-soft:#e7eef6;
  --c-axis:#8b99ac;

  --radius:8px;
  --radius-lg:12px;
  --shadow-sm:0 1px 2px rgba(16,35,55,.08);
  --shadow:0 4px 14px rgba(16,35,55,.10);
  --shadow-lg:0 18px 50px rgba(7,32,58,.28);
  --sidebar-w:248px;
  --topbar-h:62px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-600)}

/* ---------- login ---------- */
.login{display:flex;min-height:100vh}
.login__brand{
  flex:1 1 46%;
  background:linear-gradient(150deg,var(--navy-900) 0%,var(--navy-700) 60%,var(--navy-600) 100%);
  color:#fff;padding:56px 60px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.login__brand::after{
  content:"";position:absolute;right:-120px;bottom:-140px;width:420px;height:420px;
  border-radius:50%;background:rgba(242,163,60,.14);
}
.login__brand h1{font-size:34px;line-height:1.2;max-width:15ch;position:relative;z-index:1}
.login__brand p{color:#bcd2e6;max-width:46ch;line-height:1.6;font-size:15px;position:relative;z-index:1}
.login__points{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:12px;position:relative;z-index:1}
.login__points li{display:flex;gap:10px;align-items:flex-start;color:#d5e4f2;font-size:14px}
.login__points i{color:var(--accent);font-weight:700;font-style:normal}
.login__logo{position:relative;z-index:1}
.login__logo strong{font-size:17px;letter-spacing:.06em}
.login__logo small{display:block;color:#8fabc7;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.login__form{flex:1 1 54%;display:flex;align-items:center;justify-content:center;padding:40px}
.login__card{width:100%;max-width:400px}
.login__card h2{font-size:22px;margin-bottom:6px}
.login__card>p{color:var(--text-muted);margin:0 0 26px}
.entra{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--navy-800);color:#fff;border:0;border-radius:var(--radius);
  padding:12px 16px;font-weight:600;cursor:pointer;
}
.entra:hover{background:var(--navy-700)}
.msgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:16px;height:16px}
.msgrid i{display:block}
.login__divider{display:flex;align-items:center;gap:12px;color:var(--text-faint);margin:20px 0;font-size:12px}
.login__divider::before,.login__divider::after{content:"";height:1px;background:var(--border);flex:1}
.login__note{
  margin-top:22px;padding:10px 12px;background:var(--warn-bg);border:1px solid #f2ddb5;
  border-radius:var(--radius);color:#7a5a1c;font-size:12.5px;line-height:1.5;
}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--navy-900);color:#c8d8e8;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.sidebar__logo{padding:20px 22px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.sidebar__logo strong{display:block;color:#fff;font-size:16px;letter-spacing:.02em}
.sidebar__logo small{display:block;color:#7e97b1;font-size:11px;margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
.nav{padding:14px 12px;display:grid;gap:2px;overflow-y:auto}
.nav__label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#69809a;padding:14px 10px 6px}
.nav__label:first-child{padding-top:2px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;
  color:#c8d8e8;text-decoration:none;font-size:13.5px;border-left:3px solid transparent;
}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:rgba(242,163,60,.13);color:#fff;border-left-color:var(--accent);font-weight:600}
/* A graphics page sits under its own dashboard, so it is indented and a shade
   quieter - the pairing has to be readable at a glance once there are four. */
.nav a.nav__child{margin-left:16px;font-size:12.5px;color:#a9bfd4}
.nav a.nav__child .ico{opacity:.6}
.nav a .ico{width:18px;text-align:center;opacity:.85;font-style:normal}
.nav a .pill{margin-left:auto;background:var(--accent);color:#3a2708;border-radius:20px;
  font-size:11px;font-weight:700;padding:1px 7px}
.sidebar__foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:#6f88a3;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:var(--topbar-h);flex:0 0 var(--topbar-h);background:var(--surface);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;
  padding:0 26px;position:sticky;top:0;z-index:30;
}
.topbar__title{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar__title small{display:block;font-weight:400;color:var(--text-faint);font-size:11.5px}
.topbar__spacer{flex:1}
.rolepick{display:flex;align-items:center;gap:8px}
.rolepick label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em}
.rolepick select{
  border:1px solid var(--border-strong);border-radius:6px;padding:6px 10px;background:#fff;
  font-size:13px;cursor:pointer;
}
.who{display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid var(--border)}
.who .avatar{width:32px;height:32px;border-radius:50%;background:var(--navy-700);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.who b{display:block;font-size:13px;font-weight:600}
.who span{display:block;font-size:11.5px;color:var(--text-faint)}

.page{padding:26px;max-width:1640px;width:100%}
.page--wide{max-width:none}
.page__head{display:flex;align-items:flex-start;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.page__head h2{font-size:20px}
.page__head p{margin:5px 0 0;color:var(--text-muted);max-width:80ch;line-height:1.55}
.page__actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- generic bits ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);
  background:#fff;border-radius:6px;padding:8px 13px;font-size:13px;cursor:pointer;
  white-space:nowrap;box-shadow:var(--shadow-sm);
}
.btn:hover:not(:disabled){border-color:var(--navy-600);color:var(--navy-700)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn--primary{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.btn--primary:hover:not(:disabled){background:var(--navy-700);border-color:var(--navy-700);color:#fff}
.btn--accent{background:var(--accent);border-color:var(--accent);color:#3a2708;font-weight:600}
.btn--accent:hover:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn--danger{color:var(--danger);border-color:#eec3bf}
.btn--danger:hover:not(:disabled){background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.btn--sm{padding:5px 9px;font-size:12px}
.btn--ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn--ghost:hover:not(:disabled){background:var(--navy-100)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.card__head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card__head h3{font-size:14.5px}
.card__head .spacer{flex:1}
.card__body{padding:18px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-size:24px;line-height:1.15;letter-spacing:-.02em}
.stat span{display:block;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--text-muted);margin-top:6px}

.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--border);background:#fbfcfe;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.field{display:flex;flex-direction:column;gap:4px}
.field>label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint)}
input[type=text],input[type=email],input[type=search],select,textarea{
  border:1px solid var(--border-strong);border-radius:6px;padding:8px 10px;background:#fff;font-size:13px;min-width:0;
}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(21,80,127,.25);outline-offset:0;border-color:var(--navy-600)}
input:disabled,select:disabled{background:#f3f5f8;color:var(--text-muted);cursor:not-allowed}
.search input{width:270px}
.toolbar .spacer{flex:1}
.hint{font-size:12px;color:var(--text-faint)}

table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);
  padding:10px 14px;border-bottom:1px solid var(--border);background:#fbfcfe;white-space:nowrap;font-weight:600;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--navy-700)}
thead th .arrow{opacity:.6;font-size:9px;margin-left:3px}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#f7fafd}
tbody tr.is-open{background:#f3f8fd}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.actions{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto;border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.person{display:flex;align-items:center;gap:10px}
.person .avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--navy-100);color:var(--navy-700);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.person b{display:block;font-size:13.5px;font-weight:600}
.person span{display:block;font-size:11.5px;color:var(--text-faint)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:11.5px;
  background:var(--navy-100);color:var(--navy-700);white-space:nowrap;font-weight:500}
.chip--muted{background:#eef1f5;color:var(--text-muted)}
.chip--role{background:#ece7fb;color:#5333b0}
.chip--src{background:#e9f3ea;color:#2c6b3d}

/* Relationship upkeep. The status carries meaning, so it gets colour of its own
   rather than borrowing the score ramp - an overdue +3 is not a negative score. */
.up-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;
  font-size:11.5px;font-weight:600}
.up-chip::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.up-chip--ok{background:#e7f5ec;color:#1b6b3a}
.up-chip--due{background:#fdf3e2;color:#9a6208}
.up-chip--over{background:#fdeaea;color:#a51f1f}
.up-chip--idle{background:#eef1f5;color:#6b7a8c}
.up-next{margin-bottom:18px}
.up-next b{font-size:13.5px;color:var(--e-navy)}
.up-mail{display:grid;gap:14px}
.up-mail__box{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:#fbfcfe}
.up-mail__box h4{margin:0 0 4px;font-size:13px}
.up-mail__box ul{margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.7;color:var(--text-muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}

.score{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 8px;
  border-radius:6px;color:#fff;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.score[data-s="-3"]{background:var(--s-m3)} .score[data-s="-2"]{background:var(--s-m2)}
.score[data-s="-1"]{background:var(--s-m1)} .score[data-s="0"]{background:var(--s-0)}
.score[data-s="1"]{background:var(--s-p1)}  .score[data-s="2"]{background:var(--s-p2)}
.score[data-s="3"]{background:var(--s-p3)}
.score--lg{height:30px;min-width:44px;font-size:14px}
.scoreline{display:flex;align-items:center;gap:8px}
.scoreline small{color:var(--text-muted);font-size:12px}

.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);
  border:1px solid var(--border);border-radius:20px;padding:4px 11px 4px 4px;background:#fff}
.legend b{color:var(--text);font-weight:600}

.bar{height:6px;border-radius:4px;background:#e8edf3;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--navy-600)}

.empty{padding:52px 20px;text-align:center;color:var(--text-muted)}
.empty b{display:block;font-size:15px;color:var(--text);margin-bottom:6px}
.placeholder{
  border:2px dashed var(--border-strong);border-radius:var(--radius-lg);
  background:repeating-linear-gradient(45deg,#fafcfe,#fafcfe 12px,#f4f7fb 12px,#f4f7fb 24px);
  padding:90px 24px;text-align:center;color:var(--text-muted);
}
.placeholder b{display:block;font-size:17px;color:var(--text);margin-bottom:8px}
.placeholder p{max-width:54ch;margin:0 auto;line-height:1.6}

.detailrow td{background:#f7fafd;padding:0}
.detailrow .inner{padding:14px 18px 18px 56px}
.detailrow h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:10px}
.minitable{width:100%;background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.minitable td,.minitable th{padding:8px 12px;font-size:12.5px}

/* drawer */
.drawer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end}
.drawer__bg{position:absolute;inset:0;background:rgba(7,32,58,.35)}
.drawer__panel{position:relative;width:min(470px,94vw);background:#fff;height:100%;overflow-y:auto;box-shadow:var(--shadow-lg)}
.drawer__head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.drawer__head h3{font-size:17px}
.drawer__head p{margin:4px 0 0;color:var(--text-muted);font-size:13px}
.drawer__body{padding:20px 22px;display:grid;gap:20px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:9px 14px;font-size:13px;margin:0}
.kv dt{color:var(--text-faint);font-size:12px}
.kv dd{margin:0}

/* modal */
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px}
.modal__bg{position:absolute;inset:0;background:rgba(7,32,58,.45)}
.modal__panel{position:relative;background:#fff;border-radius:var(--radius-lg);width:min(580px,100%);
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal__head{padding:18px 22px;border-bottom:1px solid var(--border)}
.modal__head h3{font-size:16px}
.modal__head p{margin:4px 0 0;color:var(--text-muted);font-size:12.5px}
.modal__body{padding:20px 22px;display:grid;gap:14px}
.modal__foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:#fbfcfe;
  border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;border:1px solid var(--border);border-radius:var(--radius);padding:11px;max-height:180px;overflow-y:auto}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
/* the skills dropdown: a <details> whose summary looks like the other drop-downs */
.skillpick summary{list-style:none;cursor:pointer;position:relative;border:1px solid var(--border-strong);border-radius:6px;
  padding:8px 28px 8px 10px;background:#fff;font-size:13px;min-height:36px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skillpick summary::-webkit-details-marker{display:none}
.skillpick summary::after{content:'\25BE';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
.skillpick[open] summary{border-color:var(--navy-600)}
.skillpick .checks{margin-top:6px;background:#fff}
.skillpick__add{display:flex;gap:6px;margin-top:6px}
.skillpick__add input{flex:1}

/* score picker */
.picker{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:#fff}
.picker button{border:0;background:#fff;padding:6px 10px;cursor:pointer;font-size:12.5px;font-weight:600;
  color:var(--text-muted);border-right:1px solid var(--border);font-variant-numeric:tabular-nums}
.picker button:last-child{border-right:0}
.picker button:hover{background:#eef3f9}
.picker button.on{color:#fff}
.picker button.on[data-s="-3"]{background:var(--s-m3)} .picker button.on[data-s="-2"]{background:var(--s-m2)}
.picker button.on[data-s="-1"]{background:var(--s-m1)} .picker button.on[data-s="0"]{background:var(--s-0)}
.picker button.on[data-s="1"]{background:var(--s-p1)}  .picker button.on[data-s="2"]{background:var(--s-p2)}
.picker button.on[data-s="3"]{background:var(--s-p3)}

/* my relations */
.rel{border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;background:#fff;display:grid;gap:12px}
.rel.dirty{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,163,60,.14)}
.rel__top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rel__top .spacer{flex:1}
.rel__note{width:100%;resize:vertical;min-height:54px}
.tag-new{background:var(--warn-bg);color:#8a6216;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600}

/* submissions */
.sub{border:1px solid var(--border);border-radius:var(--radius-lg);background:#fff;overflow:hidden}
.sub__head{display:flex;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
.sub__head:hover{background:#f7fafd}
.sub__head .spacer{flex:1}
.sub__body{border-top:1px solid var(--border);padding:14px 16px;background:#fbfcfe}
.diff{display:flex;align-items:center;gap:8px;color:var(--text-faint)}

/* toast */
#toasts{position:fixed;right:20px;bottom:20px;z-index:90;display:grid;gap:8px}
.toast{background:var(--navy-900);color:#fff;padding:11px 15px;border-radius:var(--radius);box-shadow:var(--shadow);
  font-size:13px;max-width:360px;animation:pop .18s ease-out}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.mockflag{background:var(--warn-bg);border:1px solid #f2ddb5;color:#7a5a1c;border-radius:var(--radius);
  padding:9px 13px;font-size:12.5px;line-height:1.5;margin-bottom:18px}
.readonly-note{background:var(--navy-100);border:1px solid #cfdcea;color:var(--navy-700);border-radius:var(--radius);
  padding:9px 13px;font-size:12.5px;margin-bottom:18px}

@media (max-width:1100px){
  .form-grid{grid-template-columns:1fr}
  .search input{width:190px}
}
/* keep the top bar on one line on smaller screens / narrow preview panes */
@media (max-width:1000px){
  .who div{display:none}
  .rolepick label{display:none}
  .topbar{padding:0 16px;gap:10px}
  .page{padding:18px}
}

/* ============================================================
   ECOSYSTEM MAP DASHBOARD
   Hub-and-spoke board. Everything is rendered from the ECO
   config object - nothing about the layout lives in markup.
   Own token set so the board can be lifted out on its own.
   ============================================================ */

.eco-root{
  --e-navy:#16243f;
  --e-ink:#1e293b;
  --e-muted:#64748b;
  --e-surface:#ffffff;
  --e-canvas:#fdfdfd;

  /* group accents - one per panel, no repeats */
  --e-violet:#7c4dff; --e-blue:#2563eb;   --e-green:#16a34a;  --e-teal:#0891b2;
  --e-rose:#be123c;   --e-orange:#ea580c; --e-amber:#d97706;  --e-slate:#475569;

  /* strength scale */
  --e-s-p3:#15803d; --e-s-p2:#22c55e; --e-s-p1:#86efac;
  --e-s-0:#94a3b8;
  --e-s-m1:#f97316; --e-s-m2:#dc2626;

  color:var(--e-ink);
  font-family:Inter,"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
}

/* ---------- toolbar (app chrome, deliberately outside the board) ---------- */
.eco-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.eco-tools .sp{flex:1}
.eco-chip{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);
  background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--e-ink);
}
.eco-chip:hover{border-color:var(--e-navy)}
.eco-chip[aria-pressed=true]{background:var(--e-navy);border-color:var(--e-navy);color:#fff}
.eco-tools .note{font-size:11.5px;color:var(--text-faint)}

/* ---------- canvas ---------- */
.eco-frame{position:relative;width:100%}
.eco-canvas{
  background:var(--e-canvas);border:1px solid #eef1f5;border-radius:16px;transform-origin:0 0;
}
.eco--ring .eco-canvas{width:1150px;height:862px;position:relative}
.eco--flow .eco-canvas{width:100%;padding:18px;border-radius:14px}

/* ---------- header strip ---------- */
.eco-head{max-width:740px}
.eco--ring .eco-head{position:absolute;left:20px;top:20px}
.eco-head h3{font-size:26px;line-height:1.15;font-weight:700;color:var(--e-navy);margin:0}
.eco-head p{margin:7px 0 0;font-size:12px;line-height:1.5;color:var(--e-muted)}

/* ---------- legend ---------- */
.eco-legend{
  background:var(--e-surface);border:1px solid #e6eaf0;border-radius:12px;padding:10px 14px 11px;
  box-shadow:0 2px 10px rgba(22,36,63,.06);
}
.eco--ring .eco-legend{position:absolute;right:20px;top:20px;width:298px}
.eco--flow .eco-legend{margin:14px 0 0;max-width:340px}
.eco-legend > b{
  display:block;font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--e-muted);margin-bottom:7px;
}
.eco-legend ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:3px 14px}
.eco-legend li{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--e-muted);line-height:1.35}
.eco-legend li span{width:10px;height:10px;border-radius:50%;flex:0 0 10px}

/* ---------- charts ----------
   Plain HTML bars, not SVG: text keeps its real size at any width and the card
   grows with its content, so the axis band can never fall outside a fixed height. */
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--border-strong);background:#fff;border-radius:999px;
  padding:6px 13px;font:inherit;font-size:12.5px;color:var(--e-ink);cursor:pointer;white-space:nowrap}
.seg button:hover{border-color:var(--e-navy)}
.seg button[aria-pressed=true]{background:var(--e-navy);border-color:var(--e-navy);color:#fff;font-weight:600}
.seg button:disabled{opacity:.4;cursor:not-allowed}

/* --- graphic view: the dashboard's boxes, applied to charts ---
   Its own copy of the three tokens it borrows, so nothing here reaches back
   into .eco-root and changes the dashboard. */
.gv{--e-navy:#16243f;--e-ink:#1e293b;--e-muted:#64748b}
.gv-head{margin-bottom:20px}
.gv-head h2{font-size:26px;line-height:1.15;font-weight:700;color:var(--e-navy);margin:0}
.gv-head p{margin:7px 0 0;font-size:12.5px;line-height:1.55;color:var(--e-muted);max-width:74ch}

.gv-ico{flex:0 0 32px;width:32px;height:32px;border-radius:9px;background:var(--a);color:#fff;
  display:flex;align-items:center;justify-content:center}
.gv-ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.gv-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px;margin-bottom:20px}
.gv-kpi{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:14px;
  background:color-mix(in srgb,var(--a) 7%,#fff);border:1px solid color-mix(in srgb,var(--a) 22%,#fff)}
.gv-kpi .gv-ico{flex-basis:30px;width:30px;height:30px;border-radius:8px}
.gv-kpi .gv-ico svg{width:17px;height:17px}
.gv-kpi b{display:block;font-size:22px;line-height:1.1;letter-spacing:-.02em;color:var(--a-dark)}
.gv-kpi span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);margin-top:3px}
.gv-kpi em{display:block;font-style:normal;font-size:11.5px;line-height:1.4;color:var(--e-muted);margin-top:5px}

/* Accent tints the head only. The body stays white so the score ramp keeps the
   contrast it was validated at. */
.gv-panel{background:#fff;border:1px solid color-mix(in srgb,var(--a) 22%,#fff);
  border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
.gv-panel__head{display:flex;align-items:flex-start;gap:10px;padding:13px 16px;
  background:color-mix(in srgb,var(--a) 7%,#fff);
  border-bottom:1px solid color-mix(in srgb,var(--a) 18%,#fff)}
.gv-panel__head h3{margin:1px 0 0;font-size:14px;font-weight:650;line-height:1.2;color:var(--a-dark)}
.gv-panel__head p{margin:3px 0 0;font-size:11.5px;line-height:1.45;color:var(--e-muted)}
.gv-panel__body{padding:16px 18px 18px}

/* The people behind one bar. Sits inside the panel body, separated by a rule
   rather than a card of its own - it belongs to the chart above it. */
.gv-drill{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.gv-drill__head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.gv-drill__head b{display:block;font-size:13px;font-weight:650;color:var(--e-navy)}
.gv-drill__head span{display:block;margin-top:2px;font-size:11.5px;color:var(--text-muted)}
.gv-drill__head button{margin-left:auto}
.gv-drill table{font-size:12.5px}

.gv-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.gv-tools > b{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}
.gv-tools .spacer{flex:1;min-width:8px}

/* horizontal bars - magnitude */
.bars{display:flex;flex-direction:column;gap:7px}
.bars__row{display:grid;grid-template-columns:minmax(96px,168px) 1fr 54px;align-items:center;
  gap:12px;min-height:26px;border-radius:6px;cursor:help;outline:none}
.bars__row[data-action]{cursor:pointer}
.bars__row:hover,.bars__row:focus-visible{background:#f7f9fc}
.bars__lbl{font-size:12px;line-height:1.3;color:var(--text)}
.bars__plot{position:relative;height:18px}
.bars__plot i{position:absolute;left:0;top:0;height:18px;border-radius:0 4px 4px 0;background:var(--a,var(--c-mark))}
.bars__plot i.is-zero{background:var(--c-mark-soft);border-radius:0 2px 2px 0}
.bars__val{font-size:12px;color:var(--text-muted);text-align:right;font-variant-numeric:tabular-nums}

/* horizontal bars - diverging around zero */
.dbars__plot{position:relative;height:18px}
.dbars__plot .zline{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--border-strong)}
.dbars__plot i{position:absolute;top:0;height:18px}
.dbars__plot i.pos{left:50%;border-radius:0 4px 4px 0}
.dbars__plot i.neg{right:50%;border-radius:4px 0 0 4px}

/* columns - the -3..+3 distribution */
.cols{display:flex;align-items:flex-end;gap:10px;height:150px}
.cols__col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  height:100%;gap:5px;border-radius:6px 6px 0 0;cursor:help;outline:none}
.cols__col:hover,.cols__col:focus-visible{background:#f7f9fc}
.cols__col[data-action]{cursor:pointer}
.cols__col[data-open],.bars__row[data-open]{background:var(--navy-100)}
.cols__val{font-size:11.5px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.cols__bar{width:100%;max-width:24px;border-radius:4px 4px 0 0;min-height:2px}
.cols__ax{display:flex;gap:10px;margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}
.cols__ax span{flex:1;text-align:center;font-size:11px;color:var(--c-axis);font-variant-numeric:tabular-nums}

.axnote{margin:12px 0 0;font-size:11px;color:var(--c-axis);
  display:grid;grid-template-columns:minmax(96px,168px) 1fr 54px;gap:12px}
.axnote__scale{grid-column:2;display:flex;justify-content:space-between;
  border-top:1px solid var(--border);padding-top:6px;font-variant-numeric:tabular-nums}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-top:18px}

/* ---------- shared tooltip ----------
   One box on <body>, positioned with JS. An absolutely positioned child would be
   clipped by .tablewrap (overflow-x:auto) and mis-placed inside the scaled canvas. */
.tipbox{
  position:fixed;left:0;top:0;z-index:200;max-width:320px;
  background:var(--navy-900);color:#fff;font-size:11px;line-height:1.45;
  padding:8px 11px;border-radius:8px;box-shadow:var(--shadow-lg);
  opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none;
}
.tipbox.is-on{opacity:1;visibility:visible}
.has-tip{display:inline-flex;align-items:center;gap:6px;cursor:help;outline:none;white-space:nowrap}
.has-tip:focus-visible{outline:2px solid var(--accent, #2563eb);outline-offset:2px;border-radius:6px}

.infoi{
  flex:0 0 15px;width:15px;height:15px;padding:0;border-radius:50%;cursor:help;
  border:1px solid currentColor;background:transparent;color:inherit;opacity:.65;
  font-family:inherit;font-weight:600;font-size:10px;line-height:13px;
  text-align:center;letter-spacing:0;text-transform:none;
}
.infoi:hover,.infoi:focus-visible{opacity:1}

.tipbox .defs > b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:7px}
.defs__row{display:flex;align-items:flex-start;gap:8px;padding:3px 0}
.defs__row i{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:4px}
.defs__v{flex:0 0 22px;font-weight:700;font-variant-numeric:tabular-nums}
.defs__t{display:block}
.defs__t b{display:block;font-weight:600}
.defs__t em{display:block;font-style:normal;opacity:.72}

.scale-head{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:10px}
.sched{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sched__main{flex:1 1 240px;min-width:220px}
.sched__main .scale-head{margin-bottom:4px}
.sched__toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);padding-bottom:9px;white-space:nowrap}

/* Same definitions, rendered in full rather than on hover. */
.defs--inline{margin-top:13px;padding-top:11px;border-top:1px solid var(--border);
  font-size:11.5px;line-height:1.45;color:var(--text-muted);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 20px}
.defs--inline > b{grid-column:1/-1;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:4px}
.defs--inline .defs__t b{color:var(--text)}

/* ---------- connector layer ---------- */
.eco-links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.eco--flow .eco-links{display:none}
.eco-links line{stroke-width:2;stroke-dasharray:3 5;stroke-linecap:round;opacity:.42;transition:opacity .15s,stroke-width .15s}
.eco-links line.is-hot{opacity:1;stroke-width:3}
.eco-links line.is-dim{opacity:.14}

/* ---------- hub ---------- */
.eco-hub{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:var(--e-navy);color:#fff;box-shadow:0 6px 22px rgba(22,36,63,.28);
}
.eco--ring .eco-hub{
  position:absolute;left:510px;top:301px;width:130px;height:130px;border-radius:50%;z-index:3;
  outline:9px solid rgba(253,253,253,.92);
}
.eco--flow .eco-hub{
  border-radius:14px;padding:16px;margin-bottom:16px;flex-direction:row;gap:10px;
  justify-content:flex-start;align-items:baseline;text-align:left;
}
.eco-hub b{display:block;font-size:15px;font-weight:700;letter-spacing:.01em}
.eco-hub span{display:block;font-size:10.5px;font-weight:400;color:#a9bcd4;margin-top:2px}
.eco--flow .eco-hub b{font-size:18px}
.eco--flow .eco-hub span{margin-top:0}

/* ---------- group panels ---------- */
.eco--flow .eco-board{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.eco--flow .eco-hub{grid-column:1/-1}
.eco--narrow .eco-board{grid-template-columns:1fr}

.eco-panel{
  background:color-mix(in srgb,var(--a) 7%,#fff);
  border:1px solid color-mix(in srgb,var(--a) 22%,#fff);
  border-radius:14px;padding:12px;z-index:2;transition:opacity .15s;
}
.eco--ring .eco-panel{position:absolute}
.eco--flow .eco-panel{width:auto!important;min-height:0!important;left:auto!important;top:auto!important}
.eco-panel.is-dim{opacity:.7}
/* Every panel is its own stacking context, so a popover (strength picker, role
   tip) could not rise above the next panel or the hub. The panel in use is lifted. */
.eco-panel:has(.ppick),.eco-panel:hover{z-index:4}

.eco-panel__head{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
.eco-ico{
  flex:0 0 34px;width:34px;height:34px;border-radius:9px;background:var(--a);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.eco-ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eco-panel__head h4{margin:1px 0 0;font-size:14px;font-weight:650;line-height:1.2;color:var(--a-dark)}
.eco-panel__head small{display:block;font-size:10px;font-weight:400;color:var(--e-muted);margin-top:2px;line-height:1.3}

/* ---------- panel bodies ---------- */
.eco-body{display:grid;gap:7px}
.eco-body--grid-2{grid-template-columns:1fr 1fr}
.eco-body--rows,.eco-body--bare{grid-template-columns:1fr}

/* ---------- person card ---------- */
.pcard{
  position:relative;background:var(--e-surface);border:1px solid #edf0f4;border-radius:10px;padding:7px;
  transition:transform .12s,box-shadow .12s,opacity .15s;
}
.pcard.is-muted{opacity:.26}
.pcard:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(22,36,63,.10);z-index:5}
.eco-body--bare .pcard{background:none;border:0;padding:2px 0;box-shadow:none}
.eco-body--bare .pcard:hover{transform:none;box-shadow:none}

/* stacked variant: avatar top-left, meta beside it, strength below the avatar */
.eco-body--grid-2 .pcard{display:grid;grid-template-columns:34px 1fr;gap:4px 8px}
.eco-body--grid-2 .pdot{grid-column:1/-1}

/* row variant: one line, strength pinned far right */
.eco-body--rows .pcard,.eco-body--bare .pcard{display:flex;align-items:center;gap:8px}
.eco-body--rows .pcard{padding:4px 7px}
.eco-body--rows .pav{width:26px;height:26px;flex:0 0 26px;font-size:10px}
.eco-body--bare .pav{width:30px;height:30px;flex:0 0 30px}
.eco-body--rows .pmeta,.eco-body--bare .pmeta{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 5px}
.eco-body--rows .pmid,.eco-body--bare .pmid{display:inline;color:#b8c1cf}
.eco-body--rows .pdot,.eco-body--bare .pdot{margin-left:auto}

/* below 700px every body becomes the row variant */
.eco--narrow .eco-body{grid-template-columns:1fr}
.eco--narrow .eco-body .pcard{display:flex;align-items:center;gap:8px}
.eco--narrow .eco-body .pmeta{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 5px}
.eco--narrow .eco-body .pmid{display:inline;color:#b8c1cf}
.eco--narrow .eco-body .pdot{margin-left:auto;grid-column:auto}

.pav{
  width:34px;height:34px;border-radius:50%;flex:0 0 34px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--a) 15%,#fff);color:var(--a-dark);
  font-size:11px;font-weight:650;letter-spacing:.02em;
}
.pav img{width:100%;height:100%;object-fit:cover;display:block}
.pmeta{min-width:0}
.pname{display:block;font-size:12px;font-weight:600;line-height:1.2;color:var(--a-dark)}
.prole{display:block;font-size:10px;font-weight:400;line-height:1.22;color:var(--e-muted)}
.prole em{font-style:normal;color:#9aa6b6}
.pmid{display:none}

/* strength indicator */
.pdot{
  display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:1px 2px;margin:0;
  font:inherit;font-size:10px;color:var(--e-muted);cursor:pointer;border-radius:6px;line-height:1;white-space:nowrap;
}
.pdot b{
  width:16px;height:16px;border-radius:50%;flex:0 0 16px;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;letter-spacing:-.02em;background:var(--d-bg);color:var(--d-fg);
}
.pdot--none b{background:#fff;border:1.5px dashed #b9c3d1;color:#93a1b3}
.pdot:hover{background:#f1f4f8;color:var(--e-ink)}

/* strength picker popover */
.ppick{
  position:absolute;left:6px;top:calc(100% - 4px);z-index:40;background:#fff;border:1px solid #dfe4ec;
  border-radius:10px;box-shadow:0 12px 30px rgba(22,36,63,.20);padding:5px;display:grid;gap:2px;min-width:160px;
}
.ppick button{
  display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 6px;border-radius:6px;
  font:inherit;font-size:11px;color:var(--e-ink);cursor:pointer;text-align:left;
}
.ppick button:hover{background:#f2f5f9}
.ppick button i{width:14px;height:14px;border-radius:50%;flex:0 0 14px;border:1px solid rgba(0,0,0,.06)}
.ppick button.is-on{background:#eef2f7;font-weight:600}

/* hover tooltip with the full, untruncated role */
.ptip{
  position:absolute;left:8px;bottom:calc(100% + 6px);z-index:30;background:var(--e-navy);color:#fff;
  font-size:10.5px;line-height:1.35;padding:6px 9px;border-radius:7px;max-width:220px;width:max-content;
  opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none;
}
.pcard:hover .ptip,.pcard:focus-within .ptip{opacity:1;visibility:visible}

/* ---------- "how we work together" card ---------- */
.eco-modes{
  background:var(--e-surface);border:1px solid #e6eaf0;border-radius:14px;padding:12px 14px;
  box-shadow:0 2px 10px rgba(22,36,63,.06);z-index:2;
}
.eco--ring .eco-modes{position:absolute}
.eco--flow .eco-modes{width:auto!important;min-height:0!important;left:auto!important;top:auto!important}
.eco-modes > b{display:block;font-size:12px;font-weight:650;color:var(--e-navy);margin-bottom:12px}
.eco-modes ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.eco-modes li{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.eco-modes li span{
  width:30px;height:30px;border-radius:50%;background:#f1f4f8;color:#7c8798;
  display:flex;align-items:center;justify-content:center;
}
.eco-modes li span svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eco-modes li small{font-size:9px;line-height:1.25;color:var(--e-muted)}

/* ---------- print: the board and nothing else ---------- */
@page{size:landscape;margin:10mm}
@media print{
  .sidebar,.topbar,.eco-tools,#toasts,.drawer,.modal{display:none!important}
  .page{padding:0;max-width:none}
  .eco-canvas{border:0;background:#fff}
  .infoi,.tipbox{display:none !important}
  .pcard:hover{transform:none;box-shadow:none}
}

/* ---------- focus + motion ---------- */
.eco-root :focus-visible{outline:2px solid var(--e-navy);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){
  .eco-root *,.eco-links line{transition:none!important}
  .pcard:hover{transform:none}
}
</style>

<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toasts"></div>
<script>
/* ============================================================
   1. CONSTANTS
   ============================================================ */

// Relation score scale, -3 .. +3. This is the single source of truth for the
// wording, the description and the colour - tables, pickers and the
// dashboard legend all read it, so the scale can never say two different things.
// bg/fg are the dot colours on the dashboard; fg keeps the number readable.
var SCORE_LEVELS = [
  { v:  3, label: 'Trusted advisor', bg:'#15803d', fg:'#ffffff', desc: 'They reach out to us proactively - we are a first call.' },
  { v:  2, label: 'Strong',          bg:'#22c55e', fg:'#062e12', desc: 'Regular contact, mutual trust, ongoing dialogue.' },
  { v:  1, label: 'Positive',        bg:'#86efac', fg:'#062e12', desc: 'Occasional contact, good rapport.' },
  { v:  0, label: 'Neutral',         bg:'#94a3b8', fg:'#0f172a', desc: 'Aware of each other, no real working relationship.' },
  { v: -1, label: 'Weak',            bg:'#f97316', fg:'#2b1000', desc: 'Limited or one-sided contact.' },
  { v: -2, label: 'Strained',        bg:'#dc2626', fg:'#ffffff', desc: 'Friction or lost momentum in the relationship.' },
  { v: -3, label: 'Damaged',         bg:'#991b1b', fg:'#ffffff', desc: 'Actively avoids working with us.' }
];
function scoreLevel(v){ for (var i=0;i<SCORE_LEVELS.length;i++){ if (SCORE_LEVELS[i].v === v) return SCORE_LEVELS[i]; } return SCORE_LEVELS[3]; }

/* Highest first - "Viewing as" offers your own role and the ones after it.
   For now both roles have the same access; the roles lists below and canEdit()
   are where that would change. */
var ROLES = [
  { id:'admin',    name:'Admin' },
  { id:'standard', name:'Standard' }
];
function roleName(id){ for (var i=0;i<ROLES.length;i++){ if (ROLES[i].id===id) return ROLES[i].name; } return id; }

// Menu sections, in the order they appear in the sidebar.
var NAV_SECTIONS = ['Dashboards', 'Administration', 'Relations'];

// Which pages each role may open. Drives the left menu AND route guarding.
/* The fixed pages. The two pages every dashboard has - its board and its
   graphics - are generated per board in allPages(), so a board added from the UI
   gets its menu entries and its route guard without a code change. */
var PAGES = [
  /* `wide` drops the reading-width cap: the boards and the administration tables
     are wide by nature and were leaving a strip of empty page on a large screen. */
  { route:'upkeep',            title:'Relationship Upkeep', sub:'Who reaches out, and when',   icon:'◷', section:'Administration', wide:true, roles:['admin','standard'] },
  { route:'dashboards',        title:'Dashboards',          sub:'Boards & their panels',       icon:'▩', section:'Administration', wide:true, roles:['admin','standard'] },
  { route:'ms-domains',        title:'Microsoft Domains',   sub:'Categories & mapping',        icon:'◆', section:'Administration', wide:true, roles:['admin','standard'] },
  { route:'ms-profiles',       title:'Microsoft Profiles',  sub:'Approved Microsoft contacts', icon:'●', section:'Administration', wide:true, roles:['admin','standard'] },
  { route:'history',           title:'History',             sub:'Every change, and undo',      icon:'\u21ba', section:'Administration', wide:true, roles:['admin','standard'] },
  { route:'backups',           title:'Backups',             sub:'Whole-database copies',       icon:'\u25a4', section:'Administration', wide:true, roles:['admin'] },
  { route:'columbus-profiles', title:'Columbus Profiles',   sub:'Internal users & relations',  icon:'▲', section:'Administration', wide:true, roles:['admin','standard'] },
  { route:'my-relations',      title:'My Relations',        sub:'Your own Microsoft contacts', icon:'★', section:'Relations',              roles:['admin','standard'] }
];
function allPages(){
  var out = [];
  state.boards.forEach(function(b){
    out.push({ route:b.dashboard, title:'Dashboard - ' + b.label, sub:'Overview', icon:'\u25a6',
               section:'Dashboards', wide:true, roles:['admin','standard'] });
    out.push({ route:b.graphics, title:'Graphics - ' + b.label, sub:'Numbers & breakdowns', icon:'\u25c8',
               section:'Dashboards', child:true, wide:true, roles:['admin','standard'] });
  });
  /* The upkeep graphics belong with the other boards, even though the table they
     summarise is an administration page. */
  out.push({ route:'upkeep-graphics', title:'Graphics - Upkeep', sub:'Who is keeping in touch',
             icon:'\u25c8', section:'Dashboards', wide:true,
             roles:['admin','standard'] });
  return out.concat(PAGES);
}
function pageFor(route){
  var all = allPages();
  for (var i=0;i<all.length;i++){ if (all[i].route===route) return all[i]; }
  return null;
}
function canOpen(route, role){ var p = pageFor(route); return !!p && p.roles.indexOf(role) !== -1; }
// ponytail: both roles may change data for now. Take 'standard' out to make it
// admin-only again (and the same in ADMIN in app/server.js).
function canEdit(){ return ['admin', 'standard'].indexOf(state.session.role) !== -1; }

var MS_GROUPS  = ['Leadership','Account Team','Technical Specialist','Partner Development','Marketing'];
var MS_SOURCES = ['Ayla\'s list','Microsoft DK leadership page','LinkedIn / MS Pulse','LinkedIn / Thomas\' deck','Microsoft DK org chart','Manual entry','Unconfirmed'];
// The system domain every unplaced Microsoft profile falls back to.
var UNMARKED_ID = 'd0';

/* How often the owner of a Microsoft relationship is reminded to reach out.
   `none` is the default: a person is only in the reminder loop when somebody
   deliberately puts them there, or the monthly mail becomes a list nobody reads.
   Everybody is still tracked - last contact shows on every profile. */
var CADENCES = [
  { id:'none',      label:'No reminder',    months:0  },
  { id:'monthly',   label:'Monthly',        months:1  },
  { id:'quarterly', label:'Quarterly',      months:3  },
  { id:'half',      label:'Every 6 months', months:6  },
  { id:'yearly',    label:'Yearly',         months:12 }
];
function cadence(id){ for (var i=0;i<CADENCES.length;i++){ if (CADENCES[i].id === id) return CADENCES[i]; } return CADENCES[0]; }

/* The skills to pick from. Anything someone has added to a profile is offered
   to everybody too (skillOptions), so the list grows as people use it. */
var SKILLS = ['Adoption','AI','Alliances','Architecture','Azure','Bids','Campaigns','Co-sell','Compliance','Copilot',
  'D365 CE','D365 F&O','Data platform','Delivery','Entra','ERP','Events','Fabric','Governance','Landing zones','M365',
  'Migration','PMO','Power BI','Power Platform','Presales','Public sector','Public tenders','Sales','Security',
  'Strategy','Teams'];

// Columbus' departments in this app, for now just these two.
var CB_DEPARTMENTS = ['Data & AI', 'Dynamics'];

/* ============================================================
   2. DATA
   Filled by load() from /api/state, which returns these arrays in exactly
   this shape. Nothing is seeded here: an empty database is an empty app, and
   the mockup's data is db/seed.sql.
   ============================================================ */

var state = {
  /* userId is always the server's; role is who you are "viewing as". */
  session: { userId:null, role:'admin' },
  me: { userId:null, role:'admin', email:'', name:'' },    // who the server says you are
  today: '',
  customers: [], contacts: [], boards: [], domains: [],
  msProfiles: [], columbusProfiles: [], relations: [],

  // Transient UI state - survives re-renders, not reloads.
  ui: {
    route:'login',
    msSearch:'', msBoard:'', msDomain:'', msGroup:'', msSource:'', msBand:'', msSort:'name', msDir:1, msDetail:null,
    cbSearch:'', cbDept:'', cbRole:'', cbSort:'name', cbDir:1, cbOpen:null,
    myDraft:null, myPicker:'',
    upSearch:'', upOwner:'', upStatus:'', upSort:'rank', upDir:1,
    ugBoard:'', ugView:'chart', ugDrill:null,
    ecoFilter:'', ecoPick:null,
    gvDim:'domain', gvMeasure:'mean', gvView:'chart', gvDrill:null
  }
};

/* ============================================================
   3. SMALL HELPERS
   ============================================================ */

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* The server's date, so the page and the database agree on what "today" is. */
function today(){ return state.today; }
// Pure string date maths - today() is a plain 'YYYY-MM-DD' string.
function addMonths(iso, n){
  var p = String(iso).split('-'), y = parseInt(p[0],10), m = parseInt(p[1],10) - 1 + n, d = parseInt(p[2],10);
  y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  var last = [31, (y%4===0 && y%100!==0)||y%400===0 ? 29 : 28, 31,30,31,30,31,31,30,31,30,31][m];
  if (d > last) d = last;
  return y + '-' + (m+1 < 10 ? '0' : '') + (m+1) + '-' + (d < 10 ? '0' : '') + d;
}
function realDomains(){ return state.domains.filter(function(d){ return !d.system; }); }
function initials(name){
  var parts = String(name).trim().split(/\s+/);
  return ((parts[0]||'')[0] || '') + ((parts[parts.length-1]||'')[0] || '');
}
function byId(list, id){ for (var i=0;i<list.length;i++){ if (list[i].id === id) return list[i]; } return null; }
function ms(id){ return byId(state.msProfiles, id); }
function cb(id){ return byId(state.columbusProfiles, id); }
function dom(id){ return byId(state.domains, id); }
/* Signed in without a Columbus profile yet (an empty database): show the e-mail. */
function me(){ return cb(state.session.userId) || { name:state.me.email, email:state.me.email, department:'' }; }
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){
  /* Unknown, not Never: a missing date means nobody recorded one. */
  if (!d) return '<span class="hint">Unknown</span>';
  var p = String(d).split('-');
  return esc(p[2] + ' ' + MONTHS[parseInt(p[1],10)-1] + ' ' + p[0]);
}
function signed(n){ return (n > 0 ? '+' : '') + n; }
function clampScore(n){ return Math.max(-3, Math.min(3, n)); }

/* Both averages are computed from the same list of raw relation scores.
   The mean is what we show; the median rides along in the hover box. */
function meanOf(a){
  if (!a.length) return 0;
  var t = 0; a.forEach(function(v){ t += v; });
  return t / a.length;
}
function medianOf(a){
  if (!a.length) return 0;
  var s = a.slice().sort(function(x, y){ return x - y; }), n = s.length;
  return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
}
/* One decimal, always signed, no trailing ".0" noise on whole numbers. */
function fmtScore(n){
  var r = Math.round(n * 10) / 10;
  return (r > 0 ? '+' : '') + r;
}

/* --- derived numbers (never stored twice) --- */
function relationsForMs(msId){
  return state.relations.filter(function(r){ return r.msProfileId === msId; });
}
function relationsForCb(cbId){
  return state.relations.filter(function(r){ return r.columbusId === cbId; });
}
function msStats(msId){
  var rs = relationsForMs(msId), scores = [], sum = 0, best = null;
  rs.forEach(function(r){ scores.push(r.score); sum += r.score; if (best === null || r.score > best) best = r.score; });
  return { count: rs.length, scores: scores, sum: sum, best: best,
           mean: meanOf(scores), median: medianOf(scores), avg: meanOf(scores) };
}
function cbStats(cbId){
  var rs = relationsForCb(cbId), scores = [], sum = 0;
  rs.forEach(function(r){ scores.push(r.score); sum += r.score; });
  return { count: rs.length, scores: scores, sum: sum,
           mean: meanOf(scores), median: medianOf(scores), avg: meanOf(scores) };
}
function domainStats(dId){
  var profiles = state.msProfiles.filter(function(p){ return p.domainIds.indexOf(dId) !== -1; });
  /* Every individual relation in the domain, flattened - so the median is a
     median of real scores, not a median of per-profile averages. */
  var scores = [], sum = 0, covered = 0;
  profiles.forEach(function(p){
    var s = msStats(p.id);
    scores = scores.concat(s.scores); sum += s.sum;
    if (s.count > 0 && s.best >= 1) covered++;
  });
  return {
    profiles: profiles.length,
    connections: scores.length,
    count: scores.length,
    scores: scores,
    sum: sum,
    mean: meanOf(scores),
    median: medianOf(scores),
    avg: meanOf(scores),
    coverage: profiles.length ? Math.round(covered / profiles.length * 100) : 0
  };
}

/* --- reusable markup --- */
function scoreChip(v, big){
  if (v === null || v === undefined) return '<span class="chip chip--muted">none</span>';
  return '<span class="score' + (big ? ' score--lg' : '') + '" data-s="' + v + '" title="' +
         esc(scoreLevel(v).label + ' - ' + scoreLevel(v).desc) + '">' + signed(v) + '</span>';
}
function scoreLegend(){
  return '<div class="legend">' + SCORE_LEVELS.map(function(l){
    return '<div title="' + esc(l.desc) + '">' + scoreChip(l.v) + '<b>' + esc(l.label) + '</b></div>';
  }).join('') + '</div>';
}
/* "Relationship scale" heading + (i). Used above every scoreLegend(). */
function scaleHeading(){
  return '<h3 class="scale-head">Relationship scale' + infoIcon('score-defs', 'What the scores mean') + '</h3>';
}
/* The aggregate cell. Mean is the number on the chip; the median is one
   hover away. Both come from the same stats object, so they can never drift. */
function scoreStat(st){
  if (!st.count) return '<span class="chip chip--muted">none</span>';
  var tip = 'Mean ' + fmtScore(st.mean) + '  \u00b7  Median ' + fmtScore(st.median) +
            '  \u00b7  ' + st.count + ' relation' + (st.count === 1 ? '' : 's') +
            '  \u00b7  sum ' + signed(st.sum);
  return '<span class="has-tip" tabindex="0" data-tip="' + esc(tip) + '">' +
         scoreChip(clampScore(Math.round(st.mean))) +
         ' <small class="hint">mean ' + fmtScore(st.mean) + '</small></span>';
}

/* The written definition of the -3..+3 scale. One source, used by the
   dashboard legend and every "relationship scale" card. */
function scoreDefsHtml(variant){
  return '<div class="defs' + (variant === 'inline' ? ' defs--inline' : '') + '"><b>What the scores mean</b>' + SCORE_LEVELS.map(function(l){
    var c = l.bg;
    return '<div class="defs__row"><i style="background:' + c + '"></i>' +
           '<span class="defs__v">' + signed(l.v) + '</span>' +
           '<span class="defs__t"><b>' + esc(l.label) + '</b><em>' + esc(l.desc) + '</em></span></div>';
  }).join('') + '</div>';
}
var TIP_HTML = { 'score-defs': scoreDefsHtml };

/* Small circled i. Shares the one body-level tooltip, so it is never
   clipped by a scrolling table or the scaled dashboard canvas. */
function infoIcon(tipId, label){
  return '<button type="button" class="infoi" data-tip-id="' + esc(tipId) + '" tabindex="0" ' +
         'aria-label="' + esc(label || 'Score definitions') + '">i</button>';
}

function scorePicker(value, action, extraAttr){
  return '<div class="picker">' + SCORE_LEVELS.slice().reverse().map(function(l){
    return '<button type="button" data-action="' + action + '" data-score="' + l.v + '" data-s="' + l.v +
           '" class="' + (value === l.v ? 'on' : '') + '" title="' + esc(l.label + ' - ' + l.desc) + '" ' +
           (extraAttr || '') + '>' + signed(l.v) + '</button>';
  }).join('') + '</div>';
}
function personCell(name, sub){
  return '<div class="person"><span class="avatar">' + esc(initials(name)) + '</span><div><b>' +
         esc(name) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div></div>';
}
function domainChips(ids){
  if (!ids || !ids.length) return '<span class="hint">Unmapped</span>';
  return '<div class="chips">' + ids.map(function(id){
    var d = dom(id); return d ? '<span class="chip">' + esc(d.name) + '</span>' : '';
  }).join('') + '</div>';
}
function sortArrow(active, dir){ return active ? '<span class="arrow">' + (dir === 1 ? '▲' : '▼') + '</span>' : ''; }
function sortBy(list, key, dir){
  return list.slice().sort(function(a, b){
    var x = a[key], y = b[key];
    if (typeof x === 'string') { x = x.toLowerCase(); y = String(y).toLowerCase(); }
    if (x < y) return -dir;
    if (x > y) return dir;
    return 0;
  });
}
function toast(msg, kind){
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3600);
}

/* ============================================================
   UPKEEP - owner, contact log, and whether a relationship is
   being maintained.

   A score says how good a relationship is. It says nothing about whether anyone
   has spoken to the person this year, and that is the part that decays quietly.
   So every Microsoft person carries an owner, an optional reminder cadence, and
   a log of the times somebody reached out.
   ============================================================ */

function contactsFor(msId){
  return state.contacts.filter(function(c){ return c.msProfileId === msId; })
    .sort(function(a, b){ return a.date < b.date ? 1 : -1; });      // newest first
}
function lastContactOf(msId){
  var list = contactsFor(msId);
  return list.length ? list[0] : null;
}
function ownerOf(p){ return p && p.ownerId ? cb(p.ownerId) : null; }

/* Who may be made owner: only somebody who actually has a relation to them.
   Owning a person you have never spoken to would be a title, not a job. */
function eligibleOwners(msId){
  return relationsForMs(msId).map(function(r){ return cb(r.columbusId); })
    .filter(function(c){ return !!c; })
    .sort(function(a, b){ return a.name < b.name ? -1 : 1; });
}

function daysBetween(a, b){
  return Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
}

/* The state of one person's upkeep. `days` is null when nothing is logged -
   Unknown, not Never: an empty log means nobody wrote it down. */
function upkeepOf(p){
  var last = lastContactOf(p.id);
  var cad = cadence(p.cadence);
  var days = last ? daysBetween(last.date, today()) : null;
  var state_ = 'untracked';
  if (!cad.months)        state_ = last ? 'logged' : 'unknown';
  else if (days === null) state_ = 'overdue';
  else if (days > cad.months * 30)      state_ = 'overdue';
  else if (days > cad.months * 30 - 10) state_ = 'due';
  else                                  state_ = 'ok';
  return { last:last, days:days, cadence:cad, status:state_ };
}
var UPKEEP_LABELS = {
  ok:      { label:'On track',  cls:'ok' },
  due:     { label:'Due soon',  cls:'due' },
  overdue: { label:'Overdue',   cls:'over' },
  logged:  { label:'No reminder', cls:'idle' },
  unknown: { label:'Unknown',   cls:'idle' }
};

/* The reminder goes out on the first Monday of the month. */
function firstMondayAfter(iso){
  var d = new Date(Date.parse(iso));
  var y = d.getUTCFullYear(), m = d.getUTCMonth();
  function firstMonday(yy, mm){
    var first = new Date(Date.UTC(yy, mm, 1));
    var shift = (8 - first.getUTCDay()) % 7;        // 0 = Sunday, 1 = Monday
    return new Date(Date.UTC(yy, mm, 1 + shift));
  }
  var cand = firstMonday(y, m);
  if (cand <= d) cand = firstMonday(m === 11 ? y + 1 : y, (m + 1) % 12);
  return cand.toISOString().slice(0, 10);
}

/* Everyone who would be named in the next mail, grouped by the owner who gets it. */
function reminderQueue(){
  var out = [];
  state.msProfiles.forEach(function(p){
    if (!p.ownerId || !cadence(p.cadence).months) return;
    var u = upkeepOf(p);
    if (u.status !== 'overdue' && u.status !== 'due') return;
    var row = null;
    out.forEach(function(x){ if (x.ownerId === p.ownerId) row = x; });
    if (!row) { row = { ownerId:p.ownerId, people:[] }; out.push(row); }
    row.people.push(p);
  });
  return out.sort(function(a, b){ return b.people.length - a.people.length; });
}

function customersOf(p){
  return (p.customerIds || []).map(function(id){ return byId(state.customers, id); })
    .filter(function(c){ return !!c; });
}
/* Logged by the signed-in user, dated today - the server fills in both. */
function registerContact(msId){
  var p = ms(msId);
  return write('POST', '/api/contacts', { msProfileId:msId }, function(){
    toast('Contact registered for ' + (p ? p.name : 'this person'), 'ok');
  });
}

/* ============================================================
   4. ROUTER + SHELL
   ============================================================ */

function go(route){
  if (location.hash !== '#/' + route) { location.hash = '#/' + route; }
  else { state.ui.route = route; render(); }
}
function readHash(){
  var r = (location.hash || '').replace(/^#\/?/, '') || 'login';
  if (r !== state.ui.route) { state.ui.gvDrill = null; state.ui.ugDrill = null; state.ui.hist = null; state.ui.bk = null; }   // they belong to one page
  state.ui.route = r;
}
window.addEventListener('hashchange', function(){ readHash(); render(); });

function render(){
  var route = state.me.email ? state.ui.route : 'login';   // not signed in: nothing but the login page
  // Signed in without a profile: the account page, and nothing else. With one: never the account page.
  if (state.me.email && !state.me.userId && route !== 'create-account') { go('create-account'); return; }
  if (state.me.userId && route === 'create-account') { go('dashboard'); return; }

  if (route === 'create-account') { document.getElementById('app').innerHTML = viewAccount(); return; }
  if (route === 'login') { document.getElementById('app').innerHTML = viewLogin(); return; }

  // Fall back to the first page the current role is allowed to see.
  if (!canOpen(route, state.session.role)) {
    var allowed = allPages().filter(function(p){ return p.roles.indexOf(state.session.role) !== -1; })[0];
    route = state.ui.route = allowed ? allowed.route : 'my-relations';
    if (location.hash !== '#/' + route) { location.hash = '#/' + route; return; }
  }

  var body = '';
  /* Every board renders through the same two views - which one they show comes
     from the route, via activeBoard(). */
  var routeBoard = boardForRoute(route);
  if (routeBoard && routeBoard.dashboard === route)     body = viewDashboard();
  else if (routeBoard && routeBoard.graphics === route) body = viewGraphicView();
  else if (route === 'dashboards')         body = viewDashboards();
  else if (route === 'upkeep')            body = viewUpkeep();
  else if (route === 'upkeep-graphics')   body = viewUpkeepGraphics();
  else if (route === 'ms-profiles')       body = viewMsProfiles();
  else if (route === 'ms-domains')        body = viewMsDomains();
  else if (route === 'columbus-profiles') body = viewColumbusProfiles();
  else if (route === 'my-relations')      body = viewMyRelations();
  else if (route === 'history')           body = viewHistory();
  else if (route === 'backups')           body = viewBackups();

  /* Prose reads better with a measured line length, so the page is capped by
     default - but the pages that carry a board or a wide table say so for
     themselves, and use whatever screen they are given. */
  var pageCls = (pageFor(route) || {}).wide ? 'page page--wide' : 'page';

}

function sidebar(route){

/* Named slots on the ring, in design units on a 1150 x 700 canvas.

var ECO_W = 1150, ECO_H = 862;

/* Group accents. The dark shade is what titles and names use, so the
   text keeps AA contrast against the 7% tint behind it. */
var ECO_ACCENTS = {

  green: { c:'#16a34a', d:'#15803d' }, teal:  { c:'#0891b2', d:'#0e7490' },

};

/* The -3..+3 scale. fg is picked per step so the number on the dot stays readable.
   The board keeps its own wording - see SCORE_LEVELS for the wording the tables use. */
var ECO_STRENGTH = [

  { v:-3, bg:'#dc2626', fg:'#ffffff', label:'Negative' }
];
function ecoLevel(v){

function ecoIcon(name){

/* ------------------------------------------------------------
   The board config. This is the whole data model from the brief:
   org, meta, groups[] (with people[]) and collaborationModes[].
   ------------------------------------------------------------ */
/* The footer block under the ring. Shared, so every board - seeded or added in
   the UI - carries the same five collaboration modes. */
var ECO_MODES = [
  { icon:'target',    label:'Strategic alignment' },
  { icon:'coins',     label:'Co-sell & pipeline' },
  { icon:'wrench',    label:'Technical collaboration' },
  { icon:'flag',      label:'Program & funding' },
  { icon:'smile',     label:'Customer success' }
];

/* Which board a route belongs to, and the config behind it. */
function boards(){ return state.boards; }
function boardById(id){ return byId(state.boards, id) || state.boards[0]; }
function boardForRoute(route){
  for (var i = 0; i < state.boards.length; i++) {
    if (state.boards[i].dashboard === route || state.boards[i].graphics === route) return state.boards[i];
  }
  return null;
}
/* The board the current page is showing. Falls back to the first one so the
   helpers below are safe to call from anywhere. */
function activeBoard(){ return boardForRoute(state.ui.route) || state.boards[0]; }
function eco(){ return ecoConfig(activeBoard().id); }

/* Where a domain without a hand-tuned panel goes. One entry per ring slot, in
   the order the domains are filled into them - the ninth slot is the "How we
   work together" block, which is why eight is the ceiling. Hand-tuned panels
   (domains.panel, seeded for the first two boards) use the same slots. */
var ECO_DERIVED_SLOTS = [
  { position:'left-1',        accent:'violet', icon:'trending-up', layout:'grid-2', connect:true,  max:4 },
  { position:'centre-top',    accent:'blue',   icon:'lightbulb',   layout:'rows',   connect:true,  max:3 },
  { position:'right-1',       accent:'green',  icon:'briefcase',   layout:'grid-2', connect:true,  max:4 },
  { position:'left-2',        accent:'rose',   icon:'building',    layout:'grid-2', connect:true,  max:4 },
  { position:'right-2',       accent:'teal',   icon:'users',       layout:'grid-2', connect:true,  max:4 },
  { position:'centre-bottom', accent:'orange', icon:'layers',      layout:'rows',   connect:true,  max:3 },
  { position:'bottom-1',      accent:'amber',  icon:'gift',        layout:'bare',   connect:false, max:4 },
  { position:'bottom-2',      accent:'slate',  icon:'globe',       layout:'bare',   connect:false, max:4 }
];
var ECO_PANEL_LIMIT = ECO_DERIVED_SLOTS.length;

/* One panel per domain. A domain with a hand-tuned panel keeps its slot; one
   without takes the next slot no tuned panel on this board is using, so the two
   never land on top of each other. Panels come out in slot order, which is the
   order the narrow-screen layout stacks them in. Rebuilt on every read rather
   than cached: a domain added, renamed or reassigned then shows up on the board
   without anything having to remember to invalidate it. */
function buildBoardConfig(b){
  var slots = ECO_DERIVED_SLOTS.map(function(s){ return s.position; });
  var doms = boardDomains(b.id);
  var taken = doms.map(function(d){ return d.panel ? d.panel.position : null; });
  var free = ECO_DERIVED_SLOTS.filter(function(s){ return taken.indexOf(s.position) === -1; });
  var groups = [];
  doms.forEach(function(d){
    var p = d.panel || free.shift();
    if (!p || groups.length >= ECO_PANEL_LIMIT) return;
    groups.push({ id:b.id + '--' + d.id, title:p.title || d.name, subtitle:p.subtitle || null,
                  accent:p.accent, icon:p.icon, layout:p.layout, position:p.position, connect:p.connect,
                  domainId:d.id, max:p.max, people:ecoPeopleFor(d.id) });
  });
  groups.sort(function(x, y){ return slots.indexOf(x.position) - slots.indexOf(y.position); });
  return { org:{}, meta:{}, groups:groups, collaborationModes:ECO_MODES };
}

/* The board config for one id. Panels come from its domains; org and meta from
   the editable board record, so renaming a dashboard renames its hub, its
   heading and its menu entries. */
function ecoConfig(id){
  var b = boardById(id);
  var cfg = buildBoardConfig(b);
  cfg.org  = { name:'Columbus', domain:b.label };
  cfg.meta = { subtitle:b.subtitle, updated:b.updated, version:b.version, owner:b.owner };
  return cfg;
}
/* How many domains a board has that the ring has no room for. */
function boardOverflow(id){ return Math.max(0, boardDomains(id).length - ECO_PANEL_LIMIT); }

/* A board owns its domains; a profile belongs to a board through them. Someone
   placed in domains from two boards therefore appears on both - that is all the
   dual membership is, with no second field to keep in sync. */
function boardDomains(id){
  return state.domains.filter(function(d){ return !d.system && d.dept === id; });
}
function profileInBoard(p, id){
  var ids = boardDomains(id).map(function(d){ return d.id; });
  for (var i = 0; i < p.domainIds.length; i++) { if (ids.indexOf(p.domainIds[i]) !== -1) return true; }
  return false;
}
function boardProfiles(id){
  return state.msProfiles.filter(function(p){ return profileInBoard(p, id); });
}
function boardRelations(id){
  var ids = boardProfiles(id).map(function(p){ return p.id; });
  return state.relations.filter(function(r){ return ids.indexOf(r.msProfileId) !== -1; });
}
/* Every board a person shows up on - used for the Dashboard column and filter
   on Microsoft Profiles. */
function boardsOfProfile(p){
  return state.boards.filter(function(b){ return profileInBoard(p, b.id); });
}

/* The board is not a second list of people. It reads state.msProfiles, so the
   dashboard and the Microsoft Profiles page can never describe different people.
   Strength is the profile's mean score, the same number the tables show. */
function ecoPeopleFor(domainId){
  return state.msProfiles.filter(function(p){ return p.domainIds.indexOf(domainId) !== -1; })
    .map(function(p){
      var st = msStats(p.id);
      return {
        msId: p.id, name: p.name, role: p.title, avatar: null,
        strength: st.count ? clampScore(Math.round(st.mean)) : null,
        tentative: !!p.tentative
      };
    });
}

/* ------------------------------------------------------------
   Rendering
   ------------------------------------------------------------ */

function ecoSlotStyle(pos){
  var s = ECO_SLOTS[pos];
  if (!s) return '';
  /* min-height rather than height: a panel grows instead of truncating text */
  return 'left:' + s.x + 'px;top:' + s.y + 'px;width:' + s.w + 'px;min-height:' + s.h + 'px;';
}

/* One dotted spoke per connected panel, in the group's own accent.
   The geometry is filled in by ecoDrawLinks() once the panels have been laid
   out, so a spoke still lands on the right edge when a panel grows. */
function ecoConnectors(){
  var lines = eco().groups.map(function(g){
    if (!g.connect) return '';
    var a = ECO_ACCENTS[g.accent] || ECO_ACCENTS.slate;
    var pt = ecoSpoke(ECO_SLOTS[g.position]);
    return '<line data-link="' + g.id + '" x1="' + pt[0] + '" y1="' + pt[1] +
           '" x2="' + pt[2] + '" y2="' + pt[3] + '" stroke="' + a.c + '"/>';
  }).join('');

  return '<svg class="eco-links" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + ECO_W + ' ' + ECO_H +
         '" aria-hidden="true">' + lines + '</svg>';
}

/* Hub edge -> nearest edge of a box, as [x1,y1,x2,y2]. */
function ecoSpoke(box){
  if (!box) return [0,0,0,0];
  var tx = Math.max(box.x, Math.min(ECO_HUB.x, box.x + box.w));
  var ty = Math.max(box.y, Math.min(ECO_HUB.y, box.y + box.h));
  var dx = tx - ECO_HUB.x, dy = ty - ECO_HUB.y;
  var len = Math.sqrt(dx*dx + dy*dy) || 1;
  var ux = dx/len, uy = dy/len;
  return [
    (ECO_HUB.x + ux * (ECO_HUB.r + 11)).toFixed(1),
    (ECO_HUB.y + uy * (ECO_HUB.r + 11)).toFixed(1),
    (tx - ux * 4).toFixed(1),
    (ty - uy * 4).toFixed(1)
  ];
}

/* Re-aim every spoke at where its panel actually ended up. */
function ecoDrawLinks(){
  var root = document.getElementById('eco');
  if (!root || root.className.indexOf('eco--ring') === -1) return;
  var links = root.querySelectorAll('[data-link]');
  for (var i = 0; i < links.length; i++) {
    var el = links[i];
    var p = root.querySelector('[data-panel="' + el.getAttribute('data-link') + '"]');
    if (!p) continue;
    var pt = ecoSpoke({ x:p.offsetLeft, y:p.offsetTop, w:p.offsetWidth, h:p.offsetHeight });
    el.setAttribute('x1', pt[0]); el.setAttribute('y1', pt[1]);
    el.setAttribute('x2', pt[2]); el.setAttribute('y2', pt[3]);
  }
}

function ecoLegend(){
  var order = [3, 2, 1, 0, -1, -2];
  var items = order.map(function(v){
    var l = ecoLevel(v);
    var text = v === -2 ? '-2 to -3 Negative' : (v > 0 ? '+' + v : String(v)) + ' ' + l.label;
    return '<li><span style="background:' + l.bg + '"></span>' + esc(text) + '</li>';
  }).join('');
  return '<div class="eco-legend"><b>Relationship strength</b><ul>' + items + '</ul></div>';
}

/* One person. The same markup in every layout - CSS decides whether it
   reads as a stacked card, a full-width row or a bare line. */
function ecoPerson(g, p, i){
  /* Keyed by person, not position: a capped panel re-sorts its people, so an
     index would point the dot at somebody else. */
  var key = g.id + ':' + p.msId;
  var lvl = p.strength === null || p.strength === undefined ? null : ecoLevel(p.strength);
  var av  = p.avatar
    ? '<span class="pav"><img src="' + esc(p.avatar) + '" alt=""/></span>'
    : '<span class="pav">' + esc(initials(p.name)) + '</span>';

  var dotStyle = lvl ? 'style="--d-bg:' + lvl.bg + ';--d-fg:' + lvl.fg + '"' : '';
  var dotFace  = lvl ? (p.strength > 0 ? '+' + p.strength : String(p.strength)) : '?';
  var dotText  = lvl ? lvl.label : 'Not scored';
  var dot =
    '<button type="button" class="pdot' + (lvl ? '' : ' pdot--none') + '" ' + dotStyle +
      ' data-action="eco-dot" data-id="' + esc(key) + '" aria-haspopup="true"' +
      ' aria-expanded="' + (state.ui.ecoPick === key ? 'true' : 'false') + '"' +
      ' aria-label="' + esc(p.name + ' - relationship strength: ' + dotText + '. Change') + '">' +
      '<b>' + dotFace + '</b>' + esc(dotText) + '</button>';

  var pick = state.ui.ecoPick === key ? ecoPicker(key, p.strength) : '';

  /* dim rather than hide, so the shape of the map never changes */
  var muted = '';
  if (state.ui.ecoFilter === 'unscored' && lvl) muted = ' is-muted';
  if (state.ui.ecoFilter === 'strong' && !(p.strength >= 2)) muted = ' is-muted';

  var role = esc(p.role) + (p.tentative ? ' <em>(to confirm)</em>' : '');

  return '<div class="pcard' + muted + '" data-person="' + esc(key) + '">' +
    av +
    '<span class="pmeta"><b class="pname">' + esc(p.name) + '</b>' +
      '<span class="pmid">&middot;</span><span class="prole">' + role + '</span></span>' +
    dot +
    '<span class="ptip" role="tooltip">' + esc(p.name) + ' &middot; ' + role + '</span>' +
    pick +
  '</div>';
}

function ecoPicker(key, current){
  var opts = ECO_STRENGTH.map(function(l){
    var on = current === l.v ? ' is-on' : '';

    return '<button type="button" class="' + on.slice(1) + '" data-action="eco-set" data-id="' + esc(key) +
           '" data-v="' + l.v + '"><i style="background:' + l.bg + '"></i>' + face + ' ' + esc(l.label) + '</button>';
  }).join('');
  var none = '<button type="button" class="' + (current === null || current === undefined ? 'is-on' : '') +
             '" data-action="eco-set" data-id="' + esc(key) + '" data-v="none">' +
             '<i style="background:#fff;border:1.5px dashed #b9c3d1"></i>Not scored</button>';
  return '<div class="ppick">' + opts + none + '</div>';
}

function ecoPanel(g){
  var a = ECO_ACCENTS[g.accent] || ECO_ACCENTS.slate;
  var list = g.people, hidden = 0;

  /* A capped panel shows the scored people first and counts the rest. Without
     this a 35-name account team would grow straight through the panel below it,
     and the interesting names would be the ones pushed out of sight. */
  if (g.max && list.length > g.max) {
    list = list.slice().sort(function(x, y){
      var sx = x.strength === null || x.strength === undefined ? -99 : x.strength;
      var sy = y.strength === null || y.strength === undefined ? -99 : y.strength;
      return sy - sx;
    });
    hidden = list.length - g.max;
    list = list.slice(0, g.max);
  }

  var people = list.map(function(p, i){ return ecoPerson(g, p, i); }).join('');

  /* Inline styles, not a class: ecoCss() only carries the .eco/.pcard family
     into the SVG export, so a new class name would come out unstyled there. */
  if (hidden) {
    people += '<div class="pmeta" style="grid-column:1/-1;display:flex;align-items:center;gap:6px;' +
      'margin-top:2px;font-size:11px;color:' + a.d + '">' +
      '<b style="font-weight:700">+' + hidden + ' more</b>' +
      '<span style="color:#7c8ea3">see Microsoft Profiles</span></div>';
  }

  var sub = g.subtitle ? '<small>' + esc(g.subtitle) + '</small>' : '';

  return '<section class="eco-panel" data-panel="' + esc(g.id) + '" data-slot="' + esc(g.position) + '"' +
      ' aria-labelledby="ecoh-' + esc(g.id) + '"' +
      ' style="--a:' + a.c + ';--a-dark:' + a.d + ';' + ecoSlotStyle(g.position) + '">' +
    '<div class="eco-panel__head"><span class="eco-ico">' + ecoIcon(g.icon) + '</span>' +
      '<div><h4 id="ecoh-' + esc(g.id) + '">' + esc(g.title) + '</h4>' + sub + '</div></div>' +
    '<div class="eco-body eco-body--' + esc(g.layout) + '">' + people + '</div>' +
  '</section>';
}
