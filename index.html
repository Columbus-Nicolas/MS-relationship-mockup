<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Columbus &middot; Microsoft Relationship Map</title>
<style>
/* ============================================================
   Columbus - Microsoft Relationship Map (UI mockup)
   Single-file mockup. No dependencies, no backend, fictional data.
   ============================================================ */

:root{
  /* Columbus-inspired palette */
  --navy-900:#07203a;
  --navy-800:#0a2b4c;
  --navy-700:#0f3a63;
  --navy-600:#15507f;
  --navy-100:#e7eef6;
  --accent:#f2a33c;
  --accent-dark:#d4861d;

  --bg:#f4f6f9;
  --surface:#ffffff;
  --border:#dde3ec;
  --border-strong:#c3cddb;
  --text:#16232f;
  --text-muted:#61728a;
  --text-faint:#8b99ac;

  --danger:#c0392b;
  --danger-bg:#fdeceb;
  --ok:#1e7a44;
  --ok-bg:#e8f5ed;
  --warn-bg:#fff5e5;

  /* relation score ramp  -3 .. +3 */
  --s-m3:#a01427;
  --s-m2:#cf4436;
  --s-m1:#e08055;
  --s-0:#94a3b4;
  --s-p1:#71ab6b;
  --s-p2:#3d9457;
  --s-p3:#1c7040;

  --radius:8px;
  --radius-lg:12px;
  --shadow-sm:0 1px 2px rgba(16,35,55,.08);
  --shadow:0 4px 14px rgba(16,35,55,.10);
  --shadow-lg:0 18px 50px rgba(7,32,58,.28);
  --sidebar-w:248px;
  --topbar-h:62px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-600)}

/* ---------- login ---------- */
.login{display:flex;min-height:100vh}
.login__brand{
  flex:1 1 46%;
  background:linear-gradient(150deg,var(--navy-900) 0%,var(--navy-700) 60%,var(--navy-600) 100%);
  color:#fff;padding:56px 60px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.login__brand::after{
  content:"";position:absolute;right:-120px;bottom:-140px;width:420px;height:420px;
  border-radius:50%;background:rgba(242,163,60,.14);
}
.login__brand h1{font-size:34px;line-height:1.2;max-width:15ch;position:relative;z-index:1}
.login__brand p{color:#bcd2e6;max-width:46ch;line-height:1.6;font-size:15px;position:relative;z-index:1}
.login__points{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:12px;position:relative;z-index:1}
.login__points li{display:flex;gap:10px;align-items:flex-start;color:#d5e4f2;font-size:14px}
.login__points i{color:var(--accent);font-weight:700;font-style:normal}
.login__logo{position:relative;z-index:1}
.login__logo strong{font-size:17px;letter-spacing:.06em}
.login__logo small{display:block;color:#8fabc7;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.login__form{flex:1 1 54%;display:flex;align-items:center;justify-content:center;padding:40px}
.login__card{width:100%;max-width:400px}
.login__card h2{font-size:22px;margin-bottom:6px}
.login__card>p{color:var(--text-muted);margin:0 0 26px}
.entra{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--navy-800);color:#fff;border:0;border-radius:var(--radius);
  padding:12px 16px;font-weight:600;cursor:pointer;
}
.entra:hover{background:var(--navy-700)}
.msgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:16px;height:16px}
.msgrid i{display:block}
.login__divider{display:flex;align-items:center;gap:12px;color:var(--text-faint);margin:20px 0;font-size:12px}
.login__divider::before,.login__divider::after{content:"";height:1px;background:var(--border);flex:1}
.login__note{
  margin-top:22px;padding:10px 12px;background:var(--warn-bg);border:1px solid #f2ddb5;
  border-radius:var(--radius);color:#7a5a1c;font-size:12.5px;line-height:1.5;
}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--navy-900);color:#c8d8e8;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.sidebar__logo{padding:20px 22px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.sidebar__logo strong{display:block;color:#fff;font-size:16px;letter-spacing:.02em}
.sidebar__logo small{display:block;color:#7e97b1;font-size:11px;margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
.nav{padding:14px 12px;display:grid;gap:2px;overflow-y:auto}
.nav__label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#69809a;padding:14px 10px 6px}
.nav__label:first-child{padding-top:2px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;
  color:#c8d8e8;text-decoration:none;font-size:13.5px;border-left:3px solid transparent;
}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:rgba(242,163,60,.13);color:#fff;border-left-color:var(--accent);font-weight:600}
.nav a .ico{width:18px;text-align:center;opacity:.85;font-style:normal}
.nav a .pill{margin-left:auto;background:var(--accent);color:#3a2708;border-radius:20px;
  font-size:11px;font-weight:700;padding:1px 7px}
.sidebar__foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:#6f88a3;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:var(--topbar-h);flex:0 0 var(--topbar-h);background:var(--surface);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;
  padding:0 26px;position:sticky;top:0;z-index:30;
}
.topbar__title{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar__title small{display:block;font-weight:400;color:var(--text-faint);font-size:11.5px}
.topbar__spacer{flex:1}
.rolepick{display:flex;align-items:center;gap:8px}
.rolepick label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em}
.rolepick select{
  border:1px solid var(--border-strong);border-radius:6px;padding:6px 10px;background:#fff;
  font-size:13px;cursor:pointer;
}
.who{display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid var(--border)}
.who .avatar{width:32px;height:32px;border-radius:50%;background:var(--navy-700);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.who b{display:block;font-size:13px;font-weight:600}
.who span{display:block;font-size:11.5px;color:var(--text-faint)}

.page{padding:26px;max-width:1640px;width:100%}
.page__head{display:flex;align-items:flex-start;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.page__head h2{font-size:20px}
.page__head p{margin:5px 0 0;color:var(--text-muted);max-width:80ch;line-height:1.55}
.page__actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- generic bits ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);
  background:#fff;border-radius:6px;padding:8px 13px;font-size:13px;cursor:pointer;
  white-space:nowrap;box-shadow:var(--shadow-sm);
}
.btn:hover:not(:disabled){border-color:var(--navy-600);color:var(--navy-700)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn--primary{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.btn--primary:hover:not(:disabled){background:var(--navy-700);border-color:var(--navy-700);color:#fff}
.btn--accent{background:var(--accent);border-color:var(--accent);color:#3a2708;font-weight:600}
.btn--accent:hover:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn--danger{color:var(--danger);border-color:#eec3bf}
.btn--danger:hover:not(:disabled){background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.btn--sm{padding:5px 9px;font-size:12px}
.btn--ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn--ghost:hover:not(:disabled){background:var(--navy-100)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.card__head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card__head h3{font-size:14.5px}
.card__head .spacer{flex:1}
.card__body{padding:18px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-size:24px;line-height:1.15;letter-spacing:-.02em}
.stat span{display:block;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--text-muted);margin-top:6px}

.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--border);background:#fbfcfe;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.field{display:flex;flex-direction:column;gap:4px}
.field>label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint)}
input[type=text],input[type=email],input[type=search],select,textarea{
  border:1px solid var(--border-strong);border-radius:6px;padding:8px 10px;background:#fff;font-size:13px;min-width:0;
}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(21,80,127,.25);outline-offset:0;border-color:var(--navy-600)}
.search input{width:270px}
.toolbar .spacer{flex:1}
.hint{font-size:12px;color:var(--text-faint)}

table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);
  padding:10px 14px;border-bottom:1px solid var(--border);background:#fbfcfe;white-space:nowrap;font-weight:600;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--navy-700)}
thead th .arrow{opacity:.6;font-size:9px;margin-left:3px}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#f7fafd}
tbody tr.is-open{background:#f3f8fd}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.actions{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto;border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.person{display:flex;align-items:center;gap:10px}
.person .avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--navy-100);color:var(--navy-700);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.person b{display:block;font-size:13.5px;font-weight:600}
.person span{display:block;font-size:11.5px;color:var(--text-faint)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:11.5px;
  background:var(--navy-100);color:var(--navy-700);white-space:nowrap;font-weight:500}
.chip--muted{background:#eef1f5;color:var(--text-muted)}
.chip--role{background:#ece7fb;color:#5333b0}
.chip--src{background:#e9f3ea;color:#2c6b3d}
.chips{display:flex;flex-wrap:wrap;gap:4px}

.score{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 8px;
  border-radius:6px;color:#fff;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.score[data-s="-3"]{background:var(--s-m3)} .score[data-s="-2"]{background:var(--s-m2)}
.score[data-s="-1"]{background:var(--s-m1)} .score[data-s="0"]{background:var(--s-0)}
.score[data-s="1"]{background:var(--s-p1)}  .score[data-s="2"]{background:var(--s-p2)}
.score[data-s="3"]{background:var(--s-p3)}
.score--lg{height:30px;min-width:44px;font-size:14px}
.scoreline{display:flex;align-items:center;gap:8px}
.scoreline small{color:var(--text-muted);font-size:12px}

.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);
  border:1px solid var(--border);border-radius:20px;padding:4px 11px 4px 4px;background:#fff}
.legend b{color:var(--text);font-weight:600}

.bar{height:6px;border-radius:4px;background:#e8edf3;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--navy-600)}

.empty{padding:52px 20px;text-align:center;color:var(--text-muted)}
.empty b{display:block;font-size:15px;color:var(--text);margin-bottom:6px}
.placeholder{
  border:2px dashed var(--border-strong);border-radius:var(--radius-lg);
  background:repeating-linear-gradient(45deg,#fafcfe,#fafcfe 12px,#f4f7fb 12px,#f4f7fb 24px);
  padding:90px 24px;text-align:center;color:var(--text-muted);
}
.placeholder b{display:block;font-size:17px;color:var(--text);margin-bottom:8px}
.placeholder p{max-width:54ch;margin:0 auto;line-height:1.6}

.detailrow td{background:#f7fafd;padding:0}
.detailrow .inner{padding:14px 18px 18px 56px}
.detailrow h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:10px}
.minitable{width:100%;background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.minitable td,.minitable th{padding:8px 12px;font-size:12.5px}

/* drawer */
.drawer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end}
.drawer__bg{position:absolute;inset:0;background:rgba(7,32,58,.35)}
.drawer__panel{position:relative;width:min(470px,94vw);background:#fff;height:100%;overflow-y:auto;box-shadow:var(--shadow-lg)}
.drawer__head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.drawer__head h3{font-size:17px}
.drawer__head p{margin:4px 0 0;color:var(--text-muted);font-size:13px}
.drawer__body{padding:20px 22px;display:grid;gap:20px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:9px 14px;font-size:13px;margin:0}
.kv dt{color:var(--text-faint);font-size:12px}
.kv dd{margin:0}

/* modal */
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px}
.modal__bg{position:absolute;inset:0;background:rgba(7,32,58,.45)}
.modal__panel{position:relative;background:#fff;border-radius:var(--radius-lg);width:min(580px,100%);
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal__head{padding:18px 22px;border-bottom:1px solid var(--border)}
.modal__head h3{font-size:16px}
.modal__head p{margin:4px 0 0;color:var(--text-muted);font-size:12.5px}
.modal__body{padding:20px 22px;display:grid;gap:14px}
.modal__foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:#fbfcfe;
  border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;border:1px solid var(--border);border-radius:var(--radius);padding:11px;max-height:180px;overflow-y:auto}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}

/* score picker */
.picker{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:#fff}
.picker button{border:0;background:#fff;padding:6px 10px;cursor:pointer;font-size:12.5px;font-weight:600;
  color:var(--text-muted);border-right:1px solid var(--border);font-variant-numeric:tabular-nums}
.picker button:last-child{border-right:0}
.picker button:hover{background:#eef3f9}
.picker button.on{color:#fff}
.picker button.on[data-s="-3"]{background:var(--s-m3)} .picker button.on[data-s="-2"]{background:var(--s-m2)}
.picker button.on[data-s="-1"]{background:var(--s-m1)} .picker button.on[data-s="0"]{background:var(--s-0)}
.picker button.on[data-s="1"]{background:var(--s-p1)}  .picker button.on[data-s="2"]{background:var(--s-p2)}
.picker button.on[data-s="3"]{background:var(--s-p3)}

/* my relations */
.rel{border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;background:#fff;display:grid;gap:12px}
.rel.dirty{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,163,60,.14)}
.rel__top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rel__top .spacer{flex:1}
.rel__note{width:100%;resize:vertical;min-height:54px}
.tag-new{background:var(--warn-bg);color:#8a6216;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600}

/* submissions */
.sub{border:1px solid var(--border);border-radius:var(--radius-lg);background:#fff;overflow:hidden}
.sub__head{display:flex;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
.sub__head:hover{background:#f7fafd}
.sub__head .spacer{flex:1}
.sub__body{border-top:1px solid var(--border);padding:14px 16px;background:#fbfcfe}
.diff{display:flex;align-items:center;gap:8px;color:var(--text-faint)}

/* toast */
#toasts{position:fixed;right:20px;bottom:20px;z-index:90;display:grid;gap:8px}
.toast{background:var(--navy-900);color:#fff;padding:11px 15px;border-radius:var(--radius);box-shadow:var(--shadow);
  font-size:13px;max-width:360px;animation:pop .18s ease-out}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.mockflag{background:var(--warn-bg);border:1px solid #f2ddb5;color:#7a5a1c;border-radius:var(--radius);
  padding:9px 13px;font-size:12.5px;line-height:1.5;margin-bottom:18px}
.readonly-note{background:var(--navy-100);border:1px solid #cfdcea;color:var(--navy-700);border-radius:var(--radius);
  padding:9px 13px;font-size:12.5px;margin-bottom:18px}

@media (max-width:1100px){
  .form-grid{grid-template-columns:1fr}
  .search input{width:190px}
}
/* keep the top bar on one line on smaller screens / narrow preview panes */
@media (max-width:1000px){
  .who div{display:none}
  .rolepick label{display:none}
  .topbar{padding:0 16px;gap:10px}
  .page{padding:18px}
}

/* ============================================================
   ECOSYSTEM MAP DASHBOARD
   Hub-and-spoke board. Everything is rendered from the ECO
   config object - nothing about the layout lives in markup.
   Own token set so the board can be lifted out on its own.
   ============================================================ */

.eco-root{
  --e-navy:#16243f;
  --e-ink:#1e293b;
  --e-muted:#64748b;
  --e-surface:#ffffff;
  --e-canvas:#fdfdfd;

  /* group accents - one per panel, no repeats */
  --e-violet:#7c4dff; --e-blue:#2563eb;   --e-green:#16a34a;  --e-teal:#0891b2;
  --e-rose:#be123c;   --e-orange:#ea580c; --e-amber:#d97706;  --e-slate:#475569;

  /* strength scale */
  --e-s-p3:#15803d; --e-s-p2:#22c55e; --e-s-p1:#86efac;
  --e-s-0:#94a3b8;
  --e-s-m1:#f97316; --e-s-m2:#dc2626;

  color:var(--e-ink);
  font-family:Inter,"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
}

/* ---------- toolbar (app chrome, deliberately outside the board) ---------- */
.eco-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.eco-tools .sp{flex:1}
.eco-chip{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);
  background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--e-ink);
}
.eco-chip:hover{border-color:var(--e-navy)}
.eco-chip[aria-pressed=true]{background:var(--e-navy);border-color:var(--e-navy);color:#fff}
.eco-tools .note{font-size:11.5px;color:var(--text-faint)}

/* ---------- canvas ---------- */
.eco-frame{position:relative;width:100%}
.eco-canvas{
  background:var(--e-canvas);border:1px solid #eef1f5;border-radius:16px;transform-origin:0 0;
}

/* ============================================================
   3. SMALL HELPERS
   ============================================================ */

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(prefix){ uid.n = (uid.n || 0) + 1; return prefix + '_' + uid.n + '_' + (uid.n * 7919 % 9973); }
function today(){ return '2026-08-19'; }
function initials(name){
  var parts = String(name).trim().split(/\s+/);
  return ((parts[0]||'')[0] || '') + ((parts[parts.length-1]||'')[0] || '');
}
function byId(list, id){ for (var i=0;i<list.length;i++){ if (list[i].id === id) return list[i]; } return null; }
function ms(id){ return byId(state.msProfiles, id); }
function cb(id){ return byId(state.columbusProfiles, id); }
function dom(id){ return byId(state.domains, id); }
function me(){ return cb(state.session.userId) || state.columbusProfiles[0]; }
function fmtDate(d){
  if (!d) return '<span class="hint">Never</span>';
  var p = String(d).split('-');
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return esc(p[2] + ' ' + months[parseInt(p[1],10)-1] + ' ' + p[0]);
}
function signed(n){ return (n > 0 ? '+' : '') + n; }
function clampScore(n){ return Math.max(-3, Math.min(3, n)); }

/* --- derived numbers (never stored twice) --- */
function relationsForMs(msId){
  return state.relations.filter(function(r){ return r.msProfileId === msId; });
}
function relationsForCb(cbId){
  return state.relations.filter(function(r){ return r.columbusId === cbId; });
}
function msStats(msId){
  var rs = relationsForMs(msId), sum = 0, best = null;
  rs.forEach(function(r){ sum += r.score; if (best === null || r.score > best) best = r.score; });
  return { count: rs.length, sum: sum, best: best, avg: rs.length ? sum / rs.length : 0 };
}
function cbStats(cbId){
  var rs = relationsForCb(cbId), sum = 0;
  rs.forEach(function(r){ sum += r.score; });
  return { count: rs.length, sum: sum, avg: rs.length ? Math.round(sum / rs.length) : 0 };
}
function domainStats(dId){
  var profiles = state.msProfiles.filter(function(p){ return p.domainIds.indexOf(dId) !== -1; });
  var conns = 0, sum = 0, covered = 0;
  profiles.forEach(function(p){
    var s = msStats(p.id);
    conns += s.count; sum += s.sum;
    if (s.count > 0 && s.best >= 1) covered++;
  });
  return {
    profiles: profiles.length,
    connections: conns,
    sum: sum,
    avg: conns ? Math.round(sum / conns) : 0,
    coverage: profiles.length ? Math.round(covered / profiles.length * 100) : 0
  };
}
function pendingCount(){ return state.submissions.length; }

/* --- reusable markup --- */
function scoreChip(v, big){
  if (v === null || v === undefined) return '<span class="chip chip--muted">none</span>';
  return '<span class="score' + (big ? ' score--lg' : '') + '" data-s="' + v + '" title="' +
         esc(scoreLevel(v).label + ' - ' + scoreLevel(v).desc) + '">' + signed(v) + '</span>';
}
function scoreLegend(){
  return '<div class="legend">' + SCORE_LEVELS.map(function(l){
    return '<div title="' + esc(l.desc) + '">' + scoreChip(l.v) + '<b>' + esc(l.label) + '</b></div>';
  }).join('') + '</div>';
}
function scorePicker(value, action, extraAttr){
  return '<div class="picker">' + SCORE_LEVELS.slice().reverse().map(function(l){
    return '<button type="button" data-action="' + action + '" data-score="' + l.v + '" data-s="' + l.v +
           '" class="' + (value === l.v ? 'on' : '') + '" title="' + esc(l.label + ' - ' + l.desc) + '" ' +
           (extraAttr || '') + '>' + signed(l.v) + '</button>';
  }).join('') + '</div>';
}
function personCell(name, sub){
  return '<div class="person"><span class="avatar">' + esc(initials(name)) + '</span><div><b>' +
         esc(name) + '</b><span>' + esc(sub || '') + '</span></div></div>';
}
function domainChips(ids){
  if (!ids || !ids.length) return '<span class="hint">Unmapped</span>';
  return '<div class="chips">' + ids.map(function(id){
    var d = dom(id); return d ? '<span class="chip">' + esc(d.name) + '</span>' : '';
  }).join('') + '</div>';
}
function sortArrow(active, dir){ return active ? '<span class="arrow">' + (dir === 1 ? '▲' : '▼') + '</span>' : ''; }
function sortBy(list, key, dir){
  return list.slice().sort(function(a, b){
    var x = a[key], y = b[key];
    if (typeof x === 'string') { x = x.toLowerCase(); y = String(y).toLowerCase(); }
    if (x < y) return -dir;
    if (x > y) return dir;
    return 0;
  });
}
function toast(msg, kind){
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3600);
}
/* ============================================================
   4. ROUTER + SHELL
   ============================================================ */

function go(route){
  if (location.hash !== '#/' + route) { location.hash = '#/' + route; }
  else { state.ui.route = route; render(); }
}
function readHash(){
  var r = (location.hash || '').replace(/^#\/?/, '') || 'login';
  state.ui.route = r;
}
window.addEventListener('hashchange', function(){ readHash(); render(); });

function render(){
  var route = state.ui.route;

  if (route === 'login') { document.getElementById('app').innerHTML = viewLogin(); return; }

  // Fall back to the first page the current role is allowed to see.
  if (!canOpen(route, state.session.role)) {
    var allowed = PAGES.filter(function(p){ return p.roles.indexOf(state.session.role) !== -1; })[0];
    route = state.ui.route = allowed ? allowed.route : 'my-relations';
    if (location.hash !== '#/' + route) { location.hash = '#/' + route; return; }
  }

  var body = '';
  if (route === 'dashboard')              body = viewDashboard();
  else if (route === 'graphic-view')      body = viewGraphicView();
  else if (route === 'ms-profiles')       body = viewMsProfiles();
  else if (route === 'ms-domains')        body = viewMsDomains();
  else if (route === 'columbus-profiles') body = viewColumbusProfiles();
  else if (route === 'submissions')       body = viewSubmissions();
  else if (route === 'my-relations')      body = viewMyRelations();

  document.getElementById('app').innerHTML =
    '<div class="shell">' + sidebar(route) + '<div class="main">' + topbar(route) +
    '<div class="page">' + body + '</div></div></div>';

  restoreFocus();
  ecoMount();
}

function sidebar(route){
  var role = state.session.role;

  // One block per section; a section with no pages for this role is skipped entirely.
  var nav = NAV_SECTIONS.map(function(section){
    var items = PAGES.filter(function(p){
      return p.section === section && p.roles.indexOf(role) !== -1;
    }).map(function(p){
      var pill = (p.route === 'submissions' && pendingCount())
        ? '<span class="pill">' + pendingCount() + '</span>' : '';
      return '<a href="#/' + p.route + '" class="' + (p.route === route ? 'active' : '') + '">' +
             '<i class="ico">' + p.icon + '</i>' + esc(p.title) + pill + '</a>';
    }).join('');
    return items ? '<div class="nav__label">' + esc(section) + '</div>' + items : '';
  }).join('');

  return '<aside class="sidebar">' +
    '<div class="sidebar__logo"><strong>COLUMBUS</strong><small>Microsoft Relationship Map</small></div>' +
    '<nav class="nav">' + nav + '</nav>' +
    '<div class="sidebar__foot">UI mockup &middot; fictional data<br>Version 0.1</div>' +
    '</aside>';
}

function topbar(route){
  var p = pageFor(route) || { title:'', sub:'' };
  var user = me();
  var roleOpts = ROLES.map(function(r){
    return '<option value="' + r.id + '"' + (state.session.role === r.id ? ' selected' : '') + '>' + esc(r.name) + '</option>';
  }).join('');

  return '<header class="topbar">' +
    '<div class="topbar__title">' + esc(p.title) + '<small>' + esc(p.sub) + '</small></div>' +
    '<div class="topbar__spacer"></div>' +
    '<div class="rolepick"><label for="rolesel">Viewing as</label>' +
      '<select id="rolesel" data-action="set-role">' + roleOpts + '</select></div>' +
    '<div class="who"><span class="avatar">' + esc(initials(user.name)) + '</span>' +
      '<div><b>' + esc(user.name) + '</b><span>' + esc(user.email) + '</span></div></div>' +
    '<button class="btn btn--sm" data-action="logout">Sign out</button>' +
    '</header>';
}

/* ------------------------------------------------------------
   Rendering
   ------------------------------------------------------------ */

function ecoSlotStyle(pos){
  var s = ECO_SLOTS[pos];
  if (!s) return '';
  /* min-height rather than height: a panel grows instead of truncating text */
  return 'left:' + s.x + 'px;top:' + s.y + 'px;width:' + s.w + 'px;min-height:' + s.h + 'px;';
}

/* One dotted spoke per connected panel, in the group's own accent.
   The geometry is filled in by ecoDrawLinks() once the panels have been laid
   out, so a spoke still lands on the right edge when a panel grows. */
function ecoConnectors(){
  var lines = ECO.groups.map(function(g){
    if (!g.connect) return '';
    var a = ECO_ACCENTS[g.accent] || ECO_ACCENTS.slate;
    var pt = ecoSpoke(ECO_SLOTS[g.position]);
    return '<line data-link="' + g.id + '" x1="' + pt[0] + '" y1="' + pt[1] +
           '" x2="' + pt[2] + '" y2="' + pt[3] + '" stroke="' + a.c + '"/>';
  }).join('');

  return '<svg class="eco-links" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + ECO_W + ' ' + ECO_H +
         '" aria-hidden="true">' + lines + '</svg>';
}

/* Hub edge -> nearest edge of a box, as [x1,y1,x2,y2]. */
function ecoSpoke(box){
  if (!box) return [0,0,0,0];
  var tx = Math.max(box.x, Math.min(ECO_HUB.x, box.x + box.w));
  var ty = Math.max(box.y, Math.min(ECO_HUB.y, box.y + box.h));
  var dx = tx - ECO_HUB.x, dy = ty - ECO_HUB.y;
  var len = Math.sqrt(dx*dx + dy*dy) || 1;
  var ux = dx/len, uy = dy/len;
  return [
    (ECO_HUB.x + ux * (ECO_HUB.r + 11)).toFixed(1),
    (ECO_HUB.y + uy * (ECO_HUB.r + 11)).toFixed(1),
    (tx - ux * 4).toFixed(1),
    (ty - uy * 4).toFixed(1)
  ];
}

/* Re-aim every spoke at where its panel actually ended up. */
function ecoDrawLinks(){
  var root = document.getElementById('eco');
  if (!root || root.className.indexOf('eco--ring') === -1) return;
  var links = root.querySelectorAll('[data-link]');
  for (var i = 0; i < links.length; i++) {
    var el = links[i];
    var p = root.querySelector('[data-panel="' + el.getAttribute('data-link') + '"]');
    if (!p) continue;
    var pt = ecoSpoke({ x:p.offsetLeft, y:p.offsetTop, w:p.offsetWidth, h:p.offsetHeight });
    el.setAttribute('x1', pt[0]); el.setAttribute('y1', pt[1]);
    el.setAttribute('x2', pt[2]); el.setAttribute('y2', pt[3]);
  }
}

function ecoLegend(){
  var order = [3, 2, 1, 0, -1, -2];
  var items = order.map(function(v){
    var l = ecoLevel(v);
    var text = v === -2 ? '-2 to -3 Negative' : (v > 0 ? '+' + v : String(v)) + ' ' + l.label;
    return '<li><span style="background:' + l.bg + '"></span>' + esc(text) + '</li>';
  }).join('');
  return '<div class="eco-legend"><b>Relationship strength</b><ul>' + items + '</ul></div>';
}

/* ------------------------------------------------------------
   Fit the fixed-ratio canvas to whatever width it has been given,
   and drop to the reflowed layouts on narrow screens.
   ------------------------------------------------------------ */
var ecoRO = null, ecoLastW = -1;

function ecoFit(){
  var root = document.getElementById('eco');
  if (!root) return;
  var frame = document.getElementById('ecoframe');
  var canvas = document.getElementById('ecocanvas');
  var w = frame.clientWidth;
  if (w === ecoLastW) return;            // our own height change must not re-trigger this
  ecoLastW = w;

  if (w < 700)       root.className = 'eco-root eco--flow eco--narrow';
  else if (w < 1100) root.className = 'eco-root eco--flow';
  else               root.className = 'eco-root eco--ring';

  if (w < 1100) { canvas.style.transform = ''; frame.style.height = ''; return; }
  var k = Math.min(w / ECO_W, 1.25);
  canvas.style.transform = 'scale(' + k + ')';
  frame.style.height = Math.round(ECO_H * k) + 'px';
  ecoDrawLinks();
}

function ecoMount(){
  if (ecoRO) { ecoRO.disconnect(); ecoRO = null; }
  var frame = document.getElementById('ecoframe');
  if (!frame) return;
  ecoLastW = -1;
  ecoFit();
  ecoDrawLinks();
  if (window.ResizeObserver) { ecoRO = new ResizeObserver(ecoFit); ecoRO.observe(frame); }
}
window.addEventListener('resize', ecoFit);

/* ------------------------------------------------------------
   Hover: brighten this panel's spoke, dim everything else.
   ------------------------------------------------------------ */
function ecoHover(id){
  var root = document.getElementById('eco');
  if (!root) return;
  var panels = root.querySelectorAll('[data-panel]');
  var links  = root.querySelectorAll('[data-link]');
  var i;
  for (i=0;i<panels.length;i++){
    panels[i].classList.toggle('is-dim', !!id && panels[i].getAttribute('data-panel') !== id);
  }
  for (i=0;i<links.length;i++){
    var mine = links[i].getAttribute('data-link') === id;
    links[i].classList.toggle('is-hot', !!id && mine);
    links[i].classList.toggle('is-dim', !!id && !mine);
  }
}

/* ------------------------------------------------------------
   Export. The board is plain HTML, so it is wrapped in an SVG
   foreignObject with its own stylesheet inlined; PNG is that SVG
   painted onto a canvas, with a fall back to SVG if the browser
   refuses to export a tainted canvas.
   ------------------------------------------------------------ */
function ecoCss(){
  var out = [], sheets = document.styleSheets, i, j;
  for (i=0;i<sheets.length;i++){
    var rules;
    try { rules = sheets[i].cssRules; } catch (err) { continue; }
    if (!rules) continue;
    for (j=0;j<rules.length;j++){
      var t = rules[j].cssText || '';
      if (/\.eco|\.pcard|\.pdot|\.pav|\.pname|\.prole|\.pmeta|\.pmid|\.ptip|\.ppick/.test(t)) out.push(t);
    }
  }
  return '*{box-sizing:border-box;margin:0}' + out.join('\n');
}

function ecoSvgString(){
  var canvas = document.getElementById('ecocanvas');
  var clone = canvas.cloneNode(true);
  clone.style.transform = '';
  var picks = clone.querySelectorAll('.ppick, .ptip');
  for (var i=0;i<picks.length;i++) picks[i].parentNode.removeChild(picks[i]);
  var dim = clone.querySelectorAll('.is-dim, .is-hot');
  for (i=0;i<dim.length;i++) dim[i].classList.remove('is-dim', 'is-hot');

  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + ECO_W + '" height="' + ECO_H +
      '" viewBox="0 0 ' + ECO_W + ' ' + ECO_H + '">' +
      '<foreignObject x="0" y="0" width="100%" height="100%">' +
      '<div xmlns="http://www.w3.org/1999/xhtml" class="eco-root eco--ring">' +
      '<style>' + ecoCss() + '</style>' + clone.outerHTML +
      '</div></foreignObject></svg>';
}

function ecoDownload(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* SVG only. Rasterising to PNG in the browser means painting the board into a
   canvas through an SVG foreignObject, and every engine taints the canvas when
   you do that, so toBlob() is refused - it needs a rendering library we do not
   want in a single-file mockup. The SVG is a real vector file; Print gives a
   PDF for anyone who wants one. */
function ecoExport(){
  ecoDownload(new Blob([ecoSvgString()], { type:'image/svg+xml;charset=utf-8' }), 'ecosystem-map.svg');
  toast('Board exported as SVG', 'ok');
}

/* Print the board on its own, scaled to a landscape page. */
function ecoPrint(){
  var root = document.getElementById('eco');
  var frame = document.getElementById('ecoframe');
  var canvas = document.getElementById('ecocanvas');
  if (!root) return;
  var before = { cls:root.className, tf:canvas.style.transform, h:frame.style.height };

  root.className = 'eco-root eco--ring';
  var k = 1040 / ECO_W;                       // A4 landscape at 96dpi, 10mm margins
  canvas.style.transform = 'scale(' + k + ')';
  frame.style.height = Math.round(ECO_H * k) + 'px';
  ecoDrawLinks();

  var restore = function(){
    root.className = before.cls;
    canvas.style.transform = before.tf;
    frame.style.height = before.h;
    ecoLastW = -1; ecoFit(); ecoDrawLinks();
    window.removeEventListener('afterprint', restore);
  };
  window.addEventListener('afterprint', restore);
  window.print();
  restore();
}

var BANDS = [
  { id:'',         label:'All relationship levels' },
  { id:'strong',   label:'Strong (+2 / +3)' },

  { id:'neutral',  label:'Neutral (0)' },
  { id:'negative', label:'Negative (-1 to -3)' },
  { id:'none',     label:'No connection yet' }
];
function bandOf(s){
  if (!s.count) return 'none';
  if (s.best >= 2) return 'strong';
  if (s.best === 1) return 'positive';
  if (s.best === 0) return 'neutral';
  return 'negative';
}

function msRows(){
  var u = state.ui, q = u.msSearch.trim().toLowerCase();
  var rows = state.msProfiles.map(function(p){
    var s = msStats(p.id);
    return {
      id:p.id, name:p.name, title:p.title, group:p.group, source:p.source,
      domainIds:p.domainIds, updatedAt:p.updatedAt, email:p.email,
      count:s.count, sum:s.sum, best:s.best, band:bandOf(s)
    };
  });
  rows = rows.filter(function(r){
    if (q && (r.name + ' ' + r.title + ' ' + r.email).toLowerCase().indexOf(q) === -1) return false;
    if (u.msDomain && r.domainIds.indexOf(u.msDomain) === -1) return false;
    if (u.msGroup  && r.group  !== u.msGroup)  return false;
    if (u.msSource && r.source !== u.msSource) return false;
    if (u.msBand   && r.band   !== u.msBand)   return false;
    return true;
  });
  return sortBy(rows, u.msSort, u.msDir);
}

  return '<div class="field"><label>' + esc(label) + '</label><select data-action="' + action + '">' + opts + '</select></div>';

function cbRows(){
  var u = state.ui, q = u.cbSearch.trim().toLowerCase();
  var rows = state.columbusProfiles.map(function(p){
    var s = cbStats(p.id);
    return {
      id:p.id, name:p.name, title:p.title, department:p.department, skills:p.skills,
      role:p.role, email:p.email, lastSurvey:p.lastSurvey, count:s.count, avg:s.avg, sum:s.sum
    };
  });
  rows = rows.filter(function(r){
    if (q && (r.name + ' ' + r.title + ' ' + r.skills.join(' ') + ' ' + r.email).toLowerCase().indexOf(q) === -1) return false;
    if (u.cbDept && r.department !== u.cbDept) return false;
    if (u.cbRole && r.role !== u.cbRole) return false;
    return true;
  });
  return sortBy(rows, u.cbSort, u.cbDir);
}

function buildDraft(){
  state.ui.myDraft = relationsForCb(state.session.userId).map(function(r){
    return { msProfileId:r.msProfileId, score:r.score, note:r.note,
             origScore:r.score, origNote:r.note, removed:false, pending:false };
  });
}
function draftDirty(d){
  if (d.pending) return false;
  if (d.removed) return true;
  if (d.origScore === null) return true;
  return d.score !== d.origScore || d.note !== d.origNote;
}
function draftItem(msId){
  var list = state.ui.myDraft || [];
  for (var i=0;i<list.length;i++){ if (list[i].msProfileId === msId) return list[i]; }
  return null;
}

function viewMyRelations(){
  if (!state.ui.myDraft) buildDraft();
  var draft = state.ui.myDraft, user = me();
  var dirtyCount = draft.filter(draftDirty).length;

  var available = state.msProfiles.filter(function(p){ return !draftItem(p.id); })
    .sort(function(a,b){ return a.name < b.name ? -1 : 1; });

  var cards = draft.filter(function(d){ return !d.removed; }).map(function(d){
    var p = ms(d.msProfileId);
    if (!p) return '';
    var dirty = draftDirty(d);
    return '<div class="rel ' + (dirty ? 'dirty' : '') + '">' +
      '<div class="rel__top">' + personCell(p.name, p.title) +
        '<div>' + domainChips(p.domainIds) + '</div>' +
        '<div class="spacer"></div>' +
        (d.pending ? '<span class="tag-new">Waiting for approval</span>' : '') +
        (dirty && d.origScore === null ? '<span class="tag-new">New</span>' : '') +
        (dirty && d.origScore !== null ? '<span class="tag-new">Unsaved</span>' : '') +
        scorePicker(d.score, 'my-score', 'data-id="' + p.id + '"') +
        '<button class="btn btn--sm btn--danger" data-action="my-remove" data-id="' + p.id + '">Remove</button>' +
      '</div>' +
      '<textarea class="rel__note" data-action="my-note" data-id="' + p.id + '" id="note-' + p.id + '" ' +
        'placeholder="How do you know them? Latest contact?">' + esc(d.note) + '</textarea>' +
    '</div>';
  }).join('');

  var removed = draft.filter(function(d){ return d.removed; }).map(function(d){
    var p = ms(d.msProfileId);
    return '<div class="rel" style="opacity:.65">' +
      '<div class="rel__top">' + personCell(p ? p.name : '?', p ? p.title : '') +
        '<div class="spacer"></div>' +
        '<span class="chip" style="background:var(--danger-bg);color:var(--danger)">Marked for removal</span>' +
        '<button class="btn btn--sm" data-action="my-undo" data-id="' + d.msProfileId + '">Undo</button>' +
      '</div></div>';
  }).join('');

  var picker = '<div class="card"><div class="card__body">' +
    '<div class="toolbar" style="border:0;background:transparent;padding:0">' +
      '<div class="field" style="flex:1;min-width:280px"><label>Add a Microsoft contact you know</label>' +
        '<select data-action="my-pick" id="my-pick">' +
          '<option value="">Select a Microsoft profile...</option>' +
          available.map(function(p){
            return '<option value="' + p.id + '"' + (state.ui.myPicker === p.id ? ' selected' : '') + '>' +
                   esc(p.name + ' - ' + p.title) + '</option>';
          }).join('') +
        '</select></div>' +
      '<button class="btn btn--primary" data-action="my-add"' + (state.ui.myPicker ? '' : ' disabled') + '>+ Add relation</button>' +
    '</div></div></div>';

  return '' +
    '<div class="page__head"><div><h2>My Relations</h2>' +
      '<p>Your own Microsoft contacts, ' + esc(user.name) + '. Adjust the scores, add or remove people, then submit the whole thing for approval.</p></div>' +
      '<div class="page__actions">' +
        '<span class="hint">' + (dirtyCount ? dirtyCount + ' unsaved change' + (dirtyCount === 1 ? '' : 's') : 'No unsaved changes') + '</span>' +
        '<button class="btn" data-action="my-reset"' + (dirtyCount ? '' : ' disabled') + '>Discard changes</button>' +
        '<button class="btn btn--accent" data-action="my-submit"' + (dirtyCount ? '' : ' disabled') + '>Submit for approval</button>' +
      '</div></div>' +
    '<div class="mockflag">Your submission does not change the approved data directly - it lands on <b>Pending Submissions</b> where an Admin reviews it. Switch role in the top bar to see it arrive.</div>' +
    '<div class="card" style="margin-bottom:18px"><div class="card__body">' + scoreLegend() + '</div></div>' +
    picker +
    '<div style="display:grid;gap:12px;margin-top:18px">' + (cards || '<div class="card"><div class="empty"><b>You have no relations yet</b>Add a Microsoft contact above to get started.</div></div>') + removed + '</div>';
}

      '</dl>' +
      '<div><h4 style="font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:10px">Who knows them at Columbus</h4>' +
        '<table class="minitable"><tbody>' + conns + '</tbody></table></div>' +
      '<div><button class="btn btn--primary" data-action="ms-edit" data-id="' + p.id + '"' + (canEdit() ? '' : ' disabled') + '>Edit profile</button></div>' +
    '</div></div></div>';
}

function modalMarkup(m){
  if (m.type === 'confirm') {
    return shellModal(m.title, m.sub,
      '<p style="margin:0;line-height:1.6">' + m.body + '</p>',
      '<button class="btn" data-action="close-layer">Cancel</button>' +
      '<button class="btn ' + (m.danger ? 'btn--danger' : 'btn--primary') + '" data-action="confirm-yes">' + esc(m.okLabel || 'Confirm') + '</button>');
  }
  if (m.type === 'ms') {
    var p = m.id ? ms(m.id) : { name:'', title:'', email:'', group:MS_GROUPS[2], source:MS_SOURCES[3], domainIds:[], notes:'' };
    return shellModal(m.id ? 'Edit Microsoft profile' : 'Add Microsoft profile',
      'Microsoft Denmark contact. Domains can be changed later without touching the relationships.',
      '<div class="form-grid">' +
        inputField('f-name', 'Full name', p.name, 'full') +
        inputField('f-title', 'Title / role', p.title) +
        inputField('f-email', 'E-mail', p.email) +
        selField('f-group', 'Group', MS_GROUPS, p.group) +
        selField('f-source', 'Source', MS_SOURCES, p.source) +
        '<div class="field full"><label>Domains</label><div class="checks">' + state.domains.map(function(d){
          return '<label><input type="checkbox" class="f-dom" value="' + d.id + '"' +
                 (p.domainIds.indexOf(d.id) !== -1 ? ' checked' : '') + '>' + esc(d.name) + '</label>';
        }).join('') + '</div></div>' +
        '<div class="field full"><label>Notes</label><textarea id="f-notes" rows="3">' + esc(p.notes) + '</textarea></div>' +
      '</div>',
      '<button class="btn" data-action="close-layer">Cancel</button>' +
      '<button class="btn btn--primary" data-action="ms-save" data-id="' + (m.id || '') + '">Save profile</button>');
  }
  if (m.type === 'dom') {
    var d = m.id ? dom(m.id) : { name:'', owner:'', desc:'' };
    return shellModal(m.id ? 'Edit domain' : 'Add domain',
      'Domains group the Microsoft profiles. Process owner is a role, not necessarily a single person.',
      '<div class="form-grid">' +
        inputField('f-dname', 'Domain name', d.name, 'full') +
        inputField('f-downer', 'Process owner', d.owner, 'full') +
        '<div class="field full"><label>Description</label><textarea id="f-ddesc" rows="3">' + esc(d.desc) + '</textarea></div>' +
      '</div>',
      '<button class="btn" data-action="close-layer">Cancel</button>' +
      '<button class="btn btn--primary" data-action="dom-save" data-id="' + (m.id || '') + '">Save domain</button>');
  }
  if (m.type === 'cb') {
    var c = m.id ? cb(m.id) : { name:'', title:'', email:'', department:CB_DEPARTMENTS[2], role:'standard', skills:[] };
    return shellModal(m.id ? 'Edit Columbus user' : 'Add Columbus user',
      'Internal user. A survey can be sent as soon as the user exists.',
      '<div class="form-grid">' +
        inputField('f-cname', 'Full name', c.name, 'full') +
        inputField('f-ctitle', 'Title', c.title) +
        inputField('f-cmail', 'E-mail', c.email) +
        selField('f-cdept', 'Department', CB_DEPARTMENTS, c.department) +
        selField('f-crole', 'Role', ROLES.map(function(r){ return r.name; }), roleName(c.role)) +
        inputField('f-cskills', 'Skills (comma separated)', c.skills.join(', '), 'full') +
      '</div>',
      '<button class="btn" data-action="close-layer">Cancel</button>' +
      '<button class="btn btn--primary" data-action="cb-save" data-id="' + (m.id || '') + '">Save user</button>');
  }
  return '';
}
function shellModal(title, sub, body, foot){
  return '<div class="modal"><div class="modal__bg" data-action="close-layer"></div><div class="modal__panel">' +
    '<div class="modal__head"><h3>' + esc(title) + '</h3><p>' + esc(sub) + '</p></div>' +
    '<div class="modal__body">' + body + '</div>' +
    '<div class="modal__foot">' + foot + '</div></div></div>';
}
function inputField(id, label, value, cls){
  return '<div class="field ' + (cls||'') + '"><label for="' + id + '">' + esc(label) + '</label>' +
         '<input type="text" id="' + id + '" value="' + esc(value) + '"></div>';
}
function selField(id, label, options, value){
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><select id="' + id + '">' +
    options.map(function(o){ return '<option' + (o === value ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
    '</select></div>';
}
function val(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; }

/* ============================================================
   13. MUTATIONS
   ============================================================ */

function deleteMsProfile(id){
  var p = ms(id);
  state.msProfiles = state.msProfiles.filter(function(x){ return x.id !== id; });
  state.relations  = state.relations.filter(function(r){ return r.msProfileId !== id; });
  state.submissions.forEach(function(s){ s.items = s.items.filter(function(i){ return i.msProfileId !== id; }); });
  state.submissions = state.submissions.filter(function(s){ return s.items.length; });
  state.ui.myDraft = null;
  toast('Deleted ' + (p ? p.name : 'profile') + ' and their relations', 'ok');
}
function deleteColumbusUser(id){
  var c = cb(id);
  state.columbusProfiles = state.columbusProfiles.filter(function(x){ return x.id !== id; });
  state.relations   = state.relations.filter(function(r){ return r.columbusId !== id; });
  state.submissions = state.submissions.filter(function(s){ return s.columbusId !== id; });
  toast('Deleted ' + (c ? c.name : 'user') + '. Their relations were removed with them.', 'ok');
}
function approveSubmission(id){
  var s = byId(state.submissions, id);
  if (!s) return;
  s.items.forEach(function(it){
    var existing = null;
    state.relations.forEach(function(r){
      if (r.columbusId === s.columbusId && r.msProfileId === it.msProfileId) existing = r;
    });
    if (it.newScore === null) {
      if (existing) state.relations = state.relations.filter(function(r){ return r !== existing; });
    } else if (existing) {
      existing.score = it.newScore;
      if (it.note) existing.note = it.note;
      existing.updatedAt = today();
    } else {
      state.relations.push({ id:uid('r'), columbusId:s.columbusId, msProfileId:it.msProfileId,
                             score:it.newScore, note:it.note || '', updatedAt:today() });
    }
    var p = ms(it.msProfileId);
    if (p) p.updatedAt = today();
  });
  state.submissions = state.submissions.filter(function(x){ return x.id !== id; });
  if (s.columbusId === state.session.userId) state.ui.myDraft = null;
  var person = cb(s.columbusId);
  toast('Approved ' + s.items.length + ' change' + (s.items.length === 1 ? '' : 's') +
        ' from ' + (person ? person.name : 'user'), 'ok');
}
function submitMyRelations(){
  var dirty = (state.ui.myDraft || []).filter(draftDirty);
  if (!dirty.length) return;
  state.submissions.unshift({
    id: uid('s'), columbusId: state.session.userId, type: 'edit', submittedAt: today(),
    items: dirty.map(function(d){
      return { msProfileId:d.msProfileId, oldScore:d.origScore,
               newScore: d.removed ? null : d.score, note:d.note };
    })
  });
  dirty.forEach(function(d){ d.pending = true; d.origScore = d.score; d.origNote = d.note; });
  toast('Submitted ' + dirty.length + ' change' + (dirty.length === 1 ? '' : 's') + ' for approval', 'ok');
}

/* Set (or clear) one person's relationship strength on the ecosystem map. */
function ecoSetStrength(key, v){
  var parts = String(key).split(':'), g = null, i;
  for (i = 0; i < ECO.groups.length; i++) { if (ECO.groups[i].id === parts[0]) g = ECO.groups[i]; }
  if (!g) return;
  var p = g.people[Number(parts[1])];
  if (!p) return;
  p.strength = v === 'none' ? null : Number(v);
  state.ui.ecoPick = null;
  render();
  toast(p.strength === null
    ? p.name + ' is no longer scored'
    : p.name + ' set to ' + (p.strength > 0 ? '+' : '') + p.strength + ' - ' + ecoLevel(p.strength).label, 'ok');
}

/* ============================================================
   14. EVENTS
   ============================================================ */

function restoreFocus(){
  var f = state.ui.focus;
  if (!f) return;
  var el = document.getElementById(f.id);
  if (el) {
    el.focus();
    try { el.setSelectionRange(f.pos, f.pos); } catch (err) { /* type=search on some browsers */ }
  }
  state.ui.focus = null;
}

document.addEventListener('submit', function(e){
  if (e.target.getAttribute('data-action') === 'login') {
    e.preventDefault();
    state.session = { userId:'c1', role:'admin' };
    state.ui.myDraft = null;
    go('dashboard');
  }
});

document.addEventListener('input', function(e){
  var a = e.target.getAttribute('data-action');
  if (a === 'ms-search') {
    state.ui.msSearch = e.target.value;
    state.ui.focus = { id:'ms-search', pos:e.target.value.length };
    render();
  } else if (a === 'cb-search') {
    state.ui.cbSearch = e.target.value;
    state.ui.focus = { id:'cb-search', pos:e.target.value.length };
    render();
  } else if (a === 'my-note') {
    var d = draftItem(e.target.getAttribute('data-id'));
    if (d) { d.note = e.target.value; d.pending = false; }
  }
});

document.addEventListener('change', function(e){
  var el = e.target, a = el.getAttribute('data-action');
  if (!a) return;
  if (a === 'set-role') {
    state.session.role = el.value;
    toast('Now viewing the app as ' + roleName(el.value));
    render();
  }
  else if (a === 'ms-domain') { state.ui.msDomain = el.value; render(); }
  else if (a === 'ms-group')  { state.ui.msGroup  = el.value; render(); }
  else if (a === 'ms-source') { state.ui.msSource = el.value; render(); }
  else if (a === 'ms-band')   { state.ui.msBand   = el.value; render(); }
  else if (a === 'cb-dept')   { state.ui.cbDept   = el.value; render(); }
  else if (a === 'cb-role-filter') { state.ui.cbRole = el.value; render(); }
  else if (a === 'cb-set-role') {
    var person = cb(el.getAttribute('data-id'));
    if (person) { person.role = el.value; toast(person.name + ' is now ' + roleName(el.value), 'ok'); }
    render();
  }
  else if (a === 'my-pick') { state.ui.myPicker = el.value; render(); }
  else if (a === 'my-note') { render(); }
});

document.addEventListener('click', function(e){
  // an open strength picker closes on any click outside itself
  if (state.ui.ecoPick && e.target.closest &&
      !e.target.closest('.ppick') && !e.target.closest('[data-action="eco-dot"]')) {
    state.ui.ecoPick = null; render();
  }

  // never let a click inside a form control trigger a row-level action
  var tag = e.target.tagName;
  if (tag === 'SELECT' || tag === 'TEXTAREA' || (tag === 'INPUT' && e.target.type !== 'checkbox')) return;

  var el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!el) return;
  var a = el.getAttribute('data-action'), id = el.getAttribute('data-id');
  if (a === 'login') return;

  switch (a) {
    /* --- shell --- */
    case 'logout':
      state.ui.msDetail = null; state.ui.modal = null; state.ui.myDraft = null;
      state.session.role = 'admin';
      renderLayer();
      location.hash = '#/login';
      break;
    case 'close-layer': closeLayer(); break;
    case 'confirm-yes':
      var fn = pendingConfirm; closeLayer();
      if (fn) fn();
      render();
      break;

    /* --- dashboard: ecosystem map --- */
    case 'eco-dot':
      state.ui.ecoPick = state.ui.ecoPick === id ? null : id;
      render(); break;
    case 'eco-set':
      ecoSetStrength(id, el.getAttribute('data-v')); break;
    case 'eco-filter':
      var fv = el.getAttribute('data-v');
      state.ui.ecoFilter = state.ui.ecoFilter === fv ? '' : fv;
      render(); break;
    case 'eco-export': ecoExport(); break;
    case 'eco-print':  ecoPrint();  break;

    /* --- Microsoft profiles --- */
    case 'ms-open':   state.ui.msDetail = id; renderLayer(); break;
    case 'sort-ms':
      var k = el.getAttribute('data-key');
      state.ui.msDir = state.ui.msSort === k ? -state.ui.msDir : 1;
      state.ui.msSort = k; render(); break;
    case 'ms-reset':
      state.ui.msSearch = ''; state.ui.msDomain = ''; state.ui.msGroup = '';
      state.ui.msSource = ''; state.ui.msBand = ''; render(); break;
    case 'ms-new':  openModal({ type:'ms' }); break;
    case 'ms-edit': state.ui.msDetail = null; openModal({ type:'ms', id:id }); break;
    case 'ms-delete':
      var mp = ms(id);
      pendingConfirm = function(){ deleteMsProfile(id); };
      openModal({ type:'confirm', title:'Delete Microsoft profile', sub:'This cannot be undone in the mockup.',
        body:'Delete <b>' + esc(mp ? mp.name : '') + '</b>? ' + msStats(id).count +
             ' registered relation(s) will be removed as well.', okLabel:'Delete', danger:true });
      break;
    case 'ms-save':
      var name = val('f-name');
      if (!name) { toast('A name is required', 'err'); return; }
      var doms = Array.prototype.slice.call(document.querySelectorAll('.f-dom:checked')).map(function(x){ return x.value; });
      var payload = { name:name, title:val('f-title'), email:val('f-email'), group:val('f-group'),
                      source:val('f-source'), domainIds:doms, notes:val('f-notes'), updatedAt:today() };
      if (id) { var t = ms(id); for (var key in payload) t[key] = payload[key]; toast('Updated ' + name, 'ok'); }
      else { payload.id = uid('m'); state.msProfiles.push(payload); toast('Added ' + name, 'ok'); }
      closeLayer(); render();
      break;

    /* --- Microsoft domains --- */
    case 'dom-new':  openModal({ type:'dom' }); break;
    case 'dom-edit': openModal({ type:'dom', id:id }); break;
    case 'dom-delete':
      var used = domainStats(id).profiles;
      if (used) { toast('Cannot delete: ' + used + ' Microsoft profile(s) are still mapped to this domain', 'err'); return; }
      pendingConfirm = function(){
        var d = dom(id);
        state.domains = state.domains.filter(function(x){ return x.id !== id; });
        toast('Deleted domain ' + (d ? d.name : ''), 'ok');
      };
      openModal({ type:'confirm', title:'Delete domain', sub:'No profiles are mapped to it.',
        body:'Delete <b>' + esc((dom(id)||{}).name) + '</b>?', okLabel:'Delete', danger:true });
      break;
    case 'dom-save':
      var dn = val('f-dname');
      if (!dn) { toast('A domain name is required', 'err'); return; }
      if (id) { var dd = dom(id); dd.name = dn; dd.owner = val('f-downer'); dd.desc = val('f-ddesc'); toast('Updated ' + dn, 'ok'); }
      else { state.domains.push({ id:uid('d'), name:dn, owner:val('f-downer'), desc:val('f-ddesc') }); toast('Added ' + dn, 'ok'); }
      closeLayer(); render();
      break;

    /* --- Columbus profiles --- */
    case 'sort-cb':
      var ck = el.getAttribute('data-key');
      state.ui.cbDir = state.ui.cbSort === ck ? -state.ui.cbDir : 1;
      state.ui.cbSort = ck; render(); break;
    case 'cb-reset': state.ui.cbSearch = ''; state.ui.cbDept = ''; state.ui.cbRole = ''; render(); break;
    case 'cb-toggle': state.ui.cbOpen = state.ui.cbOpen === id ? null : id; render(); break;
    case 'cb-new':  openModal({ type:'cb' }); break;
    case 'cb-save':
      var cn = val('f-cname');
      if (!cn) { toast('A name is required', 'err'); return; }
      var roleId = 'standard';
      ROLES.forEach(function(r){ if (r.name === val('f-crole')) roleId = r.id; });
      var skills = val('f-cskills').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      state.columbusProfiles.push({ id:uid('c'), name:cn, title:val('f-ctitle'), department:val('f-cdept'),
        skills:skills, role:roleId, email:val('f-cmail'), lastSurvey:null });
      toast('Added ' + cn, 'ok');
      closeLayer(); render();
      break;
    case 'cb-delete':
      var cp = cb(id);
      pendingConfirm = function(){ deleteColumbusUser(id); };
      openModal({ type:'confirm', title:'Delete Columbus user', sub:'This cannot be undone in the mockup.',
        body:'Delete <b>' + esc(cp ? cp.name : '') + '</b>? ' + cbStats(id).count +
             ' relation(s) will be removed with them.', okLabel:'Delete', danger:true });
      break;
    case 'cb-survey':
      var sp = cb(id);
      if (sp) { sp.lastSurvey = today(); toast('Survey sent to ' + sp.name, 'ok'); }
      render(); break;
    case 'cb-survey-all':
      pendingConfirm = function(){
        state.columbusProfiles.forEach(function(p){ p.lastSurvey = today(); });
        toast('Survey sent to all ' + state.columbusProfiles.length + ' users', 'ok');
      };
      openModal({ type:'confirm', title:'Send survey to everyone', sub:'Mockup - no mail is actually sent.',
        body:'Send a new relationship survey to all <b>' + state.columbusProfiles.length + '</b> Columbus users?',
        okLabel:'Send survey' });
      break;

    /* --- submissions --- */
    case 'sub-toggle': state.ui.subOpen = state.ui.subOpen === id ? null : id; render(); break;
    case 'sub-score':
      var sub = byId(state.submissions, el.getAttribute('data-sub'));
      if (sub) sub.items[parseInt(el.getAttribute('data-idx'), 10)].newScore = parseInt(el.getAttribute('data-score'), 10);
      render(); break;
    case 'sub-approve': approveSubmission(id); render(); break;
    case 'sub-reject':
      var rs = byId(state.submissions, id), rp = rs ? cb(rs.columbusId) : null;
      pendingConfirm = function(){
        state.submissions = state.submissions.filter(function(x){ return x.id !== id; });
        toast('Rejected the submission from ' + (rp ? rp.name : 'user'));
      };
      openModal({ type:'confirm', title:'Reject submission', sub:'The submitter keeps their current approved scores.',
        body:'Reject the submission from <b>' + esc(rp ? rp.name : '') + '</b>?', okLabel:'Reject', danger:true });
      break;

    /* --- my relations --- */
    case 'my-score':
      var di = draftItem(id);
      if (di) { di.score = parseInt(el.getAttribute('data-score'), 10); di.pending = false; }
      render(); break;
    case 'my-remove':
      var dr = draftItem(id);
      if (dr) { dr.removed = true; dr.pending = false; }
      render(); break;
    case 'my-undo':
      var du = draftItem(id);
      if (du) du.removed = false;
      render(); break;
    case 'my-add':
      var pick = state.ui.myPicker;
      if (pick && !draftItem(pick)) {
        state.ui.myDraft.push({ msProfileId:pick, score:0, note:'', origScore:null, origNote:'', removed:false, pending:false });
        state.ui.myPicker = '';
        toast('Added ' + (ms(pick) || {}).name + ' - set a score and submit');
      }
      render(); break;
    case 'my-reset': state.ui.myDraft = null; toast('Discarded your unsaved changes'); render(); break;
    case 'my-submit': submitMyRelations(); render(); break;
  }
});

document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (state.ui.ecoPick) { state.ui.ecoPick = null; render(); return; }
  if (state.ui.modal || state.ui.msDetail) closeLayer();
});

// Hovering a group panel highlights its spoke and dims the rest of the board.
var ecoHot = null;
document.addEventListener('mouseover', function(e){
  if (state.ui.route !== 'dashboard' || !e.target.closest) return;
  var p = e.target.closest('[data-panel]');
  var id = p ? p.getAttribute('data-panel') : null;
  if (id === ecoHot) return;
  ecoHot = id;
  ecoHover(id);
});

/* ============================================================
   15. INIT
   ============================================================ */

readHash();
if (state.ui.route !== 'login' && !location.hash) location.hash = '#/login';
render();
renderLayer();
</script>
