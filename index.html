    '<div class="gv-panel__body">' + body + '</div>' +
  '</div>';
}

/* ------------------------------------------------------------
   Breakdowns. Pick a dimension and a measure; every panel below
   re-renders against the same choice. Bars are plain HTML.
   ------------------------------------------------------------ */
var GV_DIMS = [
  { id:'domain', label:'Domain',          note:'Microsoft contacts grouped by the domain they sit in.' },
  { id:'group',  label:'Microsoft group', note:'Microsoft contacts grouped by the kind of role they hold.' },
  { id:'source', label:'Source',          note:'Where each Microsoft contact came from.' },
  { id:'cbdept', label:'Columbus dept.',  note:'Seen from our side: what each Columbus department reaches into Microsoft.' }
];
var GV_MEASURES = [
  { id:'mean',      label:'Mean score', diverging:true, axis:'-3 to +3' },
  { id:'coverage',  label:'Coverage',   suffix:'%',     axis:'0 to 100%' },
  { id:'contacts',  label:'Contacts' },
  { id:'relations', label:'Relations' }
];
function gvDim(){ return byId(GV_DIMS, state.ui.gvDim) || GV_DIMS[0]; }
function gvMeasure(){ return byId(GV_MEASURES, state.ui.gvMeasure) || GV_MEASURES[0]; }

/* One bucket per category: the Microsoft contacts in it and the relations to them. */
function gvBuckets(){
  var dim = gvDim().id, out = [];
  /* Every count on this page is the active board's - Data & AI and Dynamics each
     get their own graphics, so a domain from the other board must not leak in. */
  var b = activeBoard().id, mine = boardProfiles(b), myRels = boardRelations(b);
  function bucket(label, profiles){
    var ids = profiles.map(function(p){ return p.id; });
    var rels = myRels.filter(function(r){ return ids.indexOf(r.msProfileId) !== -1; });
    return { label:label, msIds:ids, rels:rels };
  }
  if (dim === 'domain') {
    out = boardDomains(b).map(function(d){
      return bucket(d.name, mine.filter(function(p){ return p.domainIds.indexOf(d.id) !== -1; }));
    });
  } else if (dim === 'group' || dim === 'source') {
    var key = dim === 'group' ? 'group' : 'source';
    (dim === 'group' ? MS_GROUPS : MS_SOURCES).forEach(function(v){
      out.push(bucket(v, mine.filter(function(p){ return p[key] === v; })));
    });
  } else {
    /* From our side: the contacts a department actually reaches on this board. */
    CB_DEPARTMENTS.forEach(function(dep){
      var us = state.columbusProfiles.filter(function(c){ return c.department === dep; }).map(function(c){ return c.id; });
      var rels = myRels.filter(function(r){ return us.indexOf(r.columbusId) !== -1; });
      var ids = [];
      rels.forEach(function(r){ if (ids.indexOf(r.msProfileId) === -1) ids.push(r.msProfileId); });
      out.push({ label:dep, msIds:ids, rels:rels });
    });
  }
  /* An unused group or source is just a longer taxonomy - drop it. A domain or a
     department that reaches nobody is the finding, so those empties stay. */
  if (dim === 'group' || dim === 'source') {
    return out.filter(function(b){ return b.msIds.length; });
  }
  return out;
}

function gvValue(b, id){
  if (id === 'contacts')  return b.msIds.length;
  if (id === 'relations') return b.rels.length;
  if (id === 'mean')      return meanOf(b.rels.map(function(r){ return r.score; }));
  var covered = b.msIds.filter(function(i){ var st = msStats(i); return st.count > 0 && st.best >= 1; }).length;
  return b.msIds.length ? Math.round(covered / b.msIds.length * 100) : 0;
}
function gvFormat(v, m){
  return m.id === 'mean' ? fmtScore(v) : v + (m.suffix || '');
}

/* --- the marks --- */
function barRow(label, value, display, tip, max, attrs){
  var w = max > 0 ? Math.max(value / max * 100, value > 0 ? 1.5 : 0) : 0;
  return '<div class="bars__row" tabindex="0" data-tip="' + esc(tip) + '"' + (attrs || '') + '>' +
    '<span class="bars__lbl">' + esc(label) + '</span>' +
    '<span class="bars__plot"><i class="' + (value ? '' : 'is-zero') + '" style="width:' +
      (value ? w.toFixed(1) : 2) + (value ? '%' : 'px') + '"></i></span>' +
    '<span class="bars__val">' + esc(display) + '</span>' +
  '</div>';
}
function divRow(label, value, display, tip, attrs){
  var step = clampScore(Math.round(value)), lvl = scoreLevel(step);
  var w = Math.min(Math.abs(value) / 3, 1) * 50;
  var bar = Math.abs(value) < 0.05
    ? '<i class="pos" style="left:50%;width:2px;background:var(--s-0)"></i>'
    : '<i class="' + (value > 0 ? 'pos' : 'neg') + '" style="width:' + w.toFixed(1) +
      '%;background:' + lvl.bg + '"></i>';
  return '<div class="bars__row" tabindex="0" data-tip="' + esc(tip) + '"' + (attrs || '') + '>' +
    '<span class="bars__lbl">' + esc(label) + '</span>' +
    '<span class="dbars__plot"><span class="zline"></span>' + bar + '</span>' +
    '<span class="bars__val">' + esc(display) + '</span>' +
  '</div>';
}

/* --- the panels --- */
function gvBreakdown(){
  var m = gvMeasure(), buckets = gvBuckets();
  if (!buckets.length) return '<div class="empty"><b>Nothing to chart yet</b>No contacts in this breakdown.</div>';

  var rows = buckets.map(function(b){
    return { label:b.label, value:gvValue(b, m.id), b:b };
  });
  if (m.id !== 'mean') rows.sort(function(a, b){ return b.value - a.value; });

  var max = rows.reduce(function(n, r){ return Math.max(n, r.value); }, 0);
  var body = rows.map(function(r){
    var scores = r.b.rels.map(function(x){ return x.score; });
    var tip = r.label + '  ·  ' + r.b.msIds.length + ' contact' + (r.b.msIds.length === 1 ? '' : 's') +
              '  ·  ' + r.b.rels.length + ' relation' + (r.b.rels.length === 1 ? '' : 's') +
              (scores.length ? '  ·  mean ' + fmtScore(meanOf(scores)) + ', median ' + fmtScore(medianOf(scores)) : '');
    /* The bar is the control: clicking it lists the people it counts, just
       below the chart. Selected state is on the row so it reads as a toggle. */
    var attrs = ' data-action="gv-drill" data-k="' + esc(r.label) + '" role="button"' +
                ' aria-expanded="' + (state.ui.gvDrill === r.label) + '"' +
                (state.ui.gvDrill === r.label ? ' style="background:var(--navy-100)"' : '');
    return m.diverging
      ? divRow(r.label, r.value, gvFormat(r.value, m), tip, attrs)
      : barRow(r.label, r.value, gvFormat(r.value, m), tip, max, attrs);
  }).join('');

  var ticks = m.diverging
    ? '<span>-3</span><span>0</span><span>+3</span>'
    : '<span>0</span><span>' + gvFormat(max, m) + '</span>';
  var axis = '<div class="axnote"><span class="axnote__scale">' + ticks + '</span></div>';
  return '<div class="bars">' + body + '</div>' + axis;
}

function gvDistribution(){
  var mine = boardRelations(activeBoard().id);
  var counts = SCORE_LEVELS.slice().reverse().map(function(l){
    return { l:l, n:mine.filter(function(r){ return r.score === l.v; }).length };
  });
  var max = counts.reduce(function(n, c){ return Math.max(n, c.n); }, 0) || 1;
  var cols = counts.map(function(c){
    return '<div class="cols__col" tabindex="0" data-tip="' + esc(signed(c.l.v) + ' ' + c.l.label + ' · ' +
             c.n + ' relation' + (c.n === 1 ? '' : 's') + ' · ' + c.l.desc) + '">' +
      '<span class="cols__val">' + c.n + '</span>' +
      '<span class="cols__bar" style="height:' + (c.n / max * 100).toFixed(1) + '%;background:' + c.l.bg + '"></span>' +
    '</div>';
  }).join('');
  var ax = counts.map(function(c){ return '<span>' + signed(c.l.v) + '</span>'; }).join('');
  return '<div class="cols">' + cols + '</div><div class="cols__ax">' + ax + '</div>';
}

function gvHolders(){
  /* Counted per board: someone who holds ten Data & AI relationships and none on
     Dynamics belongs on one page, not both. */
  var mine = boardRelations(activeBoard().id);
  var rows = state.columbusProfiles.map(function(c){
    var rs = mine.filter(function(r){ return r.columbusId === c.id; });
    var scores = rs.map(function(r){ return r.score; });
    var st = { count:rs.length, mean:meanOf(scores), median:medianOf(scores) };
    return { label:c.name, value:st.count, st:st, dept:c.department };
  }).filter(function(r){ return r.value > 0; })
    .sort(function(a, b){ return b.value - a.value || a.label.localeCompare(b.label); });
  if (!rows.length) return '<div class="empty"><b>Nothing held yet</b>No Columbus employee has a relationship on this board.</div>';
  var max = rows.reduce(function(n, r){ return Math.max(n, r.value); }, 0);
  return '<div class="bars">' + rows.map(function(r){
    var tip = r.label + '  ·  ' + r.dept + '  ·  ' + r.value + ' relation' + (r.value === 1 ? '' : 's') +
              (r.value ? '  ·  mean ' + fmtScore(r.st.mean) + ', median ' + fmtScore(r.st.median)
                       : '  ·  holds no Microsoft relationships');
    return barRow(r.label, r.value, String(r.value), tip, max);
  }).join('') + '</div>';
}


/* ------------------------------------------------------------
   The people behind one bar.

   A count tells you where the white space is; the list tells you who to call.
   So a bar is clickable and the people it counts appear directly under the
   chart, with phone and e-mail as columns from the start. Those two are empty:
   the source deck holds no contact details, and filling them with plausible
   guesses next to real names would read as data rather than as a gap.
   ------------------------------------------------------------ */
function gvDrillPanel(){
  var k = state.ui.gvDrill;
  if (!k) return '';
  var buckets = gvBuckets(), b = null;
  for (var i = 0; i < buckets.length; i++) { if (buckets[i].label === k) b = buckets[i]; }
  if (!b) return '';

  var people = b.msIds.map(function(id){ return ms(id); }).filter(function(p){ return !!p; });
  /* Strongest relationship first, unscored last - the same order the board uses. */
  people.sort(function(x, y){
    var sx = msStats(x.id), sy = msStats(y.id);
    var mx = sx.count ? sx.mean : -99, my = sy.count ? sy.mean : -99;
    return my - mx || x.name.localeCompare(y.name);
  });

  var head =
    '<div class="gv-drill__head">' +
      '<div><b>' + esc(k) + '</b>' +
        '<span>' + people.length + ' ' + (people.length === 1 ? 'person' : 'people') +
        ' &middot; ' + b.rels.length + ' relation' + (b.rels.length === 1 ? '' : 's') + '</span></div>' +
      '<button type="button" class="btn btn--sm btn--ghost" data-action="gv-drill" data-k="">Close</button>' +
    '</div>';

  var rows = people.map(function(p){
    var st = msStats(p.id);
    return '<tr class="clickable" data-action="ms-open" data-id="' + p.id + '">' +
      '<td>' + personCell(p.name, p.title) + '</td>' +
      '<td>' + domainChips(p.domainIds) + '</td>' +
      '<td>' + (st.count ? scoreChip(clampScore(Math.round(st.mean))) : '<span class="chip chip--muted">not scored</span>') + '</td>' +
      '<td>' + (p.phone ? esc(p.phone) : '<span class="hint">&mdash;</span>') + '</td>' +
      '<td>' + (p.email ? esc(p.email) : '<span class="hint">&mdash;</span>') + '</td>' +
    '</tr>';
  }).join('');

  var body = people.length
    ? '<div class="tablewrap"><table><thead><tr>' +
        '<th>Name</th><th>Domains</th><th>Score</th><th>Phone</th><th>E-mail</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="hint" style="margin:10px 2px 0">Phone and e-mail are not in the source material yet, ' +
      'so they are left empty rather than invented. Click a row for the full profile.</p>'
    : '<div class="empty" style="margin:0"><b>Nobody in this category</b>' +
      'The category exists but holds no Microsoft contacts on this board.</div>';

  return '<div class="gv-drill">' + head + body + '</div>';
}

/* --- table twins, so no value is only reachable by hovering --- */
function gvTable(head, rows){
  return '<div class="tablewrap"><table><thead><tr>' +
    head.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rows.map(function(r){
      return '<tr>' + r.map(function(c, i){
        return '<td' + (i ? ' class="num"' : '') + '>' + c + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}
function gvBreakdownTable(){
  var buckets = gvBuckets();
  return gvTable([gvDim().label, 'Contacts', 'Relations', 'Mean', 'Median', 'Coverage'],
    buckets.map(function(b){
      var sc = b.rels.map(function(r){ return r.score; });
      return [esc(b.label), b.msIds.length, b.rels.length,
              sc.length ? fmtScore(meanOf(sc)) : '&ndash;',
              sc.length ? fmtScore(medianOf(sc)) : '&ndash;',
              gvValue(b, 'coverage') + '%'];
    }));
}
function gvDistributionTable(){
  var mine = boardRelations(activeBoard().id);
  return gvTable(['Level', 'Label', 'Relations'], SCORE_LEVELS.map(function(l){
    return [scoreChip(l.v) + ' ' + esc(l.label), esc(l.desc),
            mine.filter(function(r){ return r.score === l.v; }).length];
  }));
}
function gvHoldersTable(){
  var mine = boardRelations(activeBoard().id);
  function statFor(id){
    var scores = mine.filter(function(r){ return r.columbusId === id; }).map(function(r){ return r.score; });
    return { count:scores.length, mean:meanOf(scores), median:medianOf(scores) };
  }
  return gvTable(['Columbus employee', 'Relations', 'Mean', 'Median'],
    state.columbusProfiles.filter(function(c){ return statFor(c.id).count > 0; })
      .sort(function(a, b){ return statFor(b.id).count - statFor(a.id).count; })
      .map(function(c){
        var st = statFor(c.id);
        return [personCell(c.name, c.department), st.count,
                st.count ? fmtScore(st.mean) : '&ndash;', st.count ? fmtScore(st.median) : '&ndash;'];
      }));
}

function seg(action, options, current){
  return '<div class="seg" role="group">' + options.map(function(o){
    return '<button type="button" data-action="' + action + '" data-id="' + esc(o.id) + '" aria-pressed="' +
           (o.id === current ? 'true' : 'false') + '">' + esc(o.label) + '</button>';
  }).join('') + '</div>';
}

function viewGraphicView(){
  var u = state.ui, m = gvMeasure(), asTable = u.gvView === 'table';
  /* Each dashboard has its own graphics, so every number here is counted over
     one board's profiles and relations - never the whole database. */
  var bid = activeBoard().id, bp = boardProfiles(bid), br = boardRelations(bid);
  var all = br.map(function(r){ return r.score; });
  var scored = bp.filter(function(p){ return msStats(p.id).count > 0; });
  var covered = bp.filter(function(p){ var st = msStats(p.id); return st.count && st.best >= 1; }).length;
  var single = bp.filter(function(p){ return msStats(p.id).count === 1; }).length;

  function panel(accent, icon, title, note, chart, table){
    return gvPanel(accent, icon, title, note, asTable ? table() : chart());

  var kpi = gvKpi;

  var head =
    '<div class="gv-head"><h2>The alliance in numbers &middot; ' + esc(eco().org.domain) + '</h2>' +
      '<p>The same relationships as the ' + esc(eco().org.domain) + ' dashboard, counted. Pick what to break down ' +
      'and what to measure - every panel below follows the same choice. Hover a bar for the detail behind it, ' +
      'or <b>click it</b> to list the people it counts.</p></div>';

  var kpis =
    '<div class="gv-kpis">' +
      kpi('blue',   'users',       bp.length, 'Microsoft contacts', 'across ' + boardDomains(bid).length + ' domains') +
      kpi('violet', 'link',        br.length, 'Mapped relations',   scored.length + ' contacts scored') +
      kpi('green',  'trending-up', all.length ? fmtScore(meanOf(all)) : '&ndash;', 'Mean score',
          all.length ? 'median ' + fmtScore(medianOf(all)) : 'nothing scored yet') +
      kpi('teal',   'target',      (bp.length ? Math.round(covered / bp.length * 100) : 0) + '%', 'Coverage', 'at least one +1 or better') +
      kpi('amber',  'flag',        bp.length - scored.length, 'Not yet scored', 'nobody has rated them') +
      kpi('rose',   'crown',       single, 'Held by one person', 'lost if that person leaves') +
    '</div>';

  var tools =
    '<div class="gv-tools">' +
      '<b>Break down by</b>' + seg('gv-dim', GV_DIMS, gvDim().id) +

      '<div class="spacer"></div>' +
      seg('gv-view', [{ id:'chart', label:'Chart' }, { id:'table', label:'Table' }], asTable ? 'table' : 'chart') +
    '</div>';

          function(){ return gvBreakdown() + gvDrillPanel(); },
          function(){ return gvBreakdownTable() + gvDrillPanel(); }) +
    '<div class="chart-grid">' +
      panel('teal', 'target', 'Where the scores sit',
            'All ' + br.length + ' approved relationships on this board, by level. Position on the scale carries the sign - the colour repeats it.',
            gvDistribution, gvDistributionTable) +
      panel('violet', 'users', 'Who holds the relationships',
            'Relationships per Columbus employee on this board. People holding none are left out.',
            gvHolders, gvHoldersTable) +
    '</div>' +
  '</div>';
}

/* ============================================================
   7. PAGE 3 - MICROSOFT PROFILES
   ============================================================ */

var BANDS = [
  { id:'',         label:'All relationship levels' },
  { id:'strong',   label:'Strong (+2 / +3)' },
  { id:'positive', label:'Positive (+1)' },
  { id:'neutral',  label:'Neutral (0)' },
  { id:'negative', label:'Negative (-1 to -3)' },
  { id:'none',     label:'No connection yet' }
];
function bandOf(s){
  if (!s.count) return 'none';
  if (s.best >= 2) return 'strong';
  if (s.best === 1) return 'positive';
  if (s.best === 0) return 'neutral';
  return 'negative';
}

function msRows(){
  var u = state.ui, q = u.msSearch.trim().toLowerCase();
  var rows = state.msProfiles.map(function(p){
    var s = msStats(p.id);
    return {
      id:p.id, name:p.name, title:p.title, group:p.group, source:p.source,
      domainIds:p.domainIds, updatedAt:p.updatedAt, email:p.email, phone:p.phone,
      boards:boardsOfProfile(p), profile:p,
      owner: (ownerOf(p) || {}).name || '',
      lastContact: (lastContactOf(p.id) || {}).date || '',
      count:s.count, sum:s.sum, best:s.best, mean:s.mean, median:s.median, band:bandOf(s)
    };
  });
  rows = rows.filter(function(r){
    var hay = r.name + ' ' + r.title + ' ' + r.email + ' ' + r.owner + ' ' +
              customersOf(r.profile).map(function(c){ return c.name; }).join(' ');
    if (q && hay.toLowerCase().indexOf(q) === -1) return false;
    /* Someone who sits on both boards matches either filter - the point of
       letting a person belong to two dashboards. */
    if (u.msBoard && !profileInBoard(r, u.msBoard)) return false;
    if (u.msDomain && r.domainIds.indexOf(u.msDomain) === -1) return false;
    if (u.msGroup  && r.group  !== u.msGroup)  return false;
    if (u.msSource && r.source !== u.msSource) return false;
    if (u.msBand   && r.band   !== u.msBand)   return false;
    return true;
  });
  return sortBy(rows, u.msSort, u.msDir);
}

function selectField(label, action, value, options, allLabel){
  var opts = (allLabel ? '<option value="">' + esc(allLabel) + '</option>' : '') + options.map(function(o){
    var v = typeof o === 'string' ? o : o.id, t = typeof o === 'string' ? o : o.label;
    return '<option value="' + esc(v) + '"' + (value === v ? ' selected' : '') + '>' + esc(t) + '</option>';
  }).join('');
  return '<div class="field"><label>' + esc(label) + '</label><select data-action="' + action + '">' + opts + '</select></div>';
}
function th(label, key, sortKey, dir, cls){
  return '<th class="sortable ' + (cls||'') + '" data-action="sort-ms" data-key="' + key + '">' +
         esc(label) + sortArrow(sortKey === key, dir) + '</th>';
}

        ? '<div class="chips">' + r.boards.map(function(b){
            return '<span class="chip">' + esc(b.label) + '</span>'; }).join('') + '</div>'
        : '<span class="hint">No dashboard</span>') + '</td>' +
      '<td>' + domainChips(r.domainIds) + '</td>' +
      '<td><span class="chip chip--muted">' + esc(r.group) + '</span></td>' +

      '<td>' + (r.owner ? esc(r.owner) : '<span class="hint">None</span>') + '</td>' +
      '<td>' + (r.lastContact ? fmtDate(r.lastContact) : '<span class="hint">Unknown</span>') + '</td>' +
      '<td>' + fmtDate(r.updatedAt) + '</td>' +
      '<td class="actions">' +
        '<button class="btn btn--sm" data-action="ms-edit" data-id="' + r.id + '"' + (editable ? '' : ' disabled') + '>Edit</button> ' +
        '<button class="btn btn--sm btn--danger" data-action="ms-delete" data-id="' + r.id + '"' + (editable ? '' : ' disabled') + '>Delete</button>' +
      '</td></tr>';
  }).join('') : '<tr><td colspan="12"><div class="empty"><b>No profiles match your filters</b>Try clearing the search or filters.</div></td></tr>';

  var table =
    '<div class="card">' + toolbar + '<div class="tablewrap"><table><thead><tr>' +
      th('Name','name',u.msSort,u.msDir) + th('Title','title',u.msSort,u.msDir) +
      '<th>Dashboard</th><th>Domains</th>' + th('Group','group',u.msSort,u.msDir) + th('Source','source',u.msSort,u.msDir) +
      th('Conn.','count',u.msSort,u.msDir) + th('Mean score','mean',u.msSort,u.msDir) +
      th('Owner','owner',u.msSort,u.msDir) + th('Last contact','lastContact',u.msSort,u.msDir) +
      th('Updated','updatedAt',u.msSort,u.msDir) + '<th></th>' +
    '</tr></thead><tbody>' + body + '</tbody></table></div></div>';

  var legend = '<div class="card" style="margin-top:18px"><div class="card__body">' +
    scaleHeading() + scoreLegend() +
    '<p class="hint" style="margin:12px 0 0">The table shows the <b>mean</b> of all Columbus relationships to that person. Hover the score for the <b>median</b>, the number of relations and the summed "vector" behind it. Click a row for the individual scores.</p>' +
    '</div></div>';

  return head + stats + table + legend;
}

/* ============================================================
   7b. PAGE - DASHBOARDS  (Admin only)

   A dashboard is one department's view of Microsoft: its own board, its own
   graphics page, its own domains. Adding one here is enough - the two menu
   entries, the routes and the ring all follow from the record, and the panels
   come from whichever domains are pointed at the board.
   ============================================================ */

function viewDashboards(){
  var editable = canEdit();

  var rows = state.boards.map(function(b){
    var doms = boardDomains(b.id), profiles = boardProfiles(b.id), rels = boardRelations(b.id);
    var scores = rels.map(function(r){ return r.score; });
    var over = boardOverflow(b.id);
    var panels = Math.min(doms.length, ECO_PANEL_LIMIT);

    return '<tr>' +
      '<td><b>' + esc(b.label) + '</b>' +

/* ============================================================
   10. PAGE - RELATIONSHIP UPKEEP

   The scores say how good the relationships are. This page says whether anyone
   is still having them. It shows everybody's, not just your own, so a colleague
   can pick up a contact that is slipping while their owner is on holiday.
   ============================================================ */

var UPKEEP_STATUSES = [
  { id:'',        label:'All statuses' },
  { id:'overdue', label:'Overdue' },
  { id:'due',     label:'Due soon' },
  { id:'ok',      label:'On track' },
  { id:'unknown', label:'Never logged' },
  { id:'logged',  label:'No reminder set' }
];

function upkeepRows(){
  var u = state.ui, q = u.upSearch.trim().toLowerCase();
  var rows = state.msProfiles.map(function(p){
    var k = upkeepOf(p), owner = ownerOf(p);
    return {
      id:p.id, name:p.name, title:p.title, profile:p,
      owner: owner ? owner.name : '', ownerId: p.ownerId || '',
      cadence: cadence(p.cadence).label,
      cadenceMonths: cadence(p.cadence).months,
      last: k.last ? k.last.date : '',
      days: k.days === null ? 99999 : k.days,          // never logged sorts last
      status: k.status, statusLabel: UPKEEP_LABELS[k.status].label,
      /* The default order is what needs attention, not the alphabet: the people
         on a reminder who have slipped come first, then the ones nobody has
         written anything down about. */
      rank: { overdue:0, due:1, unknown:2, ok:3, logged:4 }[k.status]
    };
  });
  rows = rows.filter(function(r){
    if (q && (r.name + ' ' + r.title + ' ' + r.owner).toLowerCase().indexOf(q) === -1) return false;
    if (u.upOwner === '__none' && r.ownerId) return false;
    if (u.upOwner && u.upOwner !== '__none' && r.ownerId !== u.upOwner) return false;
    if (u.upStatus && r.status !== u.upStatus) return false;
    return true;
  });
  return sortBy(rows, u.upSort, u.upDir);
}

function upkeepChip(status){
  var l = UPKEEP_LABELS[status];
  return '<span class="up-chip up-chip--' + l.cls + '">' + esc(l.label) + '</span>';
}

/* "Sidst kontaktet" in words, because a date alone does not tell you it has
   been seven months. */
function sinceText(row){
  if (!row.last) return '<span class="hint">Unknown</span>';
  var d = row.days;
  var ago = d <= 0 ? 'today' : d === 1 ? 'yesterday'
          : d < 31 ? d + ' days ago'
          : Math.round(d / 30) + ' month' + (Math.round(d / 30) === 1 ? '' : 's') + ' ago';
  return fmtDate(row.last) + ' <span class="hint">&middot; ' + ago + '</span>';
}

function thu(label, key, cls){
  return '<th class="sortable ' + (cls || '') + '" data-action="sort-up" data-key="' + key + '">' +
         esc(label) + sortArrow(state.ui.upSort === key, state.ui.upDir) + '</th>';
}

      '<td>' + (r.cadenceMonths ? esc(r.cadence) : '<span class="hint">' + esc(r.cadence) + '</span>') + '</td>' +

/* ------------------------------------------------------------
   Graphics for Relationship Upkeep.

   The upkeep table answers "who do I call today". This answers the questions
   above it: is the loop actually being used, is it evenly spread, and which
   department is letting its relationships go quiet.
   ------------------------------------------------------------ */

function ugProfiles(){
  var b = state.ui.ugBoard;
  return b ? boardProfiles(b) : state.msProfiles;
}

/* Contacts logged per month, oldest first - the shape that says whether anyone
   is keeping the loop alive, rather than how it looked on one day. */
function ugByMonth(months){
  var ids = ugProfiles().map(function(p){ return p.id; });
  var out = [];
  for (var i = months - 1; i >= 0; i--) {
    var m = addMonths(today(), -i).slice(0, 7);
    out.push({ key:m, label:MONTHS[parseInt(m.slice(5, 7), 10) - 1] + ' ' + m.slice(2, 4), n:0 });
  }
  state.contacts.forEach(function(c){
    if (ids.indexOf(c.msProfileId) === -1) return;
    var m = c.date.slice(0, 7);
    out.forEach(function(x){ if (x.key === m) x.n++; });
  });
  return out;
}

function ugStatusCounts(){
  var counts = {};
  ['overdue','due','ok','logged','unknown'].forEach(function(k){ counts[k] = 0; });
  ugProfiles().forEach(function(p){ counts[upkeepOf(p).status]++; });
  return counts;
}

/* Per owner: how many of their people have slipped. The one panel that names
   somebody, which is the point - upkeep is a person's job, not a department's. */
function ugOwnerRows(){
  var rows = [];
  ugProfiles().forEach(function(p){
    if (!p.ownerId) return;
    var row = null;
    rows.forEach(function(x){ if (x.id === p.ownerId) row = x; });
    if (!row) { row = { id:p.ownerId, label:(cb(p.ownerId) || {}).name || '?', total:0, late:0 }; rows.push(row); }
    row.total++;
    var st = upkeepOf(p).status;
    if (st === 'overdue' || st === 'due') row.late++;
  });
  return rows.sort(function(a, b){ return b.late - a.late || b.total - a.total; });
}

function ugBoardRows(){
  return state.boards.map(function(b){
    var ps = boardProfiles(b.id), late = 0, tracked = 0;
    ps.forEach(function(p){
      if (!cadence(p.cadence).months) return;
      tracked++;
      var st = upkeepOf(p).status;
      if (st === 'overdue' || st === 'due') late++;
    });
    return { id:b.id, label:b.label, total:ps.length, tracked:tracked, late:late,
             pct: tracked ? Math.round((tracked - late) / tracked * 100) : 0 };
  });
}


/* The people behind one bar, in the same spirit as the drill-down on the board
   graphics: a count tells you where the problem is, the list tells you whose it
   is. Each panel drills on its own key, so only one list is ever open, under the
   chart it belongs to - and every row carries the same Register contact button
   as the table, so you can act on what the chart just showed you. */
function ugDrillMatch(kind){
  var d = state.ui.ugDrill;
  return d && d.kind === kind ? d.key : null;
}
function ugDrillAttrs(kind, key, label){
  var openKey = ugDrillMatch(kind);
  return ' data-action="ug-drill" data-kind="' + esc(kind) + '" data-k="' + esc(key) + '"' +
         ' role="button" aria-expanded="' + (openKey === key) + '"' +
         (openKey === key ? ' data-open="true"' : '') +
         ' aria-label="' + esc('Show the people behind ' + label) + '"';
}

/* One row per person, with what the upkeep table shows and the same action. */
function ugPeopleTable(people, emptyNote){
  if (!people.length) {
    return '<div class="empty" style="margin:0"><b>Nobody here</b>' + esc(emptyNote) + '</div>';
  }
  var rows = people.map(function(p){
    var k = upkeepOf(p), owner = ownerOf(p);
    return '<tr>' +
      '<td class="clickable" data-action="ms-open" data-id="' + p.id + '">' + personCell(p.name, p.title) + '</td>' +
      '<td>' + (owner ? esc(owner.name) : '<span class="hint">No owner</span>') + '</td>' +
      '<td>' + (k.last ? fmtDate(k.last.date) : '<span class="hint">Unknown</span>') + '</td>' +
      '<td>' + upkeepChip(k.status) + '</td>' +
      '<td class="actions"><button class="btn btn--sm" data-action="contact-log" data-id="' + p.id + '">Register contact</button></td>' +
    '</tr>';
  }).join('');
  return '<div class="tablewrap"><table><thead><tr>' +
    '<th>Microsoft person</th><th>Owner</th><th>Last contact</th><th>Status</th><th></th>' +

function ugDrillPanel(kind, title, people, emptyNote, body){

  return '<div class="gv-drill">' +
    '<div class="gv-drill__head">' +
      '<div><b>' + esc(title) + '</b>' +

      '<button type="button" class="btn btn--sm btn--ghost" data-action="ug-drill" data-kind="' + esc(kind) + '" data-k="">Close</button>' +

function viewUpkeepGraphics(){
  var u = state.ui, asTable = u.ugView === 'table';
  var ps = ugProfiles();
  var counts = ugStatusCounts();
  var logged = ps.filter(function(p){ return !!lastContactOf(p.id); });
  var days = logged.map(function(p){ return upkeepOf(p).days; });
  var months = ugByMonth(12);
  var thisMonth = months[months.length - 1].n;
  var scope = u.ugBoard ? boardById(u.ugBoard).label : 'every dashboard';

  var head =
    '<div class="gv-head"><h2>Upkeep in numbers</h2>' +
      '<p>Whether the relationships are actually being kept warm, across ' + esc(scope) + '. ' +
      'The table on <a href="#/upkeep">Relationship Upkeep</a> says who to call today; this says ' +
      'whether anyone is calling at all, and who is carrying it.</p></div>';

  var kpis =
    '<div class="gv-kpis">' +
      gvKpi('blue',   'users',       ps.length, 'Microsoft contacts', 'in this scope') +
      gvKpi('violet', 'link',        counts.overdue + counts.due, 'Need a call',
            counts.overdue + ' overdue, ' + counts.due + ' due soon') +
      gvKpi('green',  'trending-up', thisMonth, 'Contacts logged this month',
            state.contacts.length + ' in the log all told') +
      gvKpi('teal',   'target',      logged.length ? Math.round(medianOf(days)) + ' days' : '&ndash;',
            'Median since contact', 'across the ' + logged.length + ' with a log') +
      gvKpi('amber',  'flag',        counts.unknown, 'Never logged', 'nobody has written anything down') +
      gvKpi('rose',   'crown',       ps.filter(function(p){ return !cadence(p.cadence).months; }).length,
            'No reminder set', 'tracked, but no mail goes out') +
    '</div>';

  /* ---- status distribution ---- */
  var order = [
    { k:'overdue', label:'Overdue',       bg:'#c0392b' },
    { k:'due',     label:'Due soon',      bg:'#d98a0b' },
    { k:'ok',      label:'On track',      bg:'#1b8a4b' },
    { k:'logged',  label:'No reminder',   bg:'#8494a6' },
    { k:'unknown', label:'Never logged',  bg:'#b6c0cc' }
  ];
  function statusChart(){
    var max = order.reduce(function(n, o){ return Math.max(n, counts[o.k]); }, 0) || 1;
    return '<div class="cols">' + order.map(function(o){
      return '<div class="cols__col" tabindex="0" data-tip="' + esc(o.label + ' · ' + counts[o.k] + ' of ' + ps.length) + '"' +
        ugDrillAttrs('status', o.k, o.label) + '>' +
        '<span class="cols__val">' + counts[o.k] + '</span>' +
        '<span class="cols__bar" style="height:' + (counts[o.k] / max * 100).toFixed(1) + '%;background:' + o.bg + '"></span>' +
      '</div>';
    }).join('') + '</div><div class="cols__ax">' +
      order.map(function(o){ return '<span>' + esc(o.label) + '</span>'; }).join('') + '</div>';
  }
  function statusDrill(){
    var k = ugDrillMatch('status');
    if (k === null) return '';
    var o = null; order.forEach(function(x){ if (x.k === k) o = x; });
    return ugDrillPanel('status', o ? o.label : k,
      ps.filter(function(p){ return upkeepOf(p).status === k; }),
      'No contact in this scope has that status.');
  }
  function statusTable(){
    return gvTable(['Status', 'Contacts', 'Share'], order.map(function(o){
      return [esc(o.label), counts[o.k], ps.length ? Math.round(counts[o.k] / ps.length * 100) + '%' : '0%'];
    }));
  }

  /* ---- per owner ---- */
  function ownerChart(){
    var rows = ugOwnerRows();
    if (!rows.length) return '<div class="empty"><b>No owners yet</b>Nobody has been made responsible for a relationship in this scope.</div>';
    var max = rows.reduce(function(n, r){ return Math.max(n, r.total); }, 0);
    return '<div class="bars">' + rows.map(function(r){
      return barRow(r.label, r.late, r.late + ' of ' + r.total,
        r.label + '  ·  owns ' + r.total + '  ·  ' + r.late + ' need a call', max,
        ugDrillAttrs('owner', r.id, r.label));
    }).join('') + '</div>';
  }
  function ownerDrill(){
    var k = ugDrillMatch('owner');
    if (k === null) return '';
    var who = cb(k);
    return ugDrillPanel('owner', who ? who.name + ' \u2014 everything they own' : 'Owner',
      ps.filter(function(p){ return p.ownerId === k; }),
      'They do not own anything in this scope.');
  }
  function ownerTable(){
    return gvTable(['Owner', 'Owns', 'Need a call'], ugOwnerRows().map(function(r){
      return [esc(r.label), r.total, r.late];
    }));
  }

  /* ---- activity over time ---- */
  function monthChart(){
    var max = months.reduce(function(n, m){ return Math.max(n, m.n); }, 0) || 1;
    return '<div class="cols">' + months.map(function(m){
      return '<div class="cols__col" tabindex="0" data-tip="' + esc(m.label + ' · ' + m.n + ' contact' + (m.n === 1 ? '' : 's') + ' logged') + '"' +
        ugDrillAttrs('month', m.key, m.label) + '>' +
        '<span class="cols__val">' + (m.n || '') + '</span>' +
        '<span class="cols__bar" style="height:' + (m.n / max * 100).toFixed(1) + '%;background:var(--navy-600)"></span>' +
      '</div>';
    }).join('') + '</div><div class="cols__ax">' +
      months.map(function(m){ return '<span>' + esc(m.label.slice(0, 3)) + '</span>'; }).join('') + '</div>';
  }
  function monthTable(){
    return gvTable(['Month', 'Contacts logged'], months.map(function(m){ return [esc(m.label), m.n]; }));
  }

  /* A month holds contacts, not people - so this one lists the log entries
     themselves, with who wrote each of them down. */
  function monthDrill(){
    var k = ugDrillMatch('month');
    if (k === null) return '';
    var ids = ps.map(function(p){ return p.id; });
    var log = state.contacts.filter(function(c){
      return c.date.slice(0, 7) === k && ids.indexOf(c.msProfileId) !== -1;
    }).sort(function(a, b){ return a.date < b.date ? 1 : -1; });
    var m = null; months.forEach(function(x){ if (x.key === k) m = x; });
    var body = log.length
      ? '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Microsoft person</th><th>Registered by</th></tr></thead><tbody>' +
        log.map(function(c){
          var pp = ms(c.msProfileId);
          return '<tr><td style="width:130px">' + fmtDate(c.date) + '</td>' +
            '<td class="clickable" data-action="ms-open" data-id="' + c.msProfileId + '">' +
              personCell(pp ? pp.name : '?', pp ? pp.title : '') + '</td>' +
            '<td>' + esc((cb(c.byId) || {}).name || 'unknown') + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<div class="empty" style="margin:0"><b>Nothing logged</b>No contact was written down that month.</div>';
    return ugDrillPanel('month', (m ? m.label : k) + ' \u2014 contacts logged', null, '', body);
  }

  /* ---- per dashboard ---- */
  function boardChart(){
    var rows = ugBoardRows();
    return '<div class="bars">' + rows.map(function(r){
      return barRow(r.label, r.pct, r.pct + '%',
        r.label + '  ·  ' + r.tracked + ' on a reminder  ·  ' + r.late + ' need a call', 100,
        ugDrillAttrs('board', r.id, r.label));
    }).join('') + '</div><div class="axnote"><span class="axnote__scale"><span>0</span><span>100%</span></span></div>';
  }
  function boardDrill(){
    var k = ugDrillMatch('board');
    if (k === null) return '';
    var b = boardById(k);
    return ugDrillPanel('board', (b ? b.label : k) + ' \u2014 on a reminder',
      boardProfiles(k).filter(function(p){ return cadence(p.cadence).months; }),
      'Nobody on this dashboard carries a reminder yet.');
  }
  function boardTable(){
    return gvTable(['Dashboard', 'Contacts', 'On a reminder', 'Need a call', 'On track'],
      ugBoardRows().map(function(r){ return [esc(r.label), r.total, r.tracked, r.late, r.pct + '%']; }));
  }

  var boardOpts = [{ id:'', label:'All dashboards' }].concat(state.boards.map(function(b){
    return { id:b.id, label:b.label }; }));
  var tools =
    '<div class="gv-tools">' +
      '<b>Scope</b>' + seg('ug-board', boardOpts, u.ugBoard) +
      '<div class="spacer"></div>' +
      seg('ug-view', [{ id:'chart', label:'Chart' }, { id:'table', label:'Table' }], asTable ? 'table' : 'chart') +
    '</div>';

  return '<div class="gv">' + head + kpis + tools +
    gvPanel('blue', 'layers', 'Where the upkeep stands',
      'Every Microsoft contact in this scope, by status. Click a column for the people behind it.',
      (asTable ? statusTable() : statusChart()) + statusDrill()) +
    '<div class="chart-grid">' +
      gvPanel('violet', 'users', 'What each owner is carrying',
        'How many relationships each owner holds, and how many of them need a call. A long bar is a person to help, not to blame.',
        (asTable ? ownerTable() : ownerChart()) + ownerDrill()) +
      gvPanel('teal', 'trending-up', 'Contacts logged per month',
        'The last twelve months. A falling line means the loop is being ignored, whatever the scores say.',
        (asTable ? monthTable() : monthChart()) + monthDrill()) +
    '</div>' +
    gvPanel('green', 'target', 'Upkeep per dashboard',
      'Share of the people on a reminder who are still on track, per department.',
      (asTable ? boardTable() : boardChart()) + boardDrill()) +
  '</div>';
}

function buildDraft(){
  state.ui.myDraft = relationsForCb(state.session.userId).map(function(r){
    return { msProfileId:r.msProfileId, score:r.score, note:r.note,
             origScore:r.score, origNote:r.note, removed:false };
  });
}
function draftDirty(d){
  if (d.removed) return true;
  if (d.origScore === null) return true;
  return d.score !== d.origScore || d.note !== d.origNote;
}
function draftItem(msId){
  var list = state.ui.myDraft || [];
  for (var i=0;i<list.length;i++){ if (list[i].msProfileId === msId) return list[i]; }
  return null;
}

function viewMyRelations(){
  if (!state.ui.myDraft) buildDraft();
  var draft = state.ui.myDraft, user = me();
  var dirtyCount = draft.filter(draftDirty).length;

  var available = state.msProfiles.filter(function(p){ return !draftItem(p.id); })
    .sort(function(a,b){ return a.name < b.name ? -1 : 1; });

  var cards = draft.filter(function(d){ return !d.removed; }).map(function(d){
    var p = ms(d.msProfileId);
    if (!p) return '';
    var dirty = draftDirty(d);
    return '<div class="rel ' + (dirty ? 'dirty' : '') + '">' +
      '<div class="rel__top">' + personCell(p.name, p.title) +
        '<div>' + domainChips(p.domainIds) + '</div>' +
        '<div class="spacer"></div>' +
        (dirty && d.origScore === null ? '<span class="tag-new">New</span>' : '') +
        (dirty && d.origScore !== null ? '<span class="tag-new">Unsaved</span>' : '') +
        scorePicker(d.score, 'my-score', 'data-id="' + p.id + '"') +
        '<button class="btn btn--sm btn--danger" data-action="my-remove" data-id="' + p.id + '">Remove</button>' +
      '</div>' +
      '<textarea class="rel__note" data-action="my-note" data-id="' + p.id + '" id="note-' + p.id + '" ' +
        'placeholder="How do you know them? Latest contact?">' + esc(d.note) + '</textarea>' +
    '</div>';
  }).join('');

  var removed = draft.filter(function(d){ return d.removed; }).map(function(d){
    var p = ms(d.msProfileId);
    return '<div class="rel" style="opacity:.65">' +
      '<div class="rel__top">' + personCell(p ? p.name : '?', p ? p.title : '') +
        '<div class="spacer"></div>' +
        '<span class="chip" style="background:var(--danger-bg);color:var(--danger)">Marked for removal</span>' +
        '<button class="btn btn--sm" data-action="my-undo" data-id="' + d.msProfileId + '">Undo</button>' +
      '</div></div>';
  }).join('');

  var picker = '<div class="card"><div class="card__body">' +
    '<div class="toolbar" style="border:0;background:transparent;padding:0">' +
      '<div class="field" style="flex:1;min-width:280px"><label>Add a Microsoft contact you know</label>' +
        '<select data-action="my-pick" id="my-pick">' +
          '<option value="">Select a Microsoft profile...</option>' +
          available.map(function(p){
            return '<option value="' + p.id + '"' + (state.ui.myPicker === p.id ? ' selected' : '') + '>' +
                   esc(p.name + ' - ' + p.title) + '</option>';
          }).join('') +
        '</select></div>' +
      '<button class="btn btn--primary" data-action="my-add"' + (state.ui.myPicker ? '' : ' disabled') + '>+ Add relation</button>' +
    '</div></div></div>';

  return '' +
    '<div class="page__head"><div><h2>My Relations</h2>' +
      '<p>Your own Microsoft contacts, ' + esc(user.name) + '. Adjust the scores, add or remove people, then save.</p></div>' +
      '<div class="page__actions">' +
        '<span class="hint">' + (dirtyCount ? dirtyCount + ' unsaved change' + (dirtyCount === 1 ? '' : 's') : 'No unsaved changes') + '</span>' +
        '<button class="btn" data-action="my-reset"' + (dirtyCount ? '' : ' disabled') + '>Discard changes</button>' +
        '<button class="btn btn--accent" data-action="my-save"' + (dirtyCount ? '' : ' disabled') + '>Save changes</button>' +
      '</div></div>' +
    '<div class="mockflag">Saving writes straight to the data - there is no approval step. Anyone at Columbus can correct anyone else, and every change is attributable.</div>' +
    '<div class="card" style="margin-bottom:18px"><div class="card__body">' + scaleHeading() + scoreLegend() +
      scoreDefsHtml('inline') + '</div></div>' +
    picker +
    '<div style="display:grid;gap:12px;margin-top:18px">' + (cards || '<div class="card"><div class="empty"><b>You have no relations yet</b>Add a Microsoft contact above to get started.</div></div>') + removed + '</div>';
}

var pendingConfirm = null;

function renderLayer(){
  var out = '';
  if (state.ui.msDetail) out += drawerMs(state.ui.msDetail);
  if (state.ui.modal)    out += modalMarkup(state.ui.modal);
  document.getElementById('layer').innerHTML = out;
  var first = document.querySelector('#layer input, #layer select, #layer textarea');
  if (first) first.focus();
}
function openModal(m){ state.ui.modal = m; renderLayer(); }
function closeLayer(){ state.ui.modal = null; state.ui.msDetail = null; pendingConfirm = null; renderLayer(); }

function drawerMs(id){
  var p = ms(id);
  if (!p) return '';
  var s = msStats(id);
  var custs = customersOf(p), keep = upkeepOf(p), owner = ownerOf(p);
  var log = contactsFor(p.id);
  var rs = relationsForMs(id).slice().sort(function(a,b){ return b.score - a.score; });
  var conns = rs.length ? rs.map(function(r){
    var person = cb(r.columbusId);
    return '<tr><td>' + personCell(person ? person.name : '?', person ? person.title : '') + '</td>' +
           '<td style="width:60px">' + scoreChip(r.score) + '</td>' +
           '<td style="color:var(--text-muted)">' + esc(r.note) + '</td></tr>';
  }).join('') : '<tr><td colspan="3"><div class="empty" style="padding:22px"><b>No connections yet</b>Nobody at Columbus has registered a relationship with this person.</div></td></tr>';

  return '<div class="drawer"><div class="drawer__bg" data-action="close-layer"></div><div class="drawer__panel">' +
    '<div class="drawer__head"><div>' + personCell(p.name, p.title) +
      '<p>' + (p.email ? esc(p.email) : '<span class="hint">No e-mail on file</span>') + '</p></div>' +

      '<div style="margin-left:auto"><button class="btn btn--sm btn--ghost" data-action="close-layer">&#10005;</button></div></div>' +
    '<div class="drawer__body">' +
      '<div class="stats" style="margin:0;grid-template-columns:1fr 1fr">' +
        '<div class="stat"><b>' + s.count + '</b><span>Columbus connections</span></div>' +
        '<div class="stat"><b>' + (s.count ? fmtScore(s.mean) : '&ndash;') + '</b><span>Mean score</span>' +
          '<em>' + (s.count ? 'median ' + fmtScore(s.median) + ' \u00b7 sum ' + signed(s.sum) : 'no connections yet') + '</em></div>' +
      '</div>' +
      '<dl class="kv">' +
        '<dt>Dashboards</dt><dd>' + (boardsOfProfile(p).length
          ? '<div class="chips">' + boardsOfProfile(p).map(function(b){
              return '<span class="chip">' + esc(b.label) + '</span>'; }).join('') + '</div>'
          : '<span class="hint">Not on a dashboard yet</span>') + '</dd>' +
        '<dt>Domains</dt><dd>' + domainChips(p.domainIds) + '</dd>' +
        '<dt>Phone</dt><dd>' + (p.phone ? esc(p.phone) : '<span class="hint">Not on file</span>') + '</dd>' +
        '<dt>E-mail</dt><dd>' + (p.email ? esc(p.email) : '<span class="hint">Not on file</span>') + '</dd>' +
        '<dt>Customers</dt><dd>' + (custs.length
          ? '<div class="chips">' + custs.map(function(c){ return '<span class="chip">' + esc(c.name) + '</span>'; }).join('') + '</div>'
          : '<span class="hint">None recorded</span>') + '</dd>' +
        '<dt>Group</dt><dd>' + esc(p.group) + '</dd>' +
        '<dt>Source</dt><dd><span class="chip chip--src">' + esc(p.source) + '</span></dd>' +
        '<dt>Last updated</dt><dd>' + fmtDate(p.updatedAt) + '</dd>' +
        '<dt>Notes</dt><dd style="color:var(--text-muted)">' + esc(p.notes) + '</dd>' +
      '</dl>' +
      '<div><h4 style="font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:10px">Keeping in touch</h4>' +
        '<dl class="kv">' +
          '<dt>Owner</dt><dd>' + (owner
            ? esc(owner.name) + ' <span class="hint">&middot; ' + esc(owner.department) + '</span>'
            : '<span class="hint">None yet &mdash; an owner has to have a relation first</span>') + '</dd>' +
          '<dt>Reminder</dt><dd>' + esc(keep.cadence.label) +
            (keep.cadence.months ? '' : ' <span class="hint">&middot; no mail goes out</span>') + '</dd>' +
          '<dt>Last contact</dt><dd>' + (keep.last

              esc((cb(keep.last.byId) || {}).name || 'unknown') + '</span>'

        '</dl>' +

        (log.length > 1

              return '<tr><td style="width:120px">' + fmtDate(c.date) + '</td>' +

function modalMarkup(m){
  if (m.type === 'confirm') {
    return shellModal(m.title, m.sub,
      '<p style="margin:0;line-height:1.6">' + m.body + '</p>',
      '<button class="btn" data-action="close-layer">Cancel</button>' +
      '<button class="btn ' + (m.danger ? 'btn--danger' : 'btn--primary') + '" data-action="confirm-yes">' + esc(m.okLabel || 'Confirm') + '</button>');
  }
  if (m.type === 'ms') {
    var p = m.id ? ms(m.id) : { name:'', title:'', email:'', phone:'', group:MS_GROUPS[2],
                                source:MS_SOURCES[3], domainIds:[], notes:'', ownerId:'',
                                cadence:'none', customerIds:[] };
    var owners = m.id ? eligibleOwners(m.id) : [];
    return shellModal(m.id ? 'Edit Microsoft profile' : 'Add Microsoft profile',
      'Microsoft Denmark contact. Domains can be changed later without touching the relationships.',
      '<div class="form-grid">' +
        inputField('f-name', 'Full name', p.name, 'full') +
        inputField('f-title', 'Title / role', p.title) +
        inputField('f-email', 'E-mail', p.email) +
        inputField('f-phone', 'Phone', p.phone || '') +
        selField('f-group', 'Group', MS_GROUPS, p.group) +
        selField('f-source', 'Source', MS_SOURCES, p.source) +
        /* Only people who already hold a relation can be made owner - owning
           somebody nobody has spoken to would be a title, not a job. */
        (owners.length
          ? selField('f-owner', 'Relationship owner',
              [{ id:'', label:'\u2014 No owner' }].concat(owners.map(function(c){
                return { id:c.id, label:c.name }; })), p.ownerId || '')
          : '<div class="field"><label>Relationship owner</label>' +
            '<p class="hint" style="margin:6px 0 0">Nobody has a relation to this person yet, so there is ' +
            'no one to own it. Add a relation first.</p></div>') +
        selField('f-cadence', 'Reminder', CADENCES.map(function(c){
          return { id:c.id, label:c.label }; }), p.cadence || 'none') +
        '<div class="field full"><label>Customers they cover</label>' +
          '<select id="f-customers" multiple size="6" style="min-height:120px">' +
            state.customers.map(function(c){
              return '<option value="' + c.id + '"' +
                     ((p.customerIds || []).indexOf(c.id) !== -1 ? ' selected' : '') + '>' +
                     esc(c.name) + '</option>';
            }).join('') +
          '</select>' +
          '<p class="hint" style="margin:6px 0 0">Hold &#8984; or Ctrl to pick several. ' +
          'The list comes from Thomas\' deck; the type of each customer is still unset.</p></div>' +
        /* Grouped per dashboard, and ticking domains from two boards is how a
           person ends up on both - the many-to-many is the feature. */
        '<div class="field full"><label>Domains</label><div class="checks">' +
          boards().map(function(b){
            return '<b style="grid-column:1/-1;font-size:10.5px;text-transform:uppercase;' +
                   'letter-spacing:.07em;color:var(--text-faint);margin-top:4px">' + esc(b.label) + '</b>' +
              boardDomains(b.id).map(function(d){
                return '<label><input type="checkbox" class="f-dom" value="' + d.id + '"' +

  }
  if (m.type === 'mail') {
    var queue = reminderQueue(), when = fmtDate(firstMondayAfter(today()));
    var boxes = queue.length ? queue.map(function(row){
      var owner = cb(row.ownerId);
      return '<div class="up-mail__box">' +
        '<h4>To: ' + esc(owner ? (owner.email || owner.name) : 'owner') + '</h4>' +
        '<span class="hint">Subject: Your Microsoft relationships this month (' + row.people.length + ')</span>' +
        '<ul>' + row.people.map(function(p){
          var k = upkeepOf(p);
          return '<li>' + esc(p.name) + ' &mdash; ' +
            (k.last ? 'last contact ' + fmtDate(k.last.date) : 'no contact logged') + '</li>';
        }).join('') + '</ul></div>';
    }).join('') : '<div class="empty" style="padding:26px"><b>Nothing is due</b>' +
      'No owner would get a mail on ' + esc(when) + '.</div>';

    return shellModal('The reminder mail',
      'One mail per owner, first Monday of the month - next on ' + when + '.',
      '<div class="up-mail">' + boxes + '</div>' +
      '<div class="mockflag" style="margin:14px 0 0">Mockup - no mail is actually sent. This is what would go out, ' +
      'built from the people who are overdue or due within ten days.</div>',
      '<button class="btn btn--primary" data-action="close-layer">Close</button>');
  }
  if (m.type === 'board') {
    var b = m.id ? boardById(m.id) : { label:'', subtitle:'', owner:'', version:'v0.1 draft', updated:'' };
    var routeNote = m.id
      ? 'Renaming changes the heading, the hub and the menu entries. The two page addresses ' +
        '(<code>#/' + esc(b.dashboard) + '</code>, <code>#/' + esc(b.graphics) + '</code>) stay as they are, ' +
        'so links already shared keep working.'
      : 'The board and graphics pages are created with it and appear in the left menu straight away. ' +
        'It starts empty - give it panels by pointing domains at it on Microsoft Domains.';
    return shellModal(m.id ? 'Edit dashboard' : 'Add dashboard', 'One dashboard per department.',
      '<div class="form-grid">' +
        inputField('f-blabel', 'Dashboard name', b.label, 'full') +
        inputField('f-bsub', 'Subtitle', b.subtitle || '', 'full') +
        inputField('f-bowner', 'Process owner', b.owner || '') +
        inputField('f-bversion', 'Version', b.version || '') +
        inputField('f-bupdated', 'Updated', b.updated || '') +
        '<p class="hint full" style="margin:2px 0 0">' + routeNote + '</p>' +
      '</div>',
      '<button class="btn" data-action="close-layer">Cancel</button>' +
      '<button class="btn btn--primary" data-action="board-save" data-id="' + (m.id || '') + '">' +
        (m.id ? 'Save dashboard' : 'Create dashboard') + '</button>');
  }
  if (m.type === 'dom') {
    var d = m.id ? dom(m.id) : { name:'', owner:'', desc:'', dept:activeBoard().id };
    return shellModal(m.id ? 'Edit domain' : 'Add domain',
      'Domains group the Microsoft profiles, and the dashboard they belong to decides which board shows them.',
      '<div class="form-grid">' +
        inputField('f-dname', 'Domain name', d.name, 'full') +
        selField('f-ddept', 'Dashboard', boards().map(function(b){ return { id:b.id, label:b.label }; }), d.dept || boards()[0].id) +
        inputField('f-downer', 'Process owner', d.owner, 'full') +
        '<div class="field full"><label>Description</label><textarea id="f-ddesc" rows="3">' + esc(d.desc) + '</textarea></div>' +
      '</div>',
      '<button class="btn" data-action="close-layer">Cancel</button>' +
      '<button class="btn btn--primary" data-action="dom-save" data-id="' + (m.id || '') + '">Save domain</button>');
  }
  if (m.type === 'cb') {
    var c = m.id ? cb(m.id) : { name:'', title:'', email:'', department:CB_DEPARTMENTS[2], role:'standard', skills:[] };
    return shellModal(m.id ? 'Edit Columbus user' : 'Add Columbus user',
      'Internal user. They can register their own relations as soon as they sign in.',
      '<div class="form-grid">' +
        inputField('f-cname', 'Full name', c.name, 'full') +
        inputField('f-ctitle', 'Title', c.title) +
        inputField('f-cmail', 'E-mail', c.email) +
        selField('f-cdept', 'Department', CB_DEPARTMENTS, c.department) +
        selField('f-crole', 'Role', ROLES.map(function(r){ return r.name; }), roleName(c.role)) +
        inputField('f-cskills', 'Skills (comma separated)', c.skills.join(', '), 'full') +
      '</div>',
      '<button class="btn" data-action="close-layer">Cancel</button>' +
      '<button class="btn btn--primary" data-action="cb-save" data-id="' + (m.id || '') + '">' +
        (m.id ? 'Save user' : 'Create profile') + '</button>');
  }
  return '';
}
function shellModal(title, sub, body, foot){
  return '<div class="modal"><div class="modal__bg" data-action="close-layer"></div><div class="modal__panel">' +
    '<div class="modal__head"><h3>' + esc(title) + '</h3><p>' + esc(sub) + '</p></div>' +

}
function inputField(id, label, value, cls){
  return '<div class="field ' + (cls||'') + '"><label for="' + id + '">' + esc(label) + '</label>' +
         '<input type="text" id="' + id + '" value="' + esc(value) + '"></div>';
}
/* Takes either plain strings or { id, label } pairs, so a select can carry an
   id that is not the text shown (the dashboard picker needs that). */
function selField(id, label, options, value){
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><select id="' + id + '">' +
    options.map(function(o){
      var v = (o && o.id !== undefined) ? o.id : o;
      var t = (o && o.label !== undefined) ? o.label : o;
      return '<option value="' + esc(v) + '"' + (v === value ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('') +
    '</select></div>';
}
function val(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; }

/* Route-safe id for a new dashboard: a slug of the name, suffixed if taken. The
   id is what the two routes are built from, so it never changes afterwards. */
function boardSlug(name){
  var base = String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'board';
  var id = base, n = 2;
  while (byId(state.boards, id)) { id = base + '-' + n; n++; }
  return id;
}
/* Only ever called on an empty board - the handler blocks it otherwise, so no
   domain or relationship can be orphaned by this. */
function deleteBoard(id){
  var b = boardById(id);
  state.boards = state.boards.filter(function(x){ return x.id !== id; });
  delete ECOS[id];
  toast('Deleted ' + (b ? b.label : 'dashboard'), 'ok');
  if (state.ui.route === b.dashboard || state.ui.route === b.graphics) go(state.boards[0].dashboard);
  else render();
}

function deleteMsProfile(id){
  var p = ms(id);
  state.msProfiles = state.msProfiles.filter(function(x){ return x.id !== id; });
  state.relations  = state.relations.filter(function(r){ return r.msProfileId !== id; });
  state.contacts   = state.contacts.filter(function(c){ return c.msProfileId !== id; });
  state.ui.myDraft = null;
  toast('Deleted ' + (p ? p.name : 'profile') + ' and their relations', 'ok');
}
function deleteColumbusUser(id){
  var c = cb(id);
  state.columbusProfiles = state.columbusProfiles.filter(function(x){ return x.id !== id; });
  state.relations   = state.relations.filter(function(r){ return r.columbusId !== id; });
  /* Their contact log stays - it is a record of what happened, not their property -
     but anything they owned loses its owner and falls back into the gap list. */
  state.msProfiles.forEach(function(x){ if (x.ownerId === id) x.ownerId = ''; });
  toast('Deleted ' + (c ? c.name : 'user') + '. Their relations were removed with them.', 'ok');
}
/* Open editing: the draft exists so several adjustments can be made and saved in
   one go, not so somebody can approve them. Save writes straight through. */
function saveMyRelations(){
  var dirty = (state.ui.myDraft || []).filter(draftDirty);
  if (!dirty.length) return;
  var mine = state.session.userId;
  dirty.forEach(function(d){
    var existing = null;
    state.relations.forEach(function(r){
      if (r.columbusId === mine && r.msProfileId === d.msProfileId) existing = r;
    });
    if (d.removed) {
      if (existing) state.relations = state.relations.filter(function(r){ return r !== existing; });
    } else if (existing) {
      existing.score = d.score; existing.note = d.note; existing.updatedAt = today();
    } else {
      state.relations.push({ id:uid('r'), columbusId:mine, msProfileId:d.msProfileId,
                             score:d.score, note:d.note, updatedAt:today() });
    }
    var p = ms(d.msProfileId);
    if (p) p.updatedAt = today();
  });
  state.ui.myDraft = null;
  syncEcoPeople();
  toast('Saved ' + dirty.length + ' change' + (dirty.length === 1 ? '' : 's'), 'ok');
}

/* Set (or clear) one person's relationship strength on the ecosystem map. */
function ecoSetStrength(key, v){
  var parts = String(key).split(':'), g = null, i;
  for (i = 0; i < eco().groups.length; i++) { if (eco().groups[i].id === parts[0]) g = eco().groups[i]; }
  if (!g) return;
  var p = g.people[Number(parts[1])];
  if (!p) return;

  /* The dot writes a real relation for the signed-in user, then the board is
     re-derived - so the dashboard and the tables always agree. */
  var me = state.session.userId, score = v === 'none' ? null : Number(v);
  state.relations = state.relations.filter(function(r){
    return !(r.columbusId === me && r.msProfileId === p.msId);
  });
  if (score !== null) {
    state.relations.push({ id:uid('r'), columbusId:me, msProfileId:p.msId,
                           score:score, note:'Scored from the dashboard.', updatedAt:today() });
  }
  state.ui.ecoPick = null;
  render();
  toast(score === null
    ? p.name + ' is no longer scored by you'
    : p.name + ' set to ' + signed(score) + ' - ' + ecoLevel(score).label, 'ok');
}

function restoreFocus(){
  var f = state.ui.focus;
  if (!f) return;
  var el = document.getElementById(f.id);
  if (el) {
    el.focus();
    try { el.setSelectionRange(f.pos, f.pos); } catch (err) { /* type=search on some browsers */ }
  }
  state.ui.focus = null;
}

document.addEventListener('submit', function(e){
  if (e.target.getAttribute('data-action') === 'login') {
    e.preventDefault();
    state.session = { userId:'c1', role:'admin' };
    state.ui.myDraft = null;
    go('dashboard');
  }
});

document.addEventListener('input', function(e){
  var a = e.target.getAttribute('data-action');
  if (a === 'up-search') {
    state.ui.upSearch = e.target.value;
    state.ui.focus = { id:'up-search', pos:e.target.value.length };
    render();
    return;
  }
  if (a === 'ms-search') {
    state.ui.msSearch = e.target.value;
    state.ui.focus = { id:'ms-search', pos:e.target.value.length };
    render();
  } else if (a === 'cb-search') {
    state.ui.cbSearch = e.target.value;
    state.ui.focus = { id:'cb-search', pos:e.target.value.length };
    render();
  } else if (a === 'my-note') {
    var d = draftItem(e.target.getAttribute('data-id'));
    if (d) { d.note = e.target.value; }
  }
});

document.addEventListener('change', function(e){
  var el = e.target, a = el.getAttribute('data-action');
  if (!a) return;
  if (a === 'set-role') {
    state.session.role = el.value;
    toast('Now viewing the app as ' + roleName(el.value));
    render();
  }
  else if (a === 'up-owner')  { state.ui.upOwner  = el.value; render(); }
  else if (a === 'up-status') { state.ui.upStatus = el.value; render(); }
  else if (a === 'ms-board')  { state.ui.msBoard = el.value; state.ui.msDomain = ''; render(); }
  else if (a === 'ms-domain') { state.ui.msDomain = el.value; render(); }
  else if (a === 'ms-group')  { state.ui.msGroup  = el.value; render(); }
  else if (a === 'ms-source') { state.ui.msSource = el.value; render(); }
  else if (a === 'ms-band')   { state.ui.msBand   = el.value; render(); }
  else if (a === 'cb-dept')   { state.ui.cbDept   = el.value; render(); }
  else if (a === 'cb-role-filter') { state.ui.cbRole = el.value; render(); }
  else if (a === 'cb-set-role') {
    var person = cb(el.getAttribute('data-id'));
    if (person) { person.role = el.value; toast(person.name + ' is now ' + roleName(el.value), 'ok'); }
    render();
  }
  else if (a === 'my-pick') { state.ui.myPicker = el.value; render(); }
  else if (a === 'my-note') { render(); }
});

document.addEventListener('click', function(e){
  // an open strength picker closes on any click outside itself
  if (state.ui.ecoPick && e.target.closest &&
      !e.target.closest('.ppick') && !e.target.closest('[data-action="eco-dot"]')) {
    state.ui.ecoPick = null; render();
  }

  // never let a click inside a form control trigger a row-level action
  var tag = e.target.tagName;
  if (tag === 'SELECT' || tag === 'TEXTAREA' || (tag === 'INPUT' && e.target.type !== 'checkbox')) return;

  var el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!el) return;
  var a = el.getAttribute('data-action'), id = el.getAttribute('data-id');
  if (a === 'login') return;

  switch (a) {
    /* --- shell --- */
    case 'logout':
      state.ui.msDetail = null; state.ui.modal = null; state.ui.myDraft = null;
      state.session.role = 'admin';
      renderLayer();
      location.hash = '#/login';
      break;
    case 'close-layer': closeLayer(); break;
    case 'confirm-yes':
      var fn = pendingConfirm; closeLayer();
      if (fn) fn();
      render();
      break;

    /* --- dashboard: ecosystem map --- */
    /* A new breakdown means the open drill-down belongs to a category that may
       no longer exist, so it closes with the change. */
    case 'gv-dim':     state.ui.gvDim = el.getAttribute('data-id'); state.ui.gvDrill = null; render(); break;
    case 'gv-measure': state.ui.gvMeasure = el.getAttribute('data-id'); render(); break;
    case 'gv-view':    state.ui.gvView    = el.getAttribute('data-id'); render(); break;
    /* A new scope means the open list may no longer be in it, so it closes. */
    case 'ug-board':   state.ui.ugBoard = el.getAttribute('data-id'); state.ui.ugDrill = null; render(); break;
    case 'ug-drill': {
      var ukind = el.getAttribute('data-kind'), ukey = el.getAttribute('data-k');
      var open = state.ui.ugDrill;
      state.ui.ugDrill = (!ukey || (open && open.kind === ukind && open.key === ukey))
        ? null : { kind:ukind, key:ukey };
      render();
      break;
    }
    case 'ug-view':    state.ui.ugView    = el.getAttribute('data-id'); render(); break;
    /* Clicking the open bar again closes it. */
    case 'gv-drill': {
      var key = el.getAttribute('data-k') || '';
      state.ui.gvDrill = (!key || state.ui.gvDrill === key) ? null : key;
      render();
      break;
    }

    case 'eco-dot':
      state.ui.ecoPick = state.ui.ecoPick === id ? null : id;
      render(); break;
    case 'eco-set':
      ecoSetStrength(id, el.getAttribute('data-v')); break;
    case 'eco-filter':
      var fv = el.getAttribute('data-v');
      state.ui.ecoFilter = state.ui.ecoFilter === fv ? '' : fv;
      render(); break;
    case 'eco-export': ecoExport(); break;
    case 'eco-print':  ecoPrint();  break;

    /* --- Microsoft profiles --- */
    case 'ms-open':   state.ui.msDetail = id; renderLayer(); break;
    case 'sort-ms':
      var k = el.getAttribute('data-key');
      state.ui.msDir = state.ui.msSort === k ? -state.ui.msDir : 1;
      state.ui.msSort = k; render(); break;
    case 'ms-reset':
      state.ui.msSearch = ''; state.ui.msBoard = ''; state.ui.msDomain = ''; state.ui.msGroup = '';
      state.ui.msSource = ''; state.ui.msBand = ''; render(); break;
    case 'ms-new':  openModal({ type:'ms' }); break;
    case 'ms-edit': state.ui.msDetail = null; openModal({ type:'ms', id:id }); break;
    case 'ms-delete':
      var mp = ms(id);
      pendingConfirm = function(){ deleteMsProfile(id); };
      openModal({ type:'confirm', title:'Delete Microsoft profile', sub:'This cannot be undone in the mockup.',
        body:'Delete <b>' + esc(mp ? mp.name : '') + '</b>? ' + msStats(id).count +
             ' registered relation(s) will be removed as well.', okLabel:'Delete', danger:true });
      break;
    case 'ms-save':
      var name = val('f-name');
      if (!name) { toast('A name is required', 'err'); return; }
      var doms = Array.prototype.slice.call(document.querySelectorAll('.f-dom:checked')).map(function(x){ return x.value; });
      // Unmarked is a fallback, never a co-domain: it applies only when nothing else does.
      var real = doms.filter(function(x){ return x !== UNMARKED_ID; });
      doms = real.length ? real : [UNMARKED_ID];
      var picked = [];
      var csel = document.getElementById('f-customers');
      if (csel) for (var ci = 0; ci < csel.options.length; ci++) {
        if (csel.options[ci].selected) picked.push(csel.options[ci].value);
      }
      var payload = { name:name, title:val('f-title'), email:val('f-email'), phone:val('f-phone'),
                      group:val('f-group'), source:val('f-source'), domainIds:doms,
                      notes:val('f-notes'), updatedAt:today(),
                      ownerId:val('f-owner'), cadence:val('f-cadence') || 'none',
                      customerIds:picked };
      if (id) { var t = ms(id); for (var key in payload) t[key] = payload[key]; toast('Updated ' + name, 'ok'); }
      else { payload.id = uid('m'); state.msProfiles.push(payload); toast('Added ' + name, 'ok'); }
      closeLayer(); render();
      break;

    /* --- Dashboards --- */
    case 'board-new':  openModal({ type:'board' }); break;
    case 'board-edit': openModal({ type:'board', id:id }); break;
    case 'board-save':
      var blabel = val('f-blabel');
      if (!blabel) { toast('A dashboard name is required', 'err'); return; }
      if (id) {
        var eb = boardById(id);
        eb.label = blabel; eb.subtitle = val('f-bsub'); eb.owner = val('f-bowner');
        eb.version = val('f-bversion'); eb.updated = val('f-bupdated');
        toast('Updated ' + blabel, 'ok');
        closeLayer(); render();
      } else {
        var slug = boardSlug(blabel);
        var nb = { id:slug, label:blabel, dashboard:'dashboard-' + slug, graphics:'graphic-view-' + slug,
                   subtitle:val('f-bsub'), owner:val('f-bowner'),
                   version:val('f-bversion') || 'v0.1 draft', updated:val('f-bupdated') };
        state.boards.push(nb);
        toast('Added ' + blabel + ' - it has no domains yet', 'ok');
        closeLayer();
        go(nb.dashboard);          // land on the new board, empty state and all
      }
      break;
    case 'board-delete':
      var db = boardById(id);
      if (!db || db.system) { toast('The landing dashboard cannot be deleted', 'err'); return; }
      var dbDoms = boardDomains(id).length;
      if (dbDoms) {
        toast('Move or delete its ' + dbDoms + ' domain(s) first', 'err');
        return;
      }
      pendingConfirm = function(){ deleteBoard(id); };
      openModal({ type:'confirm', title:'Delete dashboard', sub:'This cannot be undone in the mockup.',
        body:'Delete <b>' + esc(db.label) + '</b>? It holds no domains, so no Microsoft profile or ' +
             'relationship is affected - only the two pages disappear from the menu.',
        okLabel:'Delete', danger:true });
      break;

    /* --- Microsoft domains --- */
    case 'dom-new':  openModal({ type:'dom' }); break;
    case 'dom-edit':
      if ((dom(id) || {}).system) { toast('The Unmarked domain cannot be edited', 'err'); return; }
      openModal({ type:'dom', id:id });
      break;
    case 'dom-delete':
      if ((dom(id) || {}).system) { toast('The Unmarked domain cannot be deleted', 'err'); return; }
      var used = domainStats(id).profiles;
      pendingConfirm = function(){
        var d = dom(id);
        state.domains = state.domains.filter(function(x){ return x.id !== id; });
        // Nobody is orphaned: profiles left without a domain land in Unmarked.
        state.msProfiles.forEach(function(p){
          p.domainIds = p.domainIds.filter(function(x){ return x !== id; });
          if (!p.domainIds.length) p.domainIds = [UNMARKED_ID];
        });
        toast('Deleted domain ' + (d ? d.name : '') +
              (used ? ' - ' + used + ' profile(s) moved to Unmarked' : ''), 'ok');
      };
      openModal({ type:'confirm', title:'Delete domain',
        sub: used ? 'The profiles mapped to it are not deleted.' : 'No profiles are mapped to it.',
        body:'Delete <b>' + esc((dom(id)||{}).name) + '</b>?' +
             (used ? '<br><span class="hint"><b>' + used + '</b> Microsoft profile(s) mapped only to this domain will move to <b>Unmarked</b>.</span>' : ''),
        okLabel:'Delete', danger:true });
      break;
    case 'dom-save':
      var dn = val('f-dname');
      if (!dn) { toast('A domain name is required', 'err'); return; }
      if (id) { var dd = dom(id); dd.name = dn; dd.owner = val('f-downer'); dd.desc = val('f-ddesc');
                dd.dept = val('f-ddept') || dd.dept; toast('Updated ' + dn, 'ok'); }
      else {
        // Unmarked always sits last, so insert ahead of it.
        var at = state.domains.length;
        state.domains.forEach(function(x, i){ if (x.system && i < at) at = i; });
        state.domains.splice(at, 0, { id:uid('d'), dept:val('f-ddept') || boards()[0].id,
                                      name:dn, owner:val('f-downer'), desc:val('f-ddesc') });
        toast('Added ' + dn, 'ok');
      }
      closeLayer(); render();
      break;

    /* --- Columbus profiles --- */
    case 'sort-cb':
      var ck = el.getAttribute('data-key');
      state.ui.cbDir = state.ui.cbSort === ck ? -state.ui.cbDir : 1;
      state.ui.cbSort = ck; render(); break;
    case 'cb-reset': state.ui.cbSearch = ''; state.ui.cbDept = ''; state.ui.cbRole = ''; render(); break;
    case 'cb-toggle': state.ui.cbOpen = state.ui.cbOpen === id ? null : id; render(); break;
    case 'cb-new':  openModal({ type:'cb' }); break;
    case 'cb-save':
      var cn = val('f-cname');
      if (!cn) { toast('A name is required', 'err'); return; }
      var roleId = 'standard';
      ROLES.forEach(function(r){ if (r.name === val('f-crole')) roleId = r.id; });
      var skills = val('f-cskills').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      state.columbusProfiles.push({ id:uid('c'), name:cn, title:val('f-ctitle'), department:val('f-cdept'),
        skills:skills, role:roleId, email:val('f-cmail') });
      toast('Created ' + cn, 'ok');
      closeLayer(); render();
      break;
    case 'cb-delete':
      var cp = cb(id);
      pendingConfirm = function(){ deleteColumbusUser(id); };
      openModal({ type:'confirm', title:'Delete Columbus user', sub:'This cannot be undone in the mockup.',
        body:'Delete <b>' + esc(cp ? cp.name : '') + '</b>? ' + cbStats(id).count +
             ' relation(s) will be removed with them.', okLabel:'Delete', danger:true });
      break;

    /* --- my relations --- */
    case 'my-score':
      var di = draftItem(id);
      if (di) { di.score = parseInt(el.getAttribute('data-score'), 10); }
      render(); break;
    case 'my-remove':
      var dr = draftItem(id);
      if (dr) { dr.removed = true; dr.pending = false; }
      render(); break;
    case 'my-undo':
      var du = draftItem(id);
      if (du) du.removed = false;
      render(); break;
    case 'my-add':
      var pick = state.ui.myPicker;
      if (pick && !draftItem(pick)) {
        state.ui.myDraft.push({ msProfileId:pick, score:0, note:'', origScore:null, origNote:'', removed:false });
        state.ui.myPicker = '';
        toast('Added ' + (ms(pick) || {}).name + ' - set a score and submit');
      }
      render(); break;
    case 'my-reset': state.ui.myDraft = null; toast('Discarded your unsaved changes'); render(); break;
    case 'my-save': saveMyRelations(); render(); break;

    /* --- relationship upkeep --- */
    case 'sort-up':
      var uk = el.getAttribute('data-key');
      state.ui.upDir = state.ui.upSort === uk ? -state.ui.upDir : 1;
      state.ui.upSort = uk; render(); break;
    case 'up-reset':
      state.ui.upSearch = ''; state.ui.upOwner = ''; state.ui.upStatus = ''; render(); break;
    case 'contact-log':
      registerContact(id);
      render(); renderLayer(); break;
    case 'upkeep-preview': openModal({ type:'mail' }); break;
  }
});

document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (state.ui.ecoPick) { state.ui.ecoPick = null; render(); return; }
  if (state.ui.modal || state.ui.msDetail) closeLayer();
});

// Hovering a group panel highlights its spoke and dims the rest of the board.
var ecoHot = null;
document.addEventListener('mouseover', function(e){
  if (state.ui.route !== 'dashboard' || !e.target.closest) return;
  var p = e.target.closest('[data-panel]');
  var id = p ? p.getAttribute('data-panel') : null;
  if (id === ecoHot) return;
  ecoHot = id;
  ecoHover(id);
});

/* ------------------------------------------------------------
   Shared hover tooltip. One box on <body>, so it is never clipped by a
   scrolling table or misplaced by the scaled dashboard canvas.
   [data-tip]     - plain text
   [data-tip-id]  - rich HTML from TIP_HTML
   ------------------------------------------------------------ */
var tipBox = document.createElement('div');
tipBox.className = 'tipbox';
tipBox.setAttribute('role', 'tooltip');
document.body.appendChild(tipBox);
var tipHost = null;

function tipShow(el){
  if (el === tipHost) return;
  var id = el.getAttribute('data-tip-id');
  if (id) {
    if (!TIP_HTML[id]) return;
    tipBox.innerHTML = TIP_HTML[id]();
  } else {
    tipBox.textContent = el.getAttribute('data-tip') || '';
  }
  tipHost = el;
  tipBox.classList.add('is-on');
  tipPlace(el);
}
function tipPlace(el){
  var r = el.getBoundingClientRect(), b = tipBox.getBoundingClientRect(), pad = 8;
  var top = r.top - b.height - pad;                       // above by default
  if (top < pad) top = r.bottom + pad;                    // flip below if it would clip
  if (top + b.height > window.innerHeight - pad) top = Math.max(pad, window.innerHeight - b.height - pad);
  var left = r.left + r.width / 2 - b.width / 2;          // centred, then clamped
  left = Math.max(pad, Math.min(left, window.innerWidth - b.width - pad));
  tipBox.style.left = Math.round(left) + 'px';
  tipBox.style.top  = Math.round(top) + 'px';
}
function tipHide(){
  if (!tipHost) return;
  tipHost = null;
  tipBox.classList.remove('is-on');
}
function tipTarget(node){
  return node && node.closest ? node.closest('[data-tip],[data-tip-id]') : null;
}
document.addEventListener('mouseover', function(e){
  var t = tipTarget(e.target);
  if (t) tipShow(t); else tipHide();
});
document.addEventListener('focusin',  function(e){
  var t = tipTarget(e.target);
  if (t) tipShow(t); else tipHide();
});
document.addEventListener('focusout', tipHide);
window.addEventListener('scroll', tipHide, true);
window.addEventListener('resize', tipHide);
// A re-render throws away the element the tooltip was anchored to, so any click
// that is not on the tip's own trigger closes it.
document.addEventListener('click', function(e){
  if (tipTarget(e.target) !== tipHost) tipHide();
}, true);

/* ============================================================
   15. INIT
   ============================================================ */

seedUpkeep();
readHash();
if (state.ui.route !== 'login' && !location.hash) location.hash = '#/login';
render();
renderLayer();
</script>
